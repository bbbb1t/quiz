<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#FFFFFF"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="软工刷题"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2358CC02'/%3E%3Ctext x='32' y='44' font-size='26' font-weight='bold' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E✓%3C/text%3E%3C/svg%3E"/>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2358CC02'/%3E%3Ctext x='32' y='44' font-size='26' font-weight='bold' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E✓%3C/text%3E%3C/svg%3E"/>
<title>人工智能导论 · 刷题</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --green:#58CC02; --green-d:#46A302; --green-l:#D7FFB8;
  --blue:#1CB0F6; --blue-d:#1899D6; --purple:#CE82FF; --purple-d:#A568CC;
  --orange:#FF9600; --orange-d:#E08600; --red:#FF4B4B; --red-d:#D33131;
  --gold:#FFC800; --teal:#00CD9C;
  --ink:#3C3C3C; --ink2:#4B4B4B; --muted:#AFAFAF; --line:#E5E5E5; --bg:#FFFFFF; --soft:#F7F7F7;
}
html,body{margin:0;padding:0;height:100%}
body{
  background:#F2F4F7; color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.app{max-width:560px;margin:0 auto;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;
  position:relative;overflow:hidden;box-shadow:0 0 60px rgba(20,30,60,.06)}
@media (max-width:600px){.app{box-shadow:none}}

/* ---------- Duolingo-ish buttons ---------- */
.btn{border:0;border-radius:16px;padding:14px 18px;font-size:15px;font-weight:800;font-family:inherit;
  letter-spacing:.02em;cursor:pointer;transition:transform .06s, box-shadow .06s;display:inline-flex;
  align-items:center;justify-content:center;gap:6px;text-transform:none}
.btn.primary{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-d)}
.btn.blue:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-d)}
.btn.ghost{background:#fff;color:var(--ink2);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.wide{width:100%}
.btn.small{padding:10px 14px;font-size:13px;border-radius:13px}
.btn:disabled{opacity:.45;pointer-events:none}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:4px 9px;
  border-radius:8px;background:var(--soft);color:#777;border:1.5px solid var(--line)}
.chip.key{background:#FFF6DB;color:#B07800;border-color:#FFE8A3}
.chip.mian{background:#F3F4F7;color:#9AA0AD}
.chip.zhong{background:#FFF6DB;color:#B07800;border-color:#FFE8A3}
.chip.nan{background:#FFEDED;color:#D33131;border-color:#FFD3D3}
.chip.type{background:#EAF7FF;color:#1899D6;border-color:#CDEEFF}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 16px;
  background:#fff;border-bottom:2px solid var(--line)}
.top .ttl{font-size:15px;font-weight:900;flex:1;text-align:center;letter-spacing:.01em}
.iconbtn{width:38px;height:38px;border-radius:13px;border:2px solid var(--line);background:#fff;color:#7B7B7B;
  display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;font-weight:800;
  box-shadow:0 3px 0 var(--line)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}

/* ---------- home header ---------- */
.hhead{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.hhead .logo{font-size:17px;font-weight:900;letter-spacing:-.01em;color:var(--green-d);display:flex;
  align-items:center;gap:8px}
.hhead .logo svg{width:26px;height:26px}
.hhead .spacer{flex:1}
.pill{display:flex;align-items:center;gap:5px;background:#FFF6DB;border:2px solid #FFE8A3;color:#B07800;
  font-weight:900;font-size:13px;padding:5px 10px;border-radius:12px}
.pill.blue{background:#EAF7FF;border-color:#CDEEFF;color:#1899D6}

/* ---------- daily card ---------- */
.daily{margin:12px 16px 0;border:2px solid var(--line);border-radius:20px;padding:16px;
  background:linear-gradient(180deg,#FFFFFF,#FAFFFA);display:flex;align-items:center;gap:14px}
.daily .ring{flex:none;position:relative}
.daily .ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-size:17px;font-weight:900;color:var(--green-d);line-height:1.1}
.daily .ring b small{font-size:9px;font-weight:800;color:var(--muted);letter-spacing:.08em}
.daily .info{flex:1;min-width:0}
.daily .kicker{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.1em}
.daily .h1{font-size:19px;font-weight:900;letter-spacing:-.02em;margin:2px 0 4px}
.daily .sub{font-size:12px;color:#8C8C8C}

/* ---------- quick grid ---------- */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 16px 0}
.quick button{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 4px 10px;
  font-family:inherit;font-size:11px;font-weight:800;color:var(--ink2);cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:6px;box-shadow:0 3px 0 var(--line)}
.quick button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.quick em{font-style:normal;width:32px;height:32px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;font-size:17px;background:#F0FFF0}

/* ---------- learning path ---------- */
.pathwrap{margin:18px 16px 34px;position:relative}
.path-title{font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.12em;margin:0 4px 14px}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px}
.path:before{content:"";position:absolute;left:50%;top:10px;bottom:10px;width:0;border-left:3px dashed #E8E8E8}
.step{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.step:nth-child(odd){align-items:flex-end;padding-right:22%}
.step:nth-child(even){align-items:flex-start;padding-left:22%}
.node{width:76px;height:76px;border-radius:50%;border:0;cursor:pointer;position:relative;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:15px;
  box-shadow:0 6px 0 rgba(0,0,0,.16);transition:transform .08s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.16)}
.node .pct{font-size:15px;letter-spacing:-.02em}
.node .ico{font-size:26px}
.node.done{background:var(--gold)!important;color:#7A5B00;box-shadow:0 6px 0 #D9A800}
.step .label{font-size:12.5px;font-weight:800;color:var(--ink2);text-align:center;max-width:150px}
.step .label small{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-top:2px}
.step button.start{border:0;font-family:inherit;cursor:pointer;background:var(--green);color:#fff;font-size:11px;font-weight:900;padding:6px 12px;border-radius:11px;
  box-shadow:0 3px 0 var(--green-d);margin-top:-2px}

/* ---------- study ---------- */
.bar{height:14px;background:#E9EDF2;border-radius:99px;margin:14px 16px 0;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .35s;
  box-shadow:inset 0 4px 0 rgba(255,255,255,.28)}
.card{background:#fff;border:2px solid var(--line);border-radius:20px;margin:14px 16px 0;padding:18px}
.ctop{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.ctop .fav{margin-left:auto;border:0;background:transparent;font-size:20px;color:#D8D8D8;cursor:pointer;padding:0 2px}
.ctop .fav.on{color:var(--gold)}
.stem{font-size:16.5px;line-height:1.7;font-weight:800;letter-spacing:-.01em;color:#2B2B2B}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:2px solid var(--line);
  border-radius:14px;padding:12px 13px;font-family:inherit;font-size:14.5px;line-height:1.55;color:#3C3C3C;
  cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .06s, box-shadow .06s;font-weight:600}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt .k{flex:none;width:26px;height:26px;border-radius:9px;background:#F2F4F7;color:#7B7B7B;font-size:12.5px;
  font-weight:900;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--blue);box-shadow:0 3px 0 var(--blue-d);background:#F3FBFF}
.opt.sel .k{background:var(--blue);color:#fff}
.opt.ok{border-color:var(--green);box-shadow:0 3px 0 var(--green-d);background:#F1FFE6}
.opt.ok .k{background:var(--green);color:#fff}
.opt.bad{border-color:var(--red);box-shadow:0 3px 0 var(--red-d);background:#FFF2F2;animation:shake .3s}
.opt.bad .k{background:var(--red);color:#fff}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.fb{margin-top:14px;border-radius:16px;padding:14px;border:2px solid var(--line);background:#FAFAFA}
.fb.ok{background:#F1FFE6;border-color:#C9F0A6}
.fb.bad{background:#FFF2F2;border-color:#FFC9C9}
.fb .head{font-size:15px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fb.ok .head{color:var(--green-d)} .fb.bad .head{color:var(--red-d)}
.fb .head .ans{margin-left:auto;font-size:11.5px;font-weight:800;color:#5B6470;background:#fff;
  border:1.5px solid var(--line);border-radius:9px;padding:3px 8px}
.fb .kp{margin-top:9px;font-size:12.5px;color:#5B6470;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fb .kplink{border:1.5px solid #CDEEFF;background:#EAF7FF;color:#1899D6;font-weight:900;font-family:inherit;
  font-size:12px;padding:4px 10px;border-radius:9px;cursor:pointer}
.fb .exp{margin-top:9px;font-size:13px;line-height:1.75;color:#4B4B4B;white-space:pre-wrap}
.ref{margin-top:10px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;
  font-size:13px;line-height:1.75;color:#3C3C3C}
.ref b{display:block;font-size:11.5px;color:var(--blue-d);margin-bottom:4px;font-weight:900}
.why{margin-top:10px;background:#fff;border:1.5px solid #FFD3D3;border-radius:12px;padding:11px 12px}
.why b{font-size:12px;color:var(--red-d);display:block;margin-bottom:5px;font-weight:900}
.why .line2{font-size:12.5px;color:#4B4B4B;line-height:1.75}
.why .line2 em{font-style:normal;color:var(--red-d);font-weight:900}
.why .line2 i{font-style:normal;color:var(--green-d);font-weight:900}

.ctrl{display:flex;gap:9px;margin:16px 16px 26px}
.ctrl .btn{flex:1}
.ctrl .btn.primary{flex:1.5}
.meta{text-align:center;font-size:11px;color:#B5B5B5;margin:8px 16px 0}

/* ---------- summary ---------- */
.sum{padding:30px 20px;text-align:center}
.sum h2{font-size:24px;margin:16px 0 4px;letter-spacing:-.02em;font-weight:900}
.sum p{color:var(--muted);font-size:13px;margin:0}
.sumstats{display:flex;justify-content:center;gap:22px;margin:22px 0 26px;flex-wrap:wrap}
.sumstats div{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.06em}
.sumstats b{display:block;font-size:24px;color:var(--ink);font-weight:900;letter-spacing:-.02em;margin-bottom:2px}

/* ---------- lists ---------- */
.sec{margin:20px 16px 6px;display:flex;align-items:center;justify-content:space-between}
.sec .t{font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.12em}
.sec .l{border:0;background:transparent;color:var(--blue-d);font-size:12px;font-weight:900;font-family:inherit;cursor:pointer}
.list{margin:0 16px 28px;display:flex;flex-direction:column;gap:9px}
.item{background:#fff;border:2px solid var(--line);border-radius:16px;padding:13px 14px;cursor:pointer;
  box-shadow:0 3px 0 var(--line)}
.item:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.item .m{font-size:10.5px;color:var(--muted);display:flex;gap:8px;font-weight:800;letter-spacing:.04em}
.item p{margin:6px 0 0;font-size:13.5px;color:#3C3C3C;line-height:1.55;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600}
.item .ans{font-size:11.5px;color:var(--green-d);margin-top:7px;font-weight:800;line-height:1.5}
.item .ans span{color:#8C8C8C;font-weight:600}

/* kp */
details.grp{background:#fff;border:2px solid var(--line);border-radius:16px;box-shadow:0 3px 0 var(--line);
  overflow:hidden}
details.grp>summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;align-items:center;gap:9px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .t{font-size:13.5px;font-weight:900;flex:1;min-width:0;padding-right:6px;line-height:1.4}
details.grp>summary .n{font-size:10.5px;color:var(--muted);font-weight:800;flex:none;white-space:nowrap}
details.grp>summary .ar{color:#C9C9C9;transition:.2s;font-size:12px;font-weight:900}
details.grp[open]>summary .ar{transform:rotate(90deg)}
.kprow{display:flex;align-items:center;gap:9px;padding:11px 15px;border-top:2px solid #F2F2F2;cursor:pointer}
.kprow:active{background:#FAFAFA}
.kprow .t{font-size:13px;color:#3C3C3C;flex:1;font-weight:700}
.kprow .mini{width:52px;height:8px;border-radius:99px;background:#EDEDED;overflow:hidden;flex:none}
.kprow .mini i{display:block;height:100%;background:var(--green);border-radius:99px}
.kprow .s{font-size:10.5px;color:var(--muted);font-weight:800;flex:none;width:30px;text-align:right}

/* kd cards */
.kdcard{background:#fff;border:2px solid var(--line);border-radius:18px;padding:15px 16px;box-shadow:0 3px 0 var(--line)}
.kdcard .top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.kdcard .nm{font-size:15px;font-weight:900;letter-spacing:-.01em}
.kdcard .sl{font-size:10.5px;color:var(--muted);margin-left:auto;font-weight:800}
.kdcard ul{margin:6px 0 10px;padding-left:16px}
.kdcard li{font-size:12.5px;line-height:1.7;color:#4B4B4B;margin-bottom:4px;font-weight:600}
.kdcard .foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kdcard .cnt{font-size:11px;color:var(--muted);font-weight:800}
.kdcard .go{margin-left:auto}
.kdnote{margin:0 16px 12px;font-size:11.5px;color:#9A9A9A;line-height:1.7}
.kdrow{display:flex;align-items:center;gap:10px;padding:13px 14px}
.kdrow b{font-size:14.5px;font-weight:900;letter-spacing:-.01em}
.kdrow-n{margin-left:auto;font-size:11.5px;color:#9A9A9A;font-weight:800}
.kdrow-a{color:#CFCFCF;font-weight:900;font-size:15px}

.menu-list{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--line);
  background:#fff;border-radius:14px;padding:13px 14px;font-family:inherit;font-size:14px;font-weight:800;
  color:var(--ink);cursor:pointer;text-decoration:none;box-shadow:0 3px 0 var(--line)}
.mi:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.mi span{font-size:18px;width:24px;text-align:center}
.mi i{margin-left:auto;font-style:normal;color:#C9C9C9;font-weight:900}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:56px 24px;line-height:1.9}
.ava{width:38px;height:38px;border-radius:13px;border:2px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.ava.big{width:62px;height:62px;border-radius:20px;font-size:32px;box-shadow:0 4px 0 var(--line);cursor:default}
.avaimg-wrap{display:inline-flex;align-items:center;justify-content:center;overflow:hidden;padding:0}
.avaimg{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.ava .avaimg-wrap{width:100%;height:100%;border-radius:inherit}
.rkava .avaimg-wrap{width:26px;height:26px;border-radius:8px;display:inline-flex}
.inp{width:100%;border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-size:15px;
  font-family:inherit;font-weight:600;color:var(--ink);margin-bottom:10px;outline:none;background:#fff}
.inp:focus{border-color:var(--blue)}
.line{font-size:11.5px;font-weight:900;color:#9A9A9A;letter-spacing:.08em;margin:16px 0 8px}
.avapick{display:flex;flex-wrap:wrap;gap:8px}
.avapick button{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:#fff;
  font-size:21px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.avapick button.on{border-color:var(--green);box-shadow:0 3px 0 var(--green-d);background:#F1FFE6}
.sw{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;color:#4B4B4B}
.sw input{width:20px;height:20px;accent-color:#58CC02}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:6px 0 4px}
.stats3 div{background:#FAFAFA;border:2px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.stats3 b{display:block;font-size:20px;font-weight:900;letter-spacing:-.02em}
.stats3 span{font-size:10.5px;color:#9A9A9A;font-weight:800}
.tabs{display:flex;gap:8px;padding:14px 16px 4px}
.tabs button{flex:1;border:2px solid var(--line);background:#fff;border-radius:13px;padding:10px 4px;
  font-family:inherit;font-size:12.5px;font-weight:900;color:#7B7B7B;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.tabs button.on{background:#F1FFE6;border-color:var(--green);color:var(--green-d);box-shadow:0 3px 0 var(--green-d)}
.rankrow{display:flex;align-items:center;gap:10px;padding:12px 14px}
.rankrow .rk{width:26px;text-align:center;font-weight:900;font-size:13px;color:#B5B5B5}
.rankrow .rkava{font-size:20px}
.rankrow b{font-size:14px;font-weight:900;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rankrow .rkval{font-size:12.5px;font-weight:900;color:var(--green-d)}
.empty .big{font-size:40px;display:block;margin-bottom:10px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;background:rgba(20,20,30,.42);display:flex;align-items:flex-end;
  justify-content:center;z-index:60}
.sheet-wrap[hidden]{display:none}
.sheet{width:100%;max-width:560px;background:#fff;border-radius:22px 22px 0 0;padding:20px 18px 26px;
  animation:up .24s ease;max-height:86vh;overflow:auto;border-top:3px solid var(--line)}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.sheet h3{margin:0 0 3px;font-size:18px;font-weight:900}
.sheet .sub{font-size:12px;color:var(--muted);margin-bottom:12px}
.sheet .line{font-size:11.5px;color:#8C8C8C;font-weight:900;letter-spacing:.08em;margin:16px 0 7px}
.sheet textarea{width:100%;min-height:96px;border:2px solid var(--line);border-radius:12px;padding:10px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#555;resize:vertical}

.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(12px);background:#3C3C3C;color:#fff;
  font-size:12.5px;font-weight:800;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;
  transition:.2s;z-index:80;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.on{opacity:1;transform:translateX(-50%)}
.qimgs{margin-top:12px;display:flex;flex-direction:column;gap:8px}

","ch":"c8","qids":["c8q25","c8q26","c8q27","c8q39","c8q44"]},{"id":"c8k10","name":"AI 智能体与多智能体系统","ch":"c8","qids":["c8q28","c8q29","c8q30","c8q40","c8q47","c8q48","c8q49","c8q50"]}],"qids":["c8q1","c8q2","c8q3","c8q4","c8q5","c8q6","c8q7","c8q8","c8q9","c8q10","c8q11","c8q12","c8q13","c8q14","c8q15","c8q16","c8q17","c8q18","c8q19","c8q20","c8q21","c8q22","c8q23","c8q24","c8q25","c8q26","c8q27","c8q28","c8q29","c8q30","c8q31","c8q32","c8q33","c8q34","c8q35","c8q36","c8q37","c8q38","c8q39","c8q40","c8q41","c8q42","c8q43","c8q44","c8q45","c8q46","c8q47","c8q48","c8q49","c8q50"]}],"kps":[{"id":"c1k1","name":"AI 的诞生与发展历程","ch":"c1","qids":["c1q1","c1q11"],"chName":"第一章、第二章","note":"1956 年夏达特茅斯会议首次提出 Artificial Intelligence 一词，标志学科正式诞生。此后经历推理期、知识期、机器学习期三次浪潮；1997 年深蓝击败卡斯帕罗夫、2016 年 AlphaGo 战胜李世石是两个标志性节点。"},{"id":"c1k2","name":"图灵测试与“中文屋”之争","ch":"c1","qids":["c1q2","c1q3"],"chName":"第一章、第二章","note":"图灵测试用「模仿游戏」定义智能：询问者通过问答分辨不出对方是人还是机器，机器即通过测试，它关注可观察的行为表现。塞尔的「中文屋」反驳：按规则操作符号不等于理解语义，据此质疑强人工智能。"},{"id":"c1k3","name":"三大学派与人工智能的定义","ch":"c1","qids":["c1q4","c1q5","c1q13","c1q16","c1q19"],"chName":"第一章、第二章","note":"三大学派：符号主义（物理符号系统假设，智能＝符号运算）、连接主义（智能源于神经元联结，学习＝调整权重）、行为主义（智能源于感知—行动控制环）。人工智能的定义可概括为：智能＝知识＋智力，智力是获取与应用知识的能力。"},{"id":"c1k4","name":"谓词逻辑表示法","ch":"c1","qids":["c1q6","c1q8","c1q14"],"chName":"第一章、第二章","note":"谓词逻辑用个体、谓词、量词和联结词描述知识。表示规律：全称量词配蕴含 ∀x(P(x)→Q(x)) 表示「所有 P 都是 Q」；存在量词配合取 ∃x(P(x)∧Q(x)) 表示「存在 P 且 Q」。特点是形式严密、便于精确推理，但不擅长表达模糊与可信度。"},{"id":"c1k5","name":"产生式表示法","ch":"c1","qids":["c1q7","c1q12","c1q18"],"chName":"第一章、第二章","note":"产生式以 IF P THEN Q 的规则形式表示知识，系统由规则库、综合数据库（工作记忆）、推理机三部分组成。与蕴含式相比更宽泛：条件可模糊、允许近似匹配、可附可信度，是专家系统最经典的表示方法。"},{"id":"c1k6","name":"框架表示法","ch":"c1","qids":["c1q10","c1q17"],"chName":"第一章、第二章","note":"框架表示法由明斯基提出，用「框架—槽—侧面」描述对象：槽是固定属性的空位，侧面是槽的细分。重要特性是继承性，子框架可继承父框架的缺省值，贴近人类常识推理。"},{"id":"c1k7","name":"知识图谱","ch":"c1","qids":["c1q9","c1q20"],"chName":"第一章、第二章","note":"知识图谱以（实体，关系，实体）或（实体，属性，属性值）三元组为基本单元。构建方式有两类：自顶向下（专家先建本体模式再填数据）与自底向上（先抽取实体关系再归纳模式），两者并存。"},{"id":"c1k8","name":"医学知识的不确定性","ch":"c1","qids":["c1q15"],"chName":"第一章、第二章","note":"医学知识的不确定性来自四方面：随机性（疗效个体差异）、模糊性（「高热」无统一阈值）、经验性（专家临床经验）、不完全性（病理机制认识不全）。这是医学 AI 必须引入不确定性推理的根本原因。"},{"id":"c1k9","name":"简答：产生式与蕴含式的比较","ch":"c1","qids":["c1q21"],"chName":"第一章、第二章","note":"产生式与蕴含式的共同点：都是「若…则…」的条件—结论结构。不同点：产生式左部可为多条件组合、条件可模糊、允许近似匹配、可带可信度因子；蕴含式必须真值确定、精确匹配，只表达严格的逻辑关系。"},{"id":"c2k1","name":"推理的基本概念与推理机","ch":"c2","qids":["c2q1","c2q16"],"chName":"第三章","note":"推理是从已知事实和知识推出新结论的过程。推理机是执行推理的部件，主要任务是模式匹配、冲突消解、执行规则并控制推理顺序。"},{"id":"c2k2","name":"推理的分类：演绎、归纳、默认与单调性","ch":"c2","qids":["c2q2","c2q3","c2q4"],"chName":"第三章","note":"按结论的可靠性分：演绎推理（一般→个别，前提真则结论必真）、归纳推理（个别→一般，结论或然）、默认推理（缺省假设）。按知识增长方式分：单调推理（结论只增不减）与非单调推理（新信息可推翻旧结论）。"},{"id":"c2k3","name":"推理方向：正向、逆向、混合","ch":"c2","qids":["c2q5","c2q6","c2q17","c2q22"],"chName":"第三章","note":"正向推理：数据驱动，从已知事实出发找可用规则推结论；逆向推理：目标驱动，先假设结论再找支持它的前提；混合推理：正反向交替，先用正向缩小范围再用逆向验证。"},{"id":"c2k4","name":"冲突消解策略","ch":"c2","qids":["c2q7","c2q8","c2q23"],"chName":"第三章","note":"冲突消解是多条规则同时匹配时决定先执行哪条的策略，常见有专一性优先、最新事实优先、按上下文限制、按规则优先级等。它只影响搜索效率，不改变推理结果。"},{"id":"c2k5","name":"自然演绎推理","ch":"c2","qids":["c2q9","c2q10","c2q11","c2q18","c2q24"],"chName":"第三章","note":"自然演绎推理直接使用假言推理（P, P→Q ⊢ Q）、拒取式（¬Q, P→Q ⊢ ¬P）、假言三段论等规则从前提推出结论，直观易懂，但容易组合爆炸。"},{"id":"c2k6","name":"谓词公式化为子句集","ch":"c2","qids":["c2q12","c2q13","c2q19"],"chName":"第三章","note":"谓词公式化为子句集共九步：消去蕴含与等价、否定内移、变量标准化、消存在量词（Skolem 化）、消全称量词、化为合取范式、消去合取符号、子句变量改名。子句集是归结推理的输入。"},{"id":"c2k7","name":"鲁宾逊归结原理与归结反演","ch":"c2","qids":["c2q14","c2q15","c2q20","c2q25","c2q26"],"chName":"第三章","note":"鲁宾逊归结原理：两个子句若有互补文字可归结出新子句。归结反演：把待证结论取反加入前提集，反复归结，若能推出空子句（矛盾）则原结论成立。它是机器定理证明的理论基础。"},{"id":"c2k8","name":"确定性推理方法辨析","ch":"c2","qids":["c2q21"],"chName":"第三章","note":"确定性推理要求知识精确、真值只有真假二值，结论可靠；不确定性推理处理随机、模糊、经验、不完全的知识，用可信度、证据、隶属度等度量，结论带有程度。"},{"id":"c3k1","name":"不确定性推理概述","ch":"c3","qids":["c3q1","c3q16"],"chName":"第四章","note":"不确定性推理处理知识的随机性、模糊性、经验性与不完全性。三大类模型：可信度方法（C-F）、证据理论（D-S）、模糊推理。它们都要解决证据不确定性的表示、组合与传播。"},{"id":"c3k2","name":"C-F 可信度模型","ch":"c3","qids":["c3q2","c3q3","c3q4","c3q14","c3q17","c3q21"],"chName":"第四章","note":"C-F 模型用可信度 CF∈[-1,1] 度量规则与结论的可信程度：CF>0 表示支持，CF<0 表示反对，0 表示无关。核心是证据组合公式与结论可信度的合成（串联取小、并联用合成公式）。"},{"id":"c3k3","name":"D-S 证据理论","ch":"c3","qids":["c3q5","c3q6","c3q7","c3q8","c3q15","c3q18","c3q22","c3q24"],"chName":"第四章","note":"D-S 证据理论用识别框架 Θ、基本概率分配 m、信任函数 Bel、似然函数 Pl 描述证据。Dempster 组合规则把多个证据源合成一个，特点是可以表达「不知道」，即把信度分给整个框架而非某个假设。"},{"id":"c3k4","name":"模糊集合与模糊运算","ch":"c3","qids":["c3q9","c3q10","c3q11","c3q19","c3q23"],"chName":"第四章","note":"模糊集合用隶属度 μ∈[0,1] 代替二值归属，隶属函数刻画「程度」。运算上交集取小（∧）、并集取大（∨）、补集为 1−μ。α-截集把模糊集切成普通集合，用于去模糊。"},{"id":"c3k5","name":"模糊推理与模糊决策","ch":"c3","qids":["c3q12","c3q13","c3q20","c3q25"],"chName":"第四章","note":"模糊推理流程：输入精确量模糊化 → 按模糊规则（IF 模糊条件 THEN 模糊结论）推理合成 → 去模糊化得到精确输出。常用去模糊方法有重心法（加权平均）与最大隶属度法。"},{"id":"c4k1","name":"搜索的基本问题与状态空间表示","ch":"c4","qids":["c4q1","c4q3","c4q4","c4q5","c4q26"],"chName":"第五章","note":"状态空间表示法用（状态，算子）描述问题：状态是局面，算子是状态转移。搜索就是在状态图上从初始状态找一条到目标状态的路径。评价搜索算法的四个指标：完备性、最优性、时间复杂度、空间复杂度。"},{"id":"c4k2","name":"搜索策略的分类与目的驱动","ch":"c4","qids":["c4q2","c4q21","c4q22"],"chName":"第五章","note":"搜索策略分两大类：盲目搜索（宽度优先、深度优先、有界深度、迭代加深、等代价）不利用领域知识；启发式搜索（A、A*）用启发函数引导。目的驱动是从目标反向推理，裁剪无关分支。"},{"id":"c4k3","name":"回溯算法与 open 表","ch":"c4","qids":["c4q6","c4q7"],"chName":"第五章","note":"回溯算法是深度优先的变形：选一个算子前进，走不通就退回上一层换算子。open 表存放待扩展节点，closed 表存放已扩展节点，用于防止重复扩展和死循环。"},{"id":"c4k4","name":"宽度优先搜索","ch":"c4","qids":["c4q8","c4q27"],"chName":"第五章","note":"宽度优先搜索用队列逐层扩展，先扩展深度浅的节点。优点是完备，且在边代价相等时保证最短路径；缺点是空间开销随分支因子指数增长。"},{"id":"c4k5","name":"深度优先与有界深度优先搜索","ch":"c4","qids":["c4q9","c4q10","c4q28"],"chName":"第五章","note":"深度优先搜索用栈一路深入，空间省但可能陷入无穷深支、不保证最优。有界深度搜索限定最大深度，兼顾完备性与空间；迭代加深逐步放宽深度上限，兼具两者的优点。"},{"id":"c4k6","name":"启发式搜索与 A* 算法","ch":"c4","qids":["c4q11","c4q12","c4q13","c4q23"],"chName":"第五章","note":"启发式搜索用 f(n)=g(n)+h(n) 评价节点：g 是已走代价，h 是到目标的估计代价。h 满足可采纳性（不高估真实代价）时 A* 保证最优；h 越接近真实值，搜索越集中、效率越高。"},{"id":"c4k7","name":"蒙特卡洛树搜索与 UCT","ch":"c4","qids":["c4q14","c4q15","c4q29"],"chName":"第五章","note":"蒙特卡洛树搜索四步循环：选择（按树策略下行）、扩展（新增子节点）、模拟（随机走到底评估）、回溯（更新节点统计值）。UCT 公式平衡利用（胜率高）与探索（访问少），是 AlphaGo 的核心组件。"},{"id":"c4k8","name":"习题：修道士与野人","ch":"c4","qids":["c4q16","c4q17","c4q24"],"chName":"第五章","note":"修道士与野人问题用三元组（左岸修道士数，左岸野人数，船位置）表示状态，约束是任何一岸野人数不得超过修道士数（除非该岸无修道士），目标是全部移到右岸。"},{"id":"c4k9","name":"习题：农夫过河","ch":"c4","qids":["c4q18","c4q19","c4q30"],"chName":"第五章","note":"农夫过河：农夫带狼、羊、菜过河，船每次只能带一样。约束是狼与羊、羊与菜不能在没有农夫时单独相处。最少 7 步完成。"},{"id":"c4k10","name":"习题：八数码","ch":"c4","qids":["c4q20","c4q25"],"chName":"第五章","note":"八数码用 3×3 数组表示状态，空格移动为算子。可解性判据：把数字按行展开，逆序数为偶数才可解。常用启发函数 h1=错位数字个数，h2=曼哈顿距离（更紧凑，效率更高）。"},{"id":"c5k1","name":"计算智能与进化算法概述","ch":"c5","qids":["c5q1","c5q2","c5q3","c5q21","c5q26"],"chName":"第六章","note":"计算智能包括神经计算、模糊计算、进化计算与群智能。进化算法模拟生物进化：编码成个体 → 评价适应度 → 选择 → 交叉 → 变异，逐代逼近最优解。"},{"id":"c5k2","name":"编码方式：二进制与 Gray 编码","ch":"c5","qids":["c5q5","c5q6","c5q7","c5q22"],"chName":"第六章","note":"二进制编码简单通用，但相邻整数的编码可能多位不同，造成「汉明悬崖」。Gray 编码保证相邻数值只有一位不同，能减少突变造成的剧烈跳变，改善局部搜索能力。"},{"id":"c5k3","name":"适应度函数与尺度变换","ch":"c5","qids":["c5q8","c5q9","c5q23"],"chName":"第六章","note":"适应度函数衡量个体优劣，直接决定选择压力。当适应度差异过大或过小时需做尺度变换：线性变换、幂变换、指数变换，避免早熟收敛或选择压力不足。"},{"id":"c5k4","name":"选择算子：轮盘赌与最佳个体保存","ch":"c5","qids":["c5q4","c5q10","c5q11","c5q12","c5q13"],"chName":"第六章","note":"轮盘赌选择按适应度占比分配被选概率，适应度越高被选机会越大；最佳个体保存（精英保留）把当代最优直接带入下一代，保证算法不退化。"},{"id":"c5k5","name":"交叉与变异算子","ch":"c5","qids":["c5q14","c5q15","c5q16","c5q27"],"chName":"第六章","note":"交叉算子（单点、多点、均匀）重组两个父代基因产生新个体，是主要搜索手段；变异算子以很小概率随机改变某位基因，维持种群多样性、防止早熟。"},{"id":"c5k6","name":"双倍体遗传算法","ch":"c5","qids":["c5q28"],"chName":"第六章","note":"双倍体遗传算法中每个基因有显性、隐性两份，表现型由显性基因决定。隐性基因可长期保存，当环境变化时提供多样性，适合动态优化问题。"},{"id":"c5k7","name":"粒子群优化算法（PSO）","ch":"c5","qids":["c5q17","c5q18","c5q24","c5q29"],"chName":"第六章","note":"PSO 把解看作粒子，每个粒子有位置与速度，按自身历史最优 pbest 与群体最优 gbest 更新速度与位置。参数少、实现简单、收敛快，但易早熟。"},{"id":"c5k8","name":"蚁群算法","ch":"c5","qids":["c5q19","c5q20","c5q25","c5q30"],"chName":"第六章","note":"蚁群算法模拟蚂蚁觅食：按信息素浓度与启发式信息概率选路，走过好路径的蚂蚁留下更多信息素，信息素同时挥发。正反馈使算法逐步收敛到最优路径，适合 TSP 等组合优化。"},{"id":"c6k1","name":"机器学习的分类视角与学习范式","ch":"c6","qids":["c6q1","c6q2","c6q3","c6q21","c6q22","c6q26"],"chName":"第七章","note":"机器学习按监督方式分：监督学习（有标签，做分类/回归）、无监督学习（无标签，做聚类/降维）、半监督学习、强化学习（与环境交互获奖励）。按任务分分类、回归、聚类、降维。"},{"id":"c6k2","name":"迁移学习","ch":"c6","qids":["c6q4"],"chName":"第七章","note":"迁移学习把源领域学到的知识、模型或特征迁移到目标领域，用于目标领域标注数据稀缺的场景，例如用 ImageNet 预训练模型微调医学影像分类。"},{"id":"c6k3","name":"数据集划分与交叉验证","ch":"c6","qids":["c6q5","c6q6","c6q23","c6q27"],"chName":"第七章","note":"数据集通常划分为训练集、验证集、测试集。K 折交叉验证把数据分 K 份，轮流用一份做验证、其余做训练，取平均，评估更稳定、充分利用数据。"},{"id":"c6k4","name":"梯度下降与过拟合","ch":"c6","qids":["c6q7","c6q8","c6q28","c6q29"],"chName":"第七章","note":"梯度下降沿损失函数负梯度方向更新参数。学习率过大会震荡不收敛，过小则收敛慢。过拟合表现为训练集好、测试集差，可用正则化、早停、增加数据、简化模型缓解。"},{"id":"c6k5","name":"分类评价指标：混淆矩阵、查全率与 ROC","ch":"c6","qids":["c6q9","c6q10","c6q11","c6q30"],"chName":"第七章","note":"混淆矩阵给出 TP/FP/FN/TN。精确率 P=TP/(TP+FP)，召回率 R=TP/(TP+FN)，F1=2PR/(P+R)。ROC 曲线以 FPR 为横轴、TPR 为纵轴，其下面积 AUC 衡量整体排序能力，对类别不平衡不敏感。"},{"id":"c6k6","name":"线性回归与最小二乘法","ch":"c6","qids":["c6q12","c6q31"],"chName":"第七章","note":"线性回归用直线 y=wx+b 拟合数据，最小二乘法最小化残差平方和，有解析解 w=(XᵀX)⁻¹Xᵀy，也可用梯度下降求解。"},{"id":"c6k7","name":"K 近邻算法（KNN）","ch":"c6","qids":["c6q13","c6q14","c6q15","c6q32"],"chName":"第七章","note":"KNN 找距离最近的 K 个样本，分类投票、回归取均值。K 太小易受噪声影响而过拟合，K 太大会模糊边界而欠拟合；特征需归一化，距离度量常用欧氏距离。"},{"id":"c6k8","name":"决策树与信息熵","ch":"c6","qids":["c6q16","c6q17","c6q24","c6q33"],"chName":"第七章","note":"决策树每次选使纯度提升最大的属性划分，常用准则信息增益（ID3）、增益率（C4.5）、基尼指数（CART）。信息熵越小纯度越高。树太深会过拟合，需要剪枝。"},{"id":"c6k9","name":"支持向量机（SVM）","ch":"c6","qids":["c6q18","c6q19","c6q25","c6q34"],"chName":"第七章","note":"SVM 寻找使两类间隔最大的超平面，间隔由支持向量决定。线性不可分时用核函数映射到高维（多项式核、RBF 核）；软间隔引入松弛变量容忍噪声。"},{"id":"c6k10","name":"专家系统","ch":"c6","qids":["c6q20","c6q35"],"chName":"第七章","note":"专家系统由知识库、推理机、综合数据库、人机界面、解释器组成。它把专家知识形式化为规则做推理，主要瓶颈是知识获取与知识更新。"},{"id":"c7k1","name":"神经元模型与激活函数","ch":"c7","qids":["c7q1","c7q2","c7q3","c7q4","c7q21"],"chName":"第八章","note":"人工神经元模型（MP 模型）：对输入加权求和后经激活函数输出。常用激活函数 Sigmoid（输出 0~1）、Tanh（-1~1）、ReLU（负值置零），ReLU 计算简单且缓解梯度消失。"},{"id":"c7k2","name":"网络拓扑与学习规则","ch":"c7","qids":["c7q5","c7q6"],"chName":"第八章","note":"网络拓扑分前馈（BP、CNN）、反馈（Hopfield、RNN）、横向连接。学习规则主要有 Hebb 规则（相关增强）、δ 规则（误差修正）、竞争学习（胜者通吃）。"},{"id":"c7k3","name":"BP 网络与 BP 算法","ch":"c7","qids":["c7q7","c7q8","c7q9","c7q10","c7q11","c7q12","c7q22","c7q26"],"chName":"第八章","note":"BP 网络是多层前馈网络，算法分两步：前向传播计算输出与误差，反向传播按链式法则把误差逐层回传并更新权重。存在局部极小、梯度消失、训练慢等问题。"},{"id":"c7k4","name":"卷积神经网络（CNN）","ch":"c7","qids":["c7q13","c7q14","c7q15","c7q16","c7q17","c7q23","c7q27","c7q28"],"chName":"第八章","note":"CNN 由卷积层、池化层、全连接层组成。卷积核提取局部特征，权值共享大幅减少参数，池化降维并带来平移不变性，因此特别适合图像任务。"},{"id":"c7k5","name":"生成对抗网络（GAN）","ch":"c7","qids":["c7q18","c7q25","c7q30"],"chName":"第八章","note":"GAN 由生成器与判别器组成，两者对抗训练：生成器造假样本骗判别器，判别器分辨真假，最终生成器能生成逼真样本。难点是训练不稳定与模式崩溃。"},{"id":"c7k6","name":"胶囊网络","ch":"c7","qids":["c7q19"],"chName":"第八章","note":"胶囊网络用向量形式的「胶囊」表示实体及其姿态，用动态路由代替池化，保留部件之间的空间层级关系，对小样本和重叠图像表现更好。"},{"id":"c7k7","name":"Hopfield 神经网络","ch":"c7","qids":["c7q20","c7q24","c7q29"],"chName":"第八章","note":"Hopfield 网络是单层全互连反馈网络，用能量函数保证状态最终收敛到吸引子，可实现联想记忆与优化求解。存储容量约为神经元数的 0.15 倍。"},{"id":"c8k1","name":"自然语言理解与语言处理的层次","ch":"c8","qids":["c8q1","c8q2","c8q3","c8q4","c8q5","c8q6","c8q31","c8q34"],"chName":"第九～十一章","note":"自然语言处理分四个层次：词法分析、句法分析、语义分析、语用分析。NLU 侧重理解（意图、实体、语义），NLG 侧重生成文本。"},{"id":"c8k2","name":"循环神经网络（RNN）","ch":"c8","qids":["c8q7","c8q8","c8q9","c8q10","c8q11","c8q32","c8q41"],"chName":"第九～十一章","note":"RNN 通过隐状态把前一时刻信息传给当前时刻，适合序列建模。缺点是长序列反向传播时梯度连乘导致梯度消失或爆炸。"},{"id":"c8k3","name":"长短期记忆网络（LSTM）","ch":"c8","qids":["c8q12","c8q13","c8q14","c8q33","c8q42"],"chName":"第九～十一章","note":"LSTM 在 RNN 基础上加入细胞状态与三个门：遗忘门决定丢弃哪些旧信息，输入门决定写入哪些新信息，输出门决定输出什么，从而缓解梯度消失、捕捉长依赖。"},{"id":"c8k4","name":"机器翻译与编码器—解码器结构","ch":"c8","qids":["c8q15","c8q16","c8q35","c8q43"],"chName":"第九～十一章","note":"编码器—解码器结构：编码器把源语言句子编码成向量，解码器据此逐词生成目标语言。注意力机制让解码器每一步关注源句不同部分，解决长句信息压缩丢失问题。"},{"id":"c8k5","name":"语音识别","ch":"c8","qids":["c8q17"],"chName":"第九～十一章","note":"语音识别把语音波形转成文字，传统方案是声学模型（HMM/GMM、DNN）+ 语言模型 + 解码搜索；现在主流是端到端模型（CTC、Attention）。"},{"id":"c8k6","name":"大语言模型与 ChatGPT","ch":"c8","qids":["c8q18","c8q19","c8q20","c8q21","c8q36","c8q45"],"chName":"第九～十一章","note":"大语言模型基于 Transformer，训练分三阶段：大规模自监督预训练、指令微调（SFT）、人类反馈强化学习（RLHF）。具备涌现能力，同时存在幻觉与知识时效问题。"},{"id":"c8k7","name":"提示工程","ch":"c8","qids":["c8q22","c8q37"],"chName":"第九～十一章","note":"提示工程通过设计指令、提供少样本示例（few-shot）、要求分步推理（思维链 CoT）、设定角色与输出格式等方式，引导模型给出更准确的回答。"},{"id":"c8k8","name":"知识蒸馏与模型压缩","ch":"c8","qids":["c8q23","c8q24","c8q38","c8q46"],"chName":"第九～十一章","note":"知识蒸馏让大模型（教师）的输出指导小模型（学生）训练，把「暗知识」迁移过去；配合剪枝（去冗余连接）、量化（低精度表示）实现模型压缩与加速部署。"},{"id":"c8k9","name":"Transformer 与自注意力机制","ch":"c8","qids":["c8q25","c8q26","c8q27","c8q39","c8q44"],"chName":"第九～十一章","note":"Transformer 完全基于注意力：多头自注意力捕捉任意位置间依赖，位置编码提供顺序信息，残差连接与层归一化保证深层可训练。相比 RNN 可并行计算、长依赖建模更强。"},{"id":"c8k10","name":"AI 智能体与多智能体系统","ch":"c8","qids":["c8q28","c8q29","c8q30","c8q40","c8q47","c8q48","c8q49","c8q50"],"chName":"第九～十一章","note":"AI 智能体具备感知、决策、行动闭环，能自主规划并调用工具完成任务。多智能体系统研究多个智能体之间的通信、协商、协作与任务分配，可解决单体难以完成的复杂任务。"}],"questions":[{"id":"c1q1","ch":"c1","chName":"第一章、第二章","kp":"c1k1","kpName":"AI 的诞生与发展历程","no":1,"type":"单选题","kind":"single","stem":"1956年，标志着人工智能学科正式诞生的历史事件是( )。","options":[{"k":"A","t":"图灵测试的提出"},{"k":"B","t":"达特茅斯会议"},{"k":"C","t":"第一台神经网络计算机的发明"},{"k":"D","t":"专家系统MYCIN的研发"}],"answer":"B","explain":"1956 年夏，麦卡锡、明斯基等人在达特茅斯学院开会，首次提出「Artificial Intelligence」一词，这次会议被公认为人工智能学科诞生的标志。","ref":":达特茅斯会议;","score":4.7,"mine":"B","own":0,"optNotes":{"A":"1950 年图灵提出的是测试方法，属思想实验，不是学科诞生的标志。","B":"达特茅斯会议首次提出 AI 一词，标志学科诞生。","C":"神经网络计算机不是该时期的标志性事件。","D":"MYCIN 是 1970 年代斯坦福开发的专家系统，远晚于 1956 年。"}},{"id":"c1q11","ch":"c1","chName":"第一章、第二章","kp":"c1k1","kpName":"AI 的诞生与发展历程","no":11,"type":"单选题","kind":"single","stem":"根据课件中人工智能的发展简史，第一个在正式比赛中战胜国际象棋世界冠军的AI系统是( )。","options":[{"k":"A","t":"AlphaGo"},{"k":"B","t":"深蓝(Deep Blue)"},{"k":"C","t":"沃森(Watson)"},{"k":"D","t":"塞缪尔跳棋程序"}],"answer":"B","explain":"1997 年 IBM 深蓝在六局对抗赛中击败国际象棋世界冠军卡斯帕罗夫，是第一个在正式比赛中战胜人类世界冠军的 AI 系统。","ref":":深蓝(Deep Blue);","score":4.8,"mine":"B","own":0,"optNotes":{"A":"AlphaGo 是 2016 年围棋，时间晚于深蓝。","B":"1997 年深蓝击败卡斯帕罗夫，符合题意。","C":"沃森是 2011 年参加 Jeopardy 问答节目。","D":"塞缪尔跳棋程序是早期机器学习示范，未战胜世界冠军。"}},{"id":"c1q2","ch":"c1","chName":"第一章、第二章","kp":"c1k2","kpName":"图灵测试与“中文屋”之争","no":2,"type":"单选题","kind":"single","stem":"图灵测试(Turing Test)的核心思想是( )。","options":[{"k":"A","t":"测试机器是否具备完美的逻辑推理能力"},{"k":"B","t":"通过问答，测试机器是否能诱骗询问者，使其无法分辨对方是人还是机器"},{"k":"C","t":"测试机器能否在围棋对弈中战胜人类世界冠军"},{"k":"D","t":"测试机器是否真正理解语言背后的语义"}],"answer":"B","explain":"图灵测试采用「模仿游戏」：询问者通过文字问答与人和机器交流，若分辨不出哪个是机器，则认为机器具备智能。它衡量的是行为表现，而非内部理解。","ref":":通过问答，测试机器是否能诱骗询问者，使其无法分辨对方是人还是机器;","score":4.7,"mine":"B","own":0,"optNotes":{"A":"逻辑推理能力不是图灵测试的判据。","B":"通过问答使询问者无法分辨人机，即模仿游戏的核心。","C":"围棋对弈是 AlphaGo 的场景，与图灵测试无关。","D":"是否「真正理解语义」恰恰是图灵测试不考察、被中文屋批评的地方。"}},{"id":"c1q3","ch":"c1","chName":"第一章、第二章","kp":"c1k2","kpName":"图灵测试与“中文屋”之争","no":3,"type":"单选题","kind":"single","stem":"在“中文屋”思想实验中，屋中人即使能正确操作中文符号，也不能说明他“理解”了中文。这个实验主要质疑的是( )。","options":[{"k":"A","t":"专用人工智能的实用性"},{"k":"B","t":"机器的计算能力"},{"k":"C","t":"强人工智能(机器能真正“理解”事物)的立场"},{"k":"D","t":"符号主义的物理符号系统假设"}],"answer":"C","explain":"塞尔的中文屋指出：屋中人按规则操作中文符号，能给出正确输出却不理解中文，说明语法层面的符号操作不等于语义理解，从而质疑「强人工智能」。","ref":":强人工智能(机器能真正“理解”事物)的立场;","score":4.7,"mine":"C","own":0,"optNotes":{"A":"与专用 AI 的实用性无关。","B":"它不否认机器的计算能力。","C":"质疑的正是「机器能真正理解」这一强 AI 立场。","D":"它针对的是强 AI 主张，不是物理符号系统假设本身。"}},{"id":"c1q4","ch":"c1","chName":"第一章、第二章","kp":"c1k3","kpName":"三大学派与人工智能的定义","no":4,"type":"单选题","kind":"single","stem":"人工智能三大学派中，认为智能主要来源于大脑神经元网络的联结机制，并通过调整连接权重来学习和实现智能的学派是( )。","options":[{"k":"A","t":"符号主义"},{"k":"B","t":"连接主义"},{"k":"C","t":"行为主义"},{"k":"D","t":"逻辑主义"}],"answer":"B","explain":"连接主义（仿生学派）认为智能来自大量神经元的联结，学习就是调整连接权重，典型代表是人工神经网络。","ref":":连接主义;","score":4.7,"mine":"B","own":0,"optNotes":{"A":"符号主义主张智能是符号运算。","B":"连接主义＝神经元联结＋调整权重，符合题意。","C":"行为主义强调感知—行动与环境交互。","D":"「逻辑主义」不属于三大学派的标准说法。"}},{"id":"c1q5","ch":"c1","chName":"第一章、第二章","kp":"c1k3","kpName":"三大学派与人工智能的定义","no":5,"type":"单选题","kind":"single","stem":"根据课件的定义，“智能 = 知识 + 智力”，其中“智力”指的是( )。","options":[{"k":"A","t":"大脑中存储的海量事实性信息"},{"k":"B","t":"获取和应用知识的能力"},{"k":"C","t":"从外界获取信息的感知能力"},{"k":"D","t":"进行逻辑推理的思维能力"}],"answer":"B","explain":"课件定义：智能＝知识＋智力。知识是智能的基础（存储的事实与规律），智力是获取与应用知识的能力。","ref":":获取和应用知识的能力;","score":4.7,"mine":"B","own":0,"optNotes":{"A":"海量事实信息属于「知识」。","B":"智力＝获取与应用知识的能力。","C":"感知只是获取知识的一种途径，定义更宽。","D":"逻辑思维只是应用知识的一种方式。"}},{"id":"c1q13","ch":"c1","chName":"第一章、第二章","kp":"c1k3","kpName":"三大学派与人工智能的定义","no":13,"type":"单选题","kind":"single","stem":"下列哪个研究方向属于行为主义(控制论学派)的核心思想渊源?( )","options":[{"k":"A","t":"物理符号系统假设"},{"k":"B","t":"感知机模型"},{"k":"C","t":"感知-行动控制环"},{"k":"D","t":"知识工程"}],"answer":"C","explain":"行为主义（控制论学派）认为智能产生于「感知—行动」控制环，是在与环境交互中涌现的，布鲁克斯的六足机器人是典型代表。","ref":":感知-行动控制环;","score":4.8,"mine":"C","own":0,"optNotes":{"A":"物理符号系统假设属于符号主义。","B":"感知机模型属于连接主义。","C":"感知—行动控制环是行为主义的核心思想渊源。","D":"知识工程属于符号主义路线。"}},{"id":"c1q16","ch":"c1","chName":"第一章、第二章","kp":"c1k3","kpName":"三大学派与人工智能的定义","no":16,"type":"判断题","kind":"judge","stem":"根据课件的观点，当前所有的人工智能应用，包括AlphaGo和医学影像诊断系统，都属于专用人工智能(弱AI)，而通用人工智能(强AI)仍是远期目标。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"对","explain":"当前所有 AI 应用（AlphaGo、医学影像诊断、大模型）都只擅长特定任务，属于专用人工智能（弱 AI）；通用人工智能（强 AI）能像人一样跨领域学习，仍是远期目标。","ref":"","score":4.8,"mine":"对","own":0,"optNotes":{"A":"说法正确。","B":"与课件观点相反。"}},{"id":"c1q19","ch":"c1","chName":"第一章、第二章","kp":"c1k3","kpName":"三大学派与人工智能的定义","no":19,"type":"判断题","kind":"judge","stem":"根据布鲁克斯(Brooks)的进化理论，智能不仅依赖于复杂的推理和知识表示，低等生物的感知与行动能力本身也是智能的一种体现。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"对","explain":"布鲁克斯从进化角度提出：智能不必然依赖复杂推理与知识表示，低等生物仅凭感知与行动也能表现出适应环境的智能行为。","ref":"","score":4.8,"mine":"对","own":0,"optNotes":{"A":"说法正确，符合布鲁克斯的进化理论。","B":"与课件观点相反。"}},{"id":"c1q6","ch":"c1","chName":"第一章、第二章","kp":"c1k4","kpName":"谓词逻辑表示法","no":6,"type":"单选题","kind":"single","stem":"在谓词逻辑中，公式 (∀x)(DOCTOR(x) → PRESCRIBE(x)) 的正确翻译是( )。","options":[{"k":"A","t":"存在一个医生在开处方"},{"k":"B","t":"所有医生都在开处方"},{"k":"C","t":"所有开处方的都是医生"},{"k":"D","t":"有一个开处方的人是医生"}],"answer":"B","explain":"全称量词配蕴含：∀x(DOCTOR(x)→PRESCRIBE(x)) 表示「对所有 x，若 x 是医生则 x 开处方」，即所有医生都开处方。","ref":":所有医生都在开处方;","score":4.7,"mine":"B","own":0,"optNotes":{"A":"「存在」要用存在量词 ∃，与公式不符。","B":"全称量词＋蕴含，正是「所有医生都开处方」。","C":"这是 ∀x(PRESCRIBE(x)→DOCTOR(x))，主谓颠倒。","D":"存在量词表达的语义与公式不符。"}},{"id":"c1q8","ch":"c1","chName":"第一章、第二章","kp":"c1k4","kpName":"谓词逻辑表示法","no":8,"type":"单选题","kind":"single","stem":"以下关于谓词逻辑表示法的特点描述，不正确的是( )。","options":[{"k":"A","t":"形式化程度高，理论成熟严密"},{"k":"B","t":"非常擅长表示带有不确定性的知识"},{"k":"C","t":"便于用计算机实现精确推理"},{"k":"D","t":"推理搜索空间可能很大，效率不高"}],"answer":"B","explain":"谓词逻辑的优点是形式化程度高、理论严密、便于计算机精确推理；缺点是无法表示模糊与可信度类知识，且推理搜索空间大、效率低。所以「擅长表示不确定性」是错的。","ref":":非常擅长表示带有不确定性的知识;","score":4.7,"mine":"B","own":0,"optNotes":{"A":"这是优点，描述正确。","B":"它恰恰不擅长表示不确定性，本项描述错误，故选它。","C":"这是优点，描述正确。","D":"这是缺点，描述正确。"}},{"id":"c1q14","ch":"c1","chName":"第一章、第二章","kp":"c1k4","kpName":"谓词逻辑表示法","no":14,"type":"单选题","kind":"single","stem":"在谓词逻辑中，公式 ¬(∀x)P(x) 的等价变换是( )。","options":[{"k":"A","t":"(∀x)¬P(x)"},{"k":"B","t":"¬(∃x)P(x)"},{"k":"C","t":"(∃x)¬P(x)"},{"k":"D","t":"(∀x)P(¬x)"}],"answer":"C","explain":"量词转换律：¬(∀x)P(x) ⇔ (∃x)¬P(x)，即「并非所有 x 都满足 P」等价于「存在 x 不满足 P」。","ref":":(∃x)¬P(x);","score":4.8,"mine":"C","own":0,"optNotes":{"A":"量词没有转换，不等价。","B":"这是「不存在 x 满足 P」，与「存在不满足 P」不同。","C":"全称否定转存在否定，正确。","D":"P(¬x) 语法上不成立。"}},{"id":"c1q7","ch":"c1","chName":"第一章、第二章","kp":"c1k5","kpName":"产生式表示法","no":7,"type":"单选题","kind":"single","stem":"在产生式系统中，用来存放初始事实、中间结论和最终结果，充当“工作记忆”的部件是( )。","options":[{"k":"A","t":"规则库"},{"k":"B","t":"推理机"},{"k":"C","t":"综合数据库"},{"k":"D","t":"知识图谱"}],"answer":"C","explain":"产生式系统三部件：规则库存规则，综合数据库存放初始事实、中间结论与最终结果（工作记忆），推理机执行匹配与推理。","ref":":综合数据库;","score":4.7,"mine":"C","own":0,"optNotes":{"A":"规则库存放的是规则本身。","B":"推理机负责推理控制。","C":"综合数据库＝工作记忆，符合题意。","D":"知识图谱是另一种知识表示形式。"}},{"id":"c1q12","ch":"c1","chName":"第一章、第二章","kp":"c1k5","kpName":"产生式表示法","no":12,"type":"单选题","kind":"single","stem":"在产生式系统中，当多条规则同时匹配成功时，推理机需要按照特定策略决定先执行哪一条规则，这个过程称为( )。","options":[{"k":"A","t":"模式匹配"},{"k":"B","t":"冲突消解"},{"k":"C","t":"逆向推理"},{"k":"D","t":"规则融合"}],"answer":"B","explain":"模式匹配找出可用的规则；当多条规则同时匹配成功时，按某种策略决定先执行哪一条，这一过程叫冲突消解。","ref":":冲突消解;","score":4.8,"mine":"B","own":0,"optNotes":{"A":"模式匹配是找出匹配规则的过程。","B":"冲突消解＝决定执行顺序，符合题意。","C":"逆向推理是推理方向的一种。","D":"「规则融合」不是标准术语。"}},{"id":"c1q18","ch":"c1","chName":"第一章、第二章","kp":"c1k5","kpName":"产生式表示法","no":18,"type":"判断题","kind":"judge","stem":"在产生式表示法中，一条确定性产生式规则 IF P THEN Q 与谓词逻辑中的蕴含式 P→Q 在语义和使用上是完全等价的，没有任何区别。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"错","explain":"产生式比蕴含式更宽泛：条件可以是模糊的、允许近似匹配、可附可信度因子；蕴含式要求命题真值确定、精确匹配，只表达严格逻辑关系。二者并不完全等价。","ref":"","score":4.8,"mine":"错","own":0,"optNotes":{"A":"说「完全等价」是错误的。","B":"正确，两者在语义与使用上有明显区别。"}},{"id":"c1q10","ch":"c1","chName":"第一章、第二章","kp":"c1k6","kpName":"框架表示法","no":10,"type":"单选题","kind":"single","stem":"框架表示法中，用来描述对象某一固定属性的空位被称为( )。","options":[{"k":"A","t":"槽"},{"k":"B","t":"侧面"},{"k":"C","t":"节点"},{"k":"D","t":"值域"}],"answer":"A","explain":"框架用槽（Slot）描述对象的固定属性空位，槽下可再分侧面（Facet），框架名相当于节点。","ref":":槽;","score":4.8,"mine":"A","own":0,"optNotes":{"A":"槽是描述固定属性的空位，正确。","B":"侧面是槽的进一步细分。","C":"节点通常指框架本身。","D":"值域是槽取值的范围。"}},{"id":"c1q17","ch":"c1","chName":"第一章、第二章","kp":"c1k6","kpName":"框架表示法","no":17,"type":"判断题","kind":"judge","stem":"框架表示法中的“继承性”是指，子框架可以继承父框架中槽的默认值，这符合人类的常识推理习惯。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"对","explain":"框架表示法的重要特性是继承性：子框架可以继承父框架中槽的缺省值，不必重复描述，符合人类常识推理习惯。","ref":"","score":4.8,"mine":"对","own":0,"optNotes":{"A":"说法正确。","B":"与框架表示法的特性相反。"}},{"id":"c1q9","ch":"c1","chName":"第一章、第二章","kp":"c1k7","kpName":"知识图谱","no":9,"type":"单选题","kind":"single","stem":"知识图谱的基本组成单元是( )。","options":[{"k":"A","t":"IF-THEN规则"},{"k":"B","t":"槽和侧面"},{"k":"C","t":"三元组"},{"k":"D","t":"谓词公式"}],"answer":"C","explain":"知识图谱以三元组为基本单元，形式为（实体，关系，实体）或（实体，属性，属性值）。","ref":":三元组;","score":4.8,"mine":"C","own":0,"optNotes":{"A":"IF-THEN 是产生式的形式。","B":"槽与侧面属于框架表示法。","C":"三元组是知识图谱的基本单元。","D":"谓词公式属于逻辑表示法。"}},{"id":"c1q20","ch":"c1","chName":"第一章、第二章","kp":"c1k7","kpName":"知识图谱","no":20,"type":"判断题","kind":"judge","stem":"知识图谱的构建只能采用“自顶向下”的方式，即先由专家构建本体模式，再填充具体数据。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"错","explain":"知识图谱构建有自顶向下（专家先建本体模式再填数据）与自底向上（先抽取实体关系再归纳模式）两种方式，实际工程中常结合使用。","ref":"","score":4.8,"mine":"错","own":0,"optNotes":{"A":"「只能自顶向下」说法错误。","B":"正确，两种构建方式并存。"}},{"id":"c1q15","ch":"c1","chName":"第一章、第二章","kp":"c1k8","kpName":"医学知识的不确定性","no":15,"type":"单选题","kind":"single","stem":"课件中提到，医学知识天生具有不确定性，下列哪项不是导致知识不确定性的原因?( )","options":[{"k":"A","t":"随机性(如药物疗效的个体差异)"},{"k":"B","t":"模糊性(如“高热”没有统一阈值)"},{"k":"C","t":"经验性(如中医专家的临床经验)"},{"k":"D","t":"完整性(如我们对一种疾病的病理机制已完全了解)"}],"answer":"D","explain":"医学知识不确定性的四大成因是随机性、模糊性、经验性、不完全性。「完整性」与不确定性方向相反，不是成因。","ref":":完整性(如我们对一种疾病的病理机制已完全了解);","score":4.8,"mine":"D","own":0,"optNotes":{"A":"随机性（疗效个体差异）是成因之一。","B":"模糊性（「高热」无统一阈值）是成因之一。","C":"经验性（专家经验）是成因之一。","D":"完整性恰恰意味着确定，不是不确定性成因，故选它。"}},{"id":"c1q21","ch":"c1","chName":"第一章、第二章","kp":"c1k9","kpName":"简答：产生式与蕴含式的比较","no":21,"type":"简答题","kind":"text","stem":"请比较产生式表示法与谓词逻辑中的蕴含式_，分析它们之间的共同之处和不同之处。","options":[],"answer":"","explain":"参考答案：共同点——两者都是「若…则…」的条件—结论结构，都可用于表示因果与推理规则；不同点——产生式左部可以是多个条件的组合，条件允许模糊、允许近似匹配，可附可信度因子，还可表示启发式经验；蕴含式是严格的逻辑联结词，要求命题真值确定、精确匹配，只表达真值关系，不能表达模糊与不确定性。","ref":"一、 共同之处(1点)\n形式结构相似: 两者都采用“条件→结论”的基本形式。确定性的产生式规则(如 IF P THEN Q)在形式上与谓词逻辑的蕴含式 P→Q 非常相似，都表达了“如果前提满足，则可以得出某个结论”的因果关系。\n\n\n\n二、 不同之处\n\n\n\n对比维度 产生式表示法 谓词逻辑蕴含式\n1. 条件的精确性 条件可以模糊、不精确。 例如，“体温明显升高”可以作为前提参与推理。条件必须精确。 谓词公式的真值只有“真”或“假”，如“体温>39℃”，模糊概念无法直接表达。(课件第29页)\n2. 匹配的严格性 允许近似匹配。 按相似度判定规则是否可用，对噪声和不完全信息具有鲁棒性。要求完全一致匹配。 推理要求公式之间逐符号严格对应，不允许近似。","score":4.8,"mine":"","own":0},{"id":"c2q1","ch":"c2","chName":"第三章","kp":"c2k1","kpName":"推理的基本概念与推理机","no":1,"type":"单选题","kind":"single","stem":"在人工智能系统中，负责运用知识库中的知识进行推理的程序模块称为( )。","options":[{"k":"A","t":"知识库"},{"k":"B","t":"数据库"},{"k":"C","t":"推理机"},{"k":"D","t":"解释器"}],"answer":"C","explain":"专家系统三要素：知识库存知识，综合数据库存事实，推理机负责运用知识库中的知识进行推理。","ref":":推理机;","score":null,"mine":"C","own":0,"optNotes":{"A":"知识库存放知识本身，不执行推理。","B":"数据库存放事实数据，不承担推理。","C":"推理机负责运用知识进行推理，符合题意。","D":"解释器负责解释推理过程与结论。"}},{"id":"c2q16","ch":"c2","chName":"第三章","kp":"c2k1","kpName":"推理的基本概念与推理机","no":16,"type":"判断题","kind":"judge","stem":"确定性推理中，所用知识与证据都是确定的，推出的结论也是确定的，真值非真即假。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"对","explain":"确定性推理的前提是知识与证据都确定，因此结论也确定，真值只有真、假两种。","ref":"","score":null,"mine":"对","own":0,"optNotes":{"A":"说法正确。","B":"与确定性推理的定义相反。"}},{"id":"c2q2","ch":"c2","chName":"第三章","kp":"c2k2","kpName":"推理的分类：演绎、归纳、默认与单调性","no":2,"type":"单选题","kind":"single","stem":"从“所有金属都能导电”和“铜是金属”这两个前提出发，推出“铜能导电”的结论，这种推理方式属于( )。","options":[{"k":"A","t":"归纳推理"},{"k":"B","t":"默认推理"},{"k":"C","t":"演绎推理"},{"k":"D","t":"非单调推理"}],"answer":"C","explain":"从「所有金属导电」这个一般性原理推出「铜导电」这个个别结论，属于由一般到个别的演绎推理。","ref":":演绎推理;","score":null,"mine":"C","own":0,"optNotes":{"A":"归纳是从个别事实概括出一般规律。","B":"默认推理是在知识不完全时先假设条件成立。","C":"由一般原理推出个别结论，正是演绎推理。","D":"非单调推理指新信息可推翻旧结论。"}},{"id":"c2q3","ch":"c2","chName":"第三章","kp":"c2k2","kpName":"推理的分类：演绎、归纳、默认与单调性","no":3,"type":"单选题","kind":"single","stem":"在知识不完全的情况下，先默认某些条件成立并进行推理，若后续发现默认错误则撤销结论重新推理，这种推理方式称为( )。","options":[{"k":"A","t":"确定性推理"},{"k":"B","t":"默认推理(缺省推理)"},{"k":"C","t":"归纳推理"},{"k":"D","t":"启发式推理"}],"answer":"B","explain":"在知识不完全时先默认某些条件成立去推理，发现默认不成立再撤销结论，这就是默认推理（缺省推理）。","ref":":默认推理(缺省推理);","score":null,"mine":"B","own":0,"optNotes":{"A":"确定性推理不涉及默认假设的撤销。","B":"默认（缺省）推理：先假设、后修正。","C":"归纳推理是个别到一般的概括。","D":"启发式推理指用经验规则引导搜索。"}},{"id":"c2q4","ch":"c2","chName":"第三章","kp":"c2k2","kpName":"推理的分类：演绎、归纳、默认与单调性","no":4,"type":"单选题","kind":"single","stem":"明斯基举例中，已知“X是一只鸟”时默认“X会飞”，后来得知“X是企鹅”则撤销“会飞”的结论，这个过程体现了( )。","options":[{"k":"A","t":"单调推理"},{"k":"B","t":"非单调推理"},{"k":"C","t":"演绎推理"},{"k":"D","t":"确定性推理"}],"answer":"B","explain":"先由「鸟」推出「会飞」，得知「企鹅」后撤销该结论，说明结论可被新信息推翻，属非单调推理。","ref": ,"mine":"C","own":0,"optNotes":{"A":"G 才是目标状态集合。","B":"S0 是初始状态集合。","C":"O 表示使状态转换的操作算子集合。","D":"「已扩展状态集」是搜索过程中的 open/closed 表。"}},{"id":"c4q4","ch":"c4","chName":"第五章","kp":"c4k1","kpName":"搜索的基本问题与状态空间表示","no":4,"type":"单选题","kind":"single","stem":"关于八数码问题的状态和操作，下列说法正确的是:","options":[{"k":"A","t":"每个数码单独构成一个完整状态"},{"k":"B","t":"一个完整的3×3棋盘排列可以表示一个状态"},{"k":"C","t":"空格位于任意位置时，都有4个合法移动方向"},{"k":"D","t":"每次操作可以任意交换两个数码的位置"}],"answer":"B","explain":"八数码中一个完整的 3×3 排列才是一个状态；空格在边上只有 3 个合法方向，在角上只有 2 个。","ref":":一个完整的3×3棋盘排列可以表示一个状态;","score":3.3,"mine":"B","own":0,"optNotes":{"A":"单个数字不能构成状态。","B":"整个棋盘排列表示一个状态，正确。","C":"空格在角上时只有 2 个合法方向。","D":"每次只能与相邻的空格交换，不能任意交换。"}},{"id":"c4q5","ch":"c4","chName":"第五章","kp":"c4k1","kpName":"搜索的基本问题与状态空间表示","no":5,"type":"单选题","kind":"single","stem":"在状态空间搜索中，一个解通常可以表示为:","options":[{"k":"A","t":"所有访问过的状态构成的无序集合"},{"k":"B","t":"所有不可解状态构成的集合"},{"k":"C","t":"open表中剩余结点的排列顺序"},{"k":"D","t":"从初始状态到目的状态的路径上的操作算子序列"}],"answer":"D","explain":"状态空间中的一个解，就是一条从初始状态到目标状态的路径，通常用这条路径上的操作算子序列表示。","ref":":从初始状态到目的状态的路径上的操作算子序列;","score":3.3,"mine":"D","own":0,"optNotes":{"A":"无序集合不能表示解。","B":"不可解状态集与解无关。","C":"open 表的顺序是搜索过程中的中间状态。","D":"解＝路径上的算子序列。"}},{"id":"c4q26","ch":"c4","chName":"第五章","kp":"c4k1","kpName":"搜索的基本问题与状态空间表示","no":26,"type":"判断题","kind":"judge","stem":"状态空间四元组中的 S0 和 G 都是状态集合，因此一个问题可以有多个初始状态或多个目的状态","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"对","explain":"S0 与 G 都是集合，因此问题允许多个初始状态或多个目标状态，搜索时需对每个初始状态分别求解或设定目标判定条件。","ref":"","score":3.4,"mine":"对","own":0,"optNotes":{"A":"说法正确。","B":"与四元组的定义矛盾。"}},{"id":"c4q2","ch":"c4","chName":"第五章","kp":"c4k2","kpName":"搜索策略的分类与目的驱动","no":2,"type":"单选题","kind":"single","stem":"从目的状态出发，寻找能够产生该目的的操作算子，并将其所需条件作为新的子目的继续搜索，这种方法称为:","options":[{"k":"A","t":"正向搜索，也称数据驱动"},{"k":"B","t":"逆向搜索，也称目的驱动"},{"k":"C","t":"宽度优先搜索，也称目的驱动"},{"k":"D","t":"深度优先搜索，也称数据驱动"}],"answer":"B","explain":"从目标状态出发，找能产生该目标的操作算子，再把所需前提作为新的子目标继续回推，这是逆向搜索（目的驱动）。","ref":":逆向搜索，也称目的驱动;","score":3.3,"mine":"B","own":0,"optNotes":{"A":"正向搜索是从初始状态出发的。","B":"由目标回推前提，是逆向搜索、目的驱动。","C":"宽度优先是搜索方式，不是方向。","D":"深度优先也不是方向分类。"}},{"id":"c4q21","ch":"c4","chName":"第五章","kp":"c4k2","kpName":"搜索策略的分类与目的驱动","no":21,"type":"多选题","kind":"multi","stem":"关于搜索策略的分类，下列说法正确的有:","options":[{"k":"A","t":"正向搜索从初始状态出发，逐步向目标推进"},{"k":"B","t":"逆向搜索从目标出发，逐步回推所需条件"},{"k":"C","t":"盲目搜索完全不需要知道合法操作和目标条件"},{"k":"D","t":"启发式搜索利用与具体问题有关的信息指导搜索"},{"k":"E","t":"正向搜索与启发式搜索属于不同分类维度，可以同时使用"}],"answer":"ABDE","explain":"正向搜索从初始状态推进，逆向搜索从目标回推；启发式搜索利用问题信息引导；正向/逆向与盲目/启发式是两个不同维度，可组合使用。盲目搜索虽不用启发信息，但仍需知道合法操作与目标条件。","ref":":正向搜索从初始状态出发，逐步向目标推进; 逆向搜索从目标出发，逐步回推所需条件; 启发式搜索利用与具体问题有关的信息指导搜索; 正向搜索与启发式搜索属于不同分类维度，可以同时使用;","score":3.4,"mine":"ABDE","own":0,"optNotes":{"A":"正向搜索的定义正确。","B":"逆向搜索的定义正确。","C":"盲目搜索仍需要合法算子与目标判定，故不选。","D":"启发式搜索利用问题相关信息，正确。","E":"方向与启发式是两个维度，可同时使用。"}},{"id":"c4q22","ch":"c4","chName":"第五章","kp":"c4k2","kpName":"搜索策略的分类与目的驱动","no":22,"type":"多选题","kind":"multi","stem":"关于宽度优先搜索和深度优先搜索，下列说法正确的有:","options":[{"k":"A","t":"宽度优先搜索通常将新结点加入open表尾部"},{"k":"B","t":"深度优先搜索通常将新结点压入open表的栈顶"},{"k":"C","t":"深度优先搜索首先找到的解一定是最短解"},{"k":"D","t":"每步代价相同时，宽度优先搜索找到的最浅解也是最低代价解"},{"k":"E","t":"只要给深度优先搜索设置任意一个有限深度上限，就一定能找到原问题的解"}],"answer":"ABD","explain":"宽度优先把新结点放队尾（FIFO），深度优先把新结点压栈顶（LIFO）。深度优先不保证最短解；只有每步代价相同时宽度优先的最浅解才是最低代价解；深度上限过小会漏解。","ref":":宽度优先搜索通常将新结点加入open表尾部; 深度优先搜索通常将新结点压入open表的栈顶; 每步代价相同时，宽度优先搜索找到的最浅解也是最低代价解;","score":3.4,"mine":"ABD","own":0,"optNotes":{"A":"宽度优先把新结点加入队尾，正确。","B":"深度优先压栈顶，正确。","C":"深度优先找到的解不一定最短，故不选。","D":"等代价时宽度优先的最浅解即最低代价解。","E":"上限过小会漏掉更深的解，不保证找到解。"}},{"id":"c4q6","ch":"c4","chName":"第五章","kp":"c4k3","kpName":"回溯算法与 open 表","no":6,"type":"单选题","kind":"single","stem":"在课件介绍的回溯算法中，NSS表主要用于:","options":[{"k":"A","t":"记录已判定找不到解路径的状态，避免重复搜索"},{"k":"B","t":"记录当前搜索路径上的全部状态"},{"k":"C","t":"按估价函数值排列待扩展状态"},{"k":"D","t":"只保存最终的目的状态"}],"answer":"A","explain":"回溯算法用 NSS 表（不可解状态表）记录已确认找不到解的状态，避免重复搜索同一分支。","ref":":记录已判定找不到解路径的状态，避免重复搜索;","score":3.3,"mine":"A","own":0,"optNotes":{"A":"NSS 记录不可解状态，避免重复搜索。","B":"当前路径由搜索 c4","chName":"第五章","kp":"c4k5","kpName":"深度优先与有界深度优先搜索","no":10,"type":"单选题","kind":"single","stem":"某有界深度优先搜索将深度上限设置为4，而某问题的最浅目标结点位于深度6。下列说法正确的是:","options":[{"k":"A","t":"该次搜索无法到达目标，需要考虑增大深度上限"},{"k":"B","t":"只要设置了深度上限，就一定能找到目标"},{"k":"C","t":"该次搜索会自动退化为宽度优先搜索"},{"k":"D","t":"该次搜索能够找到目标，但不能保证最优"}],"answer":"A","explain":"深度上限 4 小于目标所在的深度 6，本次搜索到不了目标，需要增大深度上限或改用其他策略。","ref":":该次搜索无法到达目标，需要考虑增大深度上限;","score":3.3,"mine":"A","own":0,"optNotes":{"A":"上限过小会漏解，需增大上限，正确。","B":"设了上限不等于一定能找到解。","C":"有界深度不会退化为宽度优先。","D":"本次搜索根本到不了目标。"}},{"id":"c4q28","ch":"c4","chName":"第五章","kp":"c4k5","kpName":"深度优先与有界深度优先搜索","no":28,"type":"判断题","kind":"judge","stem":"深度优先搜索只要使用栈，就一定能够避免状态重复和循环，不需要额外进行重复状态检查","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"错","explain":"用栈只能保证搜索方式，不能自动避免重复状态与循环；必须另外维护已访问集合（closed 表）做重复检查。","ref":"","score":3.4,"mine":"错","own":0,"optNotes":{"A":"说「不需要额外检查」是错的。","B":"正确，仍需 closed 表防重复与循环。"}},{"id":"c4q11","ch":"c4","chName":"第五章","kp":"c4k6","kpName":"启发式搜索与 A* 算法","no":11,"type":"单选题","kind":"single","stem":"某结点 n 从初始状态到达它的实际代价为6，估计从它到目的状态还需代价4。采用 f(n)=g(n)+h(n)，则:","options":[{"k":"A","t":"f(n)=2"},{"k":"B","t":"f(n)=4"},{"k":"C","t":"f(n)=10"},{"k":"D","t":"f(n)=24"}],"answer":"C","explain":"f(n)=g(n)+h(n)=6+4=10。","ref":":f(n)=10;","score":3.3,"mine":"C","own":0,"optNotes":{"A":"6−4 才是 2，公式是加。","B":"漏掉了 g。","C":"6+4=10，正确。","D":"6×4 不符合公式。"}},{"id":"c4q12","ch":"c4","chName":"第五章","kp":"c4k6","kpName":"启发式搜索与 A* 算法","no":12,"type":"单选题","kind":"single","stem":"下列哪项正确描述了A*算法中启发函数的可采纳性要求?","options":[{"k":"A","t":"对所有结点，h(n)≥h∗(n)"},{"k":"B","t":"对所有结点，h(n)≤h∗(n)"},{"k":"C","t":"对所有结点，h(n)=g(n)"},{"k":"D","t":"对所有结点，h(n)=0 且不能取其他值"}],"answer":"B","explain":"可采纳性要求启发函数不高估：对所有结点 h(n) ≤ h*(n)（真实最优剩余代价），此时 A* 保证找到最优解。","ref":":对所有结点，h(n)≤h∗(n)h(n)≤ h∗(n)h(n)≤h∗(n);","score":3.3,"mine":"B","own":0,"optNotes":{"A":"h≥h* 是高估，会失去最优性。","B":"h≤h* 即不高估，正确。","C":"h 不等于 g。","D":"h=0 只是退化为一致代价搜索，并非唯一取值。"}},{"id":"c4q13","ch":"c4","chName":"第五章","kp":"c4k6"," "直接计算到目标状态的最短距离"},{"k":"C","t":"鼓励尝试访问较少的结点，避免过早只关注少数分支"},{"k":"D","t":"完全取消随机模拟过程"}],"answer":"C","explain":"UCT 的探索项与访问次数成反比，访问越少的结点被选中的机会越大，从而平衡「利用」与「探索」，避免过早收敛到少数分支。","ref":":鼓励尝试访问较少的结点，避免过早只关注少数分支;","score":3.3,"mine":"C","own":0,"optNotes":{"A":"只按胜率选择就是纯利用，会陷入局部。","B":"探索项不用于计算距离。","C":"鼓励尝试访问少的结点，正确。","D":"探索项不取消随机模拟。"}},{"id":"c4q29","ch":"c4","chName":"第五章","kp":"c4k7","kpName":"蒙特卡洛树搜索与 UCT","no":29,"type":"判断题","kind":"judge","stem":"MCTS的反向传播阶段，会沿本次搜索经过的路径更新相关结点的访问次数与累计评分","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"对","explain":"反向传播阶段沿本次迭代经过的路径，把模拟结果回传，更新每个结点的访问次数与累计得分。","ref":"","score":3.4,"mine":"对","own":0,"optNotes":{"A":"说法正确。","B":"与 MCTS 的流程矛盾。"}},{"id":"c4q16","ch":"c4","chName":"第五章","kp":"c4k8","kpName":"习题：修道士与野人","no":16,"type":"单选题","kind":"single","stem":"【习题5.1:修道士和野人】 用 (m,c,b) 表示状态，其中 m,c 分别为左岸修道士数和野人数，b 表示船的位置。下列哪一状态满足两岸人员安全条件?","options":[{"k":"A","t":"(2,3,左)"},{"k":"B","t":"(3,1,右)"},{"k":"C","t":"(1,2,左)"},{"k":"D","t":"(2,0,右)"}],"answer":"B","explain":"状态 (3,1,右)：左岸 3 修道士 1 野人，右岸 0 修道士 2 野人。任取一岸，野人数都不超过修道士数（或无修道士），所以安全。","ref":":(3,1,右);","score":3.3,"mine":"B","own":0,"optNotes":{"A":"(2,3,左)：左岸野人 3>2，不安全。","B":"(3,1,右)：两岸都安全，正确。","C":"(1,2,左)：左岸野人 2>1，不安全。","D":"右岸剩 1 名修道士和 3 名野人，野人多于修道士，不安全。"}},{"id":"c4q17","ch":"c4","chName":"第五章","kp":"c4k8","kpName":"习题：修道士与野人","no":17,"type":"单选题","kind":"single","stem":"【习题5.1:修道士和野人】 初始时，3名修道士和3名野人均在左岸，船也在左岸。下列哪一种首次渡河方案会导致不安全状态?","options":[{"k":"A","t":"1名野人渡到右岸"},{"k":"B","t":"2名野人渡到右岸"},{"k":"C","t":"1名修道士和1名野人渡到右岸"},{"k":"D","t":"1名修道士渡到右岸"}],"answer":"D","explain":"初始 (3,3,左)。若先让 1 名修道士单独过河，左岸变 (2,3)，野人数 3>2，左岸不安全，方案失败。","ref":":1名修道士渡到右岸;","score":3.3,"mine":"D","own":0,"optNotes":{"A":"送 1 名野人：(3,2)，左岸 3≥2 安全。","B":"送 2 名野人：(3,1)，安全。","C":"送 1 修 1 野：(2,2)，安全。","D":"只送 1 名修道士：(2,3)，左岸不安全，故选它。"}},{"id":"c4q24","ch":"c4","chName":"第五章","kp":"c4k8","kpName":"习题：修道士与野人","no":24,"type":"多选题","kind":"multi","stem":"【习题5.1:修道士和野人】 从初始状态 (3,3,左) 出发，下列哪些首次渡河方案满足船的容量限制，且渡河 {"k":"B","t":"变异"},{"k":"C","t":"竞争"},{"k":"D","t":"微分"}],"answer":"D","explain":"进化算法模拟的是繁殖、变异、竞争、选择等生物进化机制；微分是数学分析运算，与进化机制无关。","ref":":微分;","score":3.3,"mine":"D","own":0,"optNotes":{"A":"繁殖对应复制/交叉。","B":"变异是遗传操作之一。","C":"竞争对应选择。","D":"微分是求导运算，不是进化环节。"}},{"id":"c5q3","ch":"c5","chName":"第六章","kp":"c5k1","kpName":"计算智能与进化算法概述","no":3,"type":"单选题","kind":"single","stem":"与普通搜索算法相比，进化算法的显著特点是:","options":[{"k":"A","t":"从单一初始点开始搜索"},{"k":"B","t":"直接处理问题参数"},{"k":"C","t":"从一组解(种群)出发，逐代改进"},{"k":"D","t":"必须使用导数信息"}],"answer":"C","explain":"进化算法从一组解（种群）同时出发，逐代通过选择、交叉、变异改进，而不是从一个初始点出发。","ref":":从一组解(种群)出发，逐代改进;","score":3.3,"mine":"C","own":0,"optNotes":{"A":"单点出发是传统搜索算法的特点。","B":"进化算法处理的是编码后的染色体，不直接处理参数。","C":"从种群出发逐代改进，正确。","D":"进化算法不需要导数信息。"}},{"id":"c5q21","ch":"c5","chName":"第六章","kp":"c5k1","kpName":"计算智能与进化算法概述","no":21,"type":"多选题","kind":"multi","stem":"进化算法的三种基本操作包括:","options":[{"k":"A","t":"选择"},{"k":"B","t":"交叉"},{"k":"C","t":"变异"},{"k":"D","t":"编码"}],"answer":"ABC","explain":"进化算法的三种基本操作是选择、交叉、变异；编码是把解表示为染色体的预处理步骤，不属于这三种算子。","ref":":选择; 交叉; 变异;","score":3.4,"mine":"ABC","own":0,"optNotes":{"A":"选择是基本操作之一。","B":"交叉是基本操作之一。","C":"变异是基本操作之一。","D":"编码是表示方法，不是三种基本操作，故不选。"}},{"id":"c5q26","ch":"c5","chName":"第六章","kp":"c5k1","kpName":"计算智能与进化算法概述","no":26,"type":"判断题","kind":"judge","stem":"进化算法是一种确定性算法，通常需要导数等信息。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"错","explain":"进化算法是随机搜索算法，靠概率性的选择、交叉、变异推进，不需要导数信息，也不保证每次结果相同。","ref":"","score":3.4,"mine":"错","own":0,"optNotes":{"A":"说它是确定性算法是错的。","B":"正确，它是随机算法且不需要导数。"}},{"id":"c5q5","ch":"c5","chName":"第六章","kp":"c5k2","kpName":"编码方式：二进制与 Gray 编码","no":5,"type":"单选题","kind":"single","stem":"在遗传算法中，将搜索空间的参数或解转换成遗传空间的染色体或个体的过程称为:","options":[{"k":"A","t":"解码"},{"k":"B","t":"编码"},{"k":"C","t":"变异"},{"k":"D","t":"选择"}],"answer":"B","explain":"把搜索空间的解（参数）转换成遗传空间的染色体，叫编码；反过来由染色体还原参数叫解码。","ref":":编码;","score":3.3,"mine":"B","own":0,"optNotes":{"A":"解码是由染色体还原参数。","B":"参数→染色体是编码。","C":"变异是改变基因位。","D":"选择是按适应度挑选个体。"}},{"id":"c5q6","ch":"c5","chName":"第六章","kp":"c5k2","kpName":"编码方式：二进制与 Gray 编码","no":6,"type":"单选题","kind":"single","stem":"二进制编码中，相邻整数的二进制编码可能具有较大的Hamming距离，这种现象称为:","options":[{"k":"A","t":"欺骗问题"},{"k":"B","t":"停滞现象"},{"k":"C","t":"Hamming悬崖"},{"k":"D","t":"过早收敛"}],"answer":"C","explain":"二进制编码中相邻整数的编码可能有多位不同，造成适应度在相邻点间剧烈跳变，这种现象称为 Hamming 悬崖。","ref":":Hamming悬崖;","score":3.3,"mine":"C","own":0,"optNotes":{"A":"欺骗问题指低阶模式误导搜索。","B":"停滞指种群失去多样性后不再进化。","C":"相邻编码多位不同＝Hamming 悬崖。","D":"过早收敛指种群过早趋同。"}},{"id":"c5q7","ch":"c5","chName":"第六章","kp":"c5k2","kpName":"编码方式：二进制与 Gray 编码","no":7,"type":"单选题","kind":"single","stem":"Gray编码的主要优点是:","options":[{"k":"A","t":"串长更短"},{"k":"B","t":"相邻整数的Gray编码之间只有1位不同"},{"k":"C","t":"不需要解码"},{"k":"D","t":"适合所有优化问题"}],"answer":"B","explain":"Gray 编码保证相邻整数的编码只差一位，从而消除 Hamming 悬崖，改善局部搜索的连续性。","ref":":相邻整数的Gray编码之间只有1位不同;","score":3.3,"mine":"B","own":0,"optNotes":{"A":"Gray 编码串长与二进制相同。","B":"相邻只差一位，是其主要优点。","C":"仍需解码。","D":"并非所有问题都适合。"}},{"id":"c5q22","ch":"c5","chName":"第六章","kp":"c5k2","kpName":"编码方式：二进制与 Gray 编码","no":22,"type":"多选题","kind":"multi","stem":"关于二进制编码的优点，下列说法正确的有:","options":[{"k":"A","t":"类似生物染色体的组成，易于用遗传理论解释"},{"k":"B","t":"交叉、变异等遗传操作容易实现"},{"k":"C","t":"算法处理的模式数最多"},{"k":"D","t":"不存在Hamming悬崖问题"}],"answer":"ABC","explain":"二进制编码类似生物染色体、便于遗传操作、处理的模式数最多；但它确实存在 Hamming 悬崖问题，所以 D 错。","ref":":类似生物染色体的组成，易于用遗传理论解释; 交叉、变异等遗传操作容易实现; 算法处理的模式数最多;","score":3.4,"mine":"ABC","own":0,"optNotes":{"A":"类似生物染色体，正确。","B":"遗传操作易实现，正确。","C":"模式数最多，正确。","D":"二进制编码恰恰存在 Hamming 悬崖，故不选。"}},{"id":"c5q8","ch":"c5","chName":"第六章","kp":"c5k3","kpName":"适应度函数与尺度变换","no":8,"type":"单选题","kind":"single","stem":"遗传算法中，适应度函数的主要作用是:","options":[{"k":"A","t":"决定交叉点位置"},{"k":"B","t":"区分群体中个体好坏，是自然选择的唯一依据"},{"k":"C","t":"控制变异概率"},{"k":"D","t":"决定种群规模"}],"answer":"B","explain":"适应度函数用来度量个体优劣，是选择（自然选择）的唯一依据，直接决定哪些个体能繁殖后代。","ref":":区分群体中个体好坏，是自然选择的唯一依据;","score":3.3,"mine":"B","own":0,"optNotes":{"A":"交叉点位置是随机设定的。","B":"适应度是选择的唯一依据，正确。","C":"变异概率是参数，不由适应度决定。" ,"kp":"c6k4","kpName":"梯度下降与过拟合","no":28,"type":"判断题","kind":"judge","stem":"模型和算法的区别在于:模型是结果(数学表达式或特定关系)，而算法是手段(求解模型参数的方法)。针对同一模型，可以有多种算法来求解。( )","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"对","explain":"模型是结果（数学表达式），算法是求解模型参数的手段；同一个模型可以用不同算法求解（如线性回归既可用最小二乘也可用梯度下降）。","ref":"","score":2.9,"mine":"对","own":0,"optNotes":{"A":"说法正确。","B":"与模型/算法的定义矛盾。"}},{"id":"c6q29","ch":"c6","chName":"第七章","kp":"c6k4","kpName":"梯度下降与过拟合","no":29,"type":"判断题","kind":"judge","stem":"在非简单凸函数的损失函数中，梯度下降法找到的“局部最优解”不一定等于“全局最优解”。( )","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"对","explain":"对非凸损失函数，梯度下降只能保证收敛到局部最优，不保证等于全局最优。","ref":"","score":2.9,"mine":"对","own":0,"optNotes":{"A":"说法正确。","B":"与梯度下降的性质相反。"}},{"id":"c6q9","ch":"c6","chName":"第七章","kp":"c6k5","kpName":"分类评价指标：混淆矩阵、查全率与 ROC","no":9,"type":"单选题","kind":"single","stem":"在分类模型评价的混淆矩阵中，模型预测为“是”，但实际标签为“否”的样本属于?( )","options":[{"k":"A","t":"TP(真阳性)"},{"k":"B","t":"TN(真阴性)"},{"k":"C","t":"FP(假阳性)"},{"k":"D","t":"FN(假阴性)"}],"answer":"C","explain":"预测为「是」而实际为「否」，是把阴性误判为阳性，属于假阳性 FP。","ref":":FP(假阳性);","score":2.8,"mine":"C","own":0,"optNotes":{"A":"TP 是预测是、实际也是。","B":"TN 是预测否、实际否。","C":"预测是实际否＝FP，正确。","D":"FN 是预测否、实际是。"}},{"id":"c6q10","ch":"c6","chName":"第七章","kp":"c6k5","kpName":"分类评价指标：混淆矩阵、查全率与 ROC","no":10,"type":"单选题","kind":"single","stem":"如果一种常见疾病的筛查方法希望做到“应检尽检”，即尽量不漏掉任何一个潜在患者，我们通常希望该筛查方法具有极高的?( )","options":[{"k":"A","t":"敏感性/召回率 (Sensitivity/Recall)"},{"k":"B","t":"特异性 (Specificity)"},{"k":"C","t":"精确率 (Precision)"},{"k":"D","t":"准确率 (Accuracy)"}],"answer":"A","explain":"「应检尽检、不漏诊」要求把所有真患者都找出来，对应召回率（敏感性）越高越好。","ref":":敏感性/召回率 (Sensitivity/Recall);","score":2.8,"mine":"A","own":0,"optNotes":{"A":"召回率高＝漏诊少，正确。","B":"特异性高＝误诊少，解决的是另一面。","C":"精确率高＝报出的大多是真患者。","D":"准确率在不平衡数据上会失真。"}},{"id":"c6q11","ch":"c6","chName":"第七章","kp":"c6k5","kpName":"分类评价指标：混淆矩阵、查全率与 ROC","no":11,"type":"单选题","kind":"single","stem":"在ROC曲线中，横坐标(X轴)代表的是?( )","options":[{"k":"A","t":"真阳性率 (True Positive Rate)"},{"k":"B","t":"假阳性率 (False Positive Rate)"},{"k":"C","t":"准确率 (Accuracy)"},{"k":"D","t":"精确率 (Precision)"}],"answer":"B","explain":"ROC 曲线横轴是假阳性率 FPR，纵轴是真阳性率 TPR，曲线下面积 AUC 衡量整体排序能力。","ref":":假阳性率 (False Positive Rate);","score":2.8,"mine":"B","own":0,"optNotes":{"A":"TPR 是纵轴。","B":"FPR 是横轴，正确。","C":"准确率不是 ROC 的坐标。","D":"精确率也不是 ROC 的坐标。"}},{"id":"c6q30","ch":"c6","chName":"第七章","kp":"c6k5","kpName":"分类评价指标：混淆矩阵、查全率与 ROC","no":30,"type":"判断题","kind":"judge","stem":"在分类模型中，对于类别分布极度不平衡的数据(例如10000个样本中只有1个阳性)，仅仅使用“准确率(Accuracy)”作为评价指标是非常可靠且科学的。( )","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"错","explain":"类别极度不平衡时，把所有样本都判为多数类就能得到 99.99% 的准确率，却没有识别出任何阳性，因此准确率不可靠。","ref":"","score":2.9,"mine":"错","own":0,"optNotes":{"A":"此时准确率会严重失真，说法错误。","B":"正确，应改用召回率、精确率、AUC 等指标。"}},{"id":"c6q12","ch":"c6","chName":"第七章","kp":"c6k6","kpName":"线性回归与最小二乘法","no":12,"type":"单选题","kind":"single","stem":"线性回归中，求解参数“最合理地找到一条能最好地代表数据点分布趋势的直线”所使用的经典方法是?( )","options":[{"k":"A","t":"梯度下降法"},{"k":"B","t":"最大间隔法"},{"k":"C","t":"最小二乘法"},{"k":"D","t":"信息熵法"}],"answer":"C","explain":"线性回归的经典解法是最小二乘法：最小化残差平方和，可直接得到解析解。","ref":":最小二乘法;","score":2.8,"mine":"C","own":0,"optNotes":{"A":"梯度下降是求解手段之一，不是经典解析法。","B":"最大间隔是 SVM 的思想。","C":"最小二乘法是线性回归的经典方法，正确。","D":"信息熵用于决策树。"}},{"id":"c6q31","ch":"c6","chName":"第七章","kp":"c6k6","kpName":"线性回归与最小二乘法","no":31,"type":"判断题","kind":"judge","stem":"在最小二乘法中，残差(Residual)指的是实测值与假定回归线上的估计值之间的纵向距离。( )","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"对","explain":"残差是实测值与回归直线给出的估计值之差，在图上表现为该点到直线的纵向距离。","ref":"","score":2.9,"mine":"对","own":0,"optNotes":{"A":"说法正确。","B":"与残差的定义相反。"}},{"id":"c6q13","ch":"c6","chName":"第七章","kp":"c6k7","kpName":"K 近邻算法（KNN）","no":13,"type":"单选题","kind":"single","stem":"K近邻(KNN)算法属于什么类型的学习算法?( )","options":[{"k":"A","t":"惰性学习(平时不建模，来一个查询算一次)"},{"k":"B","t":"急切学习(训练阶段就建立完整模型)"},{"k":"C","t":"无监督学习"},{"k":"D","t":"强化学习"}],"answer":"A","explain":"KNN 平时不建模，只把样本存起来，来一个查询才算距离、投票，属于惰性学习。","ref":":惰性学习(平时不建模，来一个查询算一次);","score":2.8,"mine":"A","own /* ---------- cloud: auth ---------- */
var AUTH_KEY = "quiz_auth_v1";
var auth = loadAuth();
function loadAuth(){
  try { return JSON.parse(localStorage.getItem(AUTH_KEY) || "null"); } catch(e){ return null; }
}
function saveAuth(){ try { localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); } catch(e){} }
function sbHeaders(extra){
  var h = { "apikey": SUPA.key, "Content-Type": "application/json" };
  if (auth && auth.access_token) h["Authorization"] = "Bearer " + auth.access_token;
  else h["Authorization"] = "Bearer " + SUPA.key;
  if (extra) for (var k in extra) h[k] = extra[k];
  return h;
}
async function sbSignUp(email, password){
  var r = await fetch(SUPA.url + "/auth/v1/signup", {
    method: "POST", headers: sbHeaders(), body: JSON.stringify({ email: email, password: password })
  });
  var j = await r.json();
  if (!r.ok) throw new Error(j.msg || j.error_description || j.message || "注册失败");
  if (j.access_token) { auth = { access_token: j.access_token, refresh_token: j.refresh_token, user: j.user }; saveAuth(); await ensureProfile(); return true; }
  return false; // 需要邮箱确认
}
async function sbSignIn(email, password){
  var r = await fetch(SUPA.url + "/auth/v1/token?grant_type=password", {
    method: "POST", headers: sbHeaders(), body: JSON.stringify({ email: email, password: password })
  });
  var j = await r.json();
  if (!r.ok) throw new Error(j.error_description || j.msg || "登录失败");
  auth = { access_token: j.access_token, refresh_token: j.refresh_token, user: j.user };
  saveAuth(); await ensureProfile(); return true;
}
function sbSignOut(){ auth = null; saveAuth(); }
async function sbRefresh(){
  if (!auth || !auth.refresh_token) return false;
  try {
    var r = await fetch(SUPA.url + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST", headers: sbHeaders(), body: JSON.stringify({ refresh_token: auth.refresh_token })
    });
    if (!r.ok) return false;
    var j = await r.json();
    auth.access_token = j.access_token; auth.refresh_token = j.refresh_token; saveAuth(); return true;
  } catch(e){ return false; }
}
async function sbFetch(path, opts){
  opts = opts || {};
  var r = await fetch(SUPA.url + path, {
    method: opts.method || "GET",
    headers: sbHeaders(opts.headers), body: opts.body
  });
  if (r.status === 401) { if (await sbRefresh()) return sbFetch(path, opts); }
  return r;
}
async function ensureProfile(){
  if (!auth || !auth.user) return;
  await sbFetch("/rest/v1/profiles?on_conflict=id", {
    method: "POST",
    headers: { "Prefer": "resolution=merge-duplicates,return=representation" },
    body: JSON.stringify([{ id: auth.user.id, nickname: (auth.profile && auth.profile.nickname) || ("同学" + String(auth.user.id).slice(0,4)), avatar: (auth.profile && auth.profile.avatar) || "🦉", public_rank: auth.profile ? auth.profile.public_rank : true }])
  });
  var r = await sbFetch("/rest/v1/profiles?id=eq." + auth.user.id + "&select=*");
  if (r.ok) { var rows = await r.json(); if (rows && rows[0]) { auth.profile = rows[0]; saveAuth(); } }
}
function myStats(course){
  var done=0, right=0, wrong=0, answers=0;
  Q.forEach(function(q){
    var r = store.rec[q.id];
    if (r) { done++; if (r.last==="right") right++; else wrong++; answers += (r.c||0)+(r.w||0); }
  });
  return { course: course, done: done, total: Q.length, right_cnt: right, wrong_cnt: wrong, answers: answers };
}
var syncTimer = null;
function queueSync(){
  if (!auth) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(doSync, 1200);
}
async function doSync(){
  if (!auth) return;
  var st = myStats(DATA.course);
  try {
    await sbFetch("/rest/v1/stats?on_conflict=uid,course", {
      method: "POST",
      headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify([{ uid: auth.user.id, course: st.course, done: st.done, total: st.total, right_cnt: st.right_cnt, wrong_cnt: st.wrong_cnt, answers: st.answers }])
    });
  } catch(e){}
}

function startDeck(ids,title){
  if(!ids.length){ toast("这里还没有题目"); return; }
  S.deck=ids.slice(); S.idx=0; S.ans={}; S.pick=[]; S.title=title||""; S.stat={r:0,w:0}; S.t0=Date.now();
  S.view="study"; render();
}
function viewStudy(){
  if(S.idx>=S.deck.length) return viewSummary();
  var q=QM[S.deck[S.idx]], a=S.ans[q.id], r0=rec(q.id);
  var p=(S.idx+1)/S.deck.length;
  var h='<div class="top"><button class="iconbtn" data-act="home">←</button>'
    +'<div class="ttl">'+(S.idx+1)+' / '+S.deck.length+'</div>'
    +'<button class="iconbtn" data-act="kp-quick">◈</button></div>'
    +'<div class="bar"><i style="width:'+(p*100)+'%"></i></div>';
  h+='<div class="card"><div class="ctop"><span class="chip type">'+esc(q.type)+'</span>'
    +(q.key?'<span class="chip key">★ 考点</span>':'')
    +(q.zhong?'<span class="chip zhong">重点</span>':'')
    +(q.nan?'<span class="chip nan">难点</span>':'')
    +(q.mian?'<span class="chip mian">免考</span>':'')
    +'<button class="fav'+(isFav(q.id)?" on":"")+'" data-act="fav">'+(isFav(q.id)?"★":"☆")+'</button></div>'
    +'<div class="stem">'+esc(q.stem).split("\n").join("<br>")+'</div>'
    +((q.imgs && q.imgs.length) ? '<div class="qimgs">'+q.imgs.map(function(u){return '<img src="'+u+'" alt="题目配图">';}).join('')+'</div>' : '');

  if(q.kind==="text"){
    h+='<div class="opts"><button class="opt" data-act="reveal"><span class="k">?</span><span>简答题：先自己想，再点“看参考答案”</span></button></div>';
  } else {
    h+='<div class="opts">';
    q.options.forEach(function(o){
      var cls="opt";
      if(a){
        if(q.kind==="multi"){ var corr=q.answer.indexOf(o.k)>=0, ch=(a.picked||[]).indexOf(o.k)>=0;
          if(corr) cls+=" ok"; else if(ch) cls+=" bad"; }
        else if(q.kind==="judge"){ if(o.t===q.answer) cls+=" ok"; else if(a.picked===o.t) cls+=" bad"; }
        else { if(o.k===q.answer) cls+=" ok"; else if(a.picked===o.k) cls+=" bad"; }
      } else if(q.kind==="multi" && S.pick.indexOf(o.k)>=0) cls+=" sel";
      h+='<button class="'+cls+'" data-opt="'+esc(o.k)+'" data-txt="'+esc(o.t)+'">'
        +'<span class="k">'+esc(o.k)+'</span><span>'+esc(o.t)+'</span></button>';
      if(a && q.optNotes && q.optNotes[o.k]){
        var _r = (q.kind==="judge") ? (o.t===q.answer)
               : (q.kind==="multi" ? String(q.answer).indexOf(o.k)>=0 : o.k===q.answer);
        h+='<div class="optnote '+(_r?"right":"wrong")+'">'+esc(q.optNotes[o.k])+'</div>';
      }
    });
    h+='</div>';
    if(q.kind==="multi" && !a){
      h+='<div style="margin-top:12px"><button class="btn primary wide" data-act="confirm"'+(S.pick.length?'':' disabled')+'>确认选择（'+S.pick.length+'）</button></div>';
    }
  }
  if(a) h+=feedback(q,a,r0);
  h+='</div>';
  h+='<div class="ctrl"><button class="btn ghost" data-act="prev"'+(S.idx===0?' disabled':'')+'>上一题</button>'
    +'<button class="btn ghost" data-act="reveal"'+(a?' disabled':'')+'>看答案</button>'
    +'<button class="btn primary" data-act="next">'+(S.idx===S.deck.length-1?'完成':'下一题')+'</button></div>';
  h+='<div class="meta">'+esc(q.chName)+' · 第 '+q.no+' 题'+(q.score?' · '+q.score+' 分':'')+'</div>';
  return h;
}
function optText(q,k){ var o=(q.options||[]).filter(function(x){return x.k===k;})[0]; return o?(k+"「"+o.t+"」"):k; }
function pickedText(q,a){
  if(!a.picked) return "（未作答）";
  if(q.kind==="multi") return a.picked.map(function(k){return optText(q,k);}).join("、");
  if(q.kind==="judge") return a.picked;
  return optText(q,a.picked);
}
function rightText(q){
  if(q.kind==="judge"||q.kind==="text") return q.answer||"见参考答案";
  return String(q.answer||"").split("").map(function(k){return optText(q,k);}).join("、");
}
function feedback(q,a,r0){
  var ok=a.ok, h='<div class="fb '+(ok?"ok":"bad")+'">';
  h+='<div class="head">'+(ok?"✓ 答对了":(a.revealed?"○ 已看答案":"✕ 答错了"))
    +'<span class="ans">正确答案 '+esc(rightText(q))+'</span></div>';
  h+='<div class="kp">知识点 <button class="kplink" data-kp="'+q.kp+'">'+esc(q.kpName)+'</button>'
    +'<span>该知识点 '+kpStats(q.kp).total+' 题 · 已掌握 '+kpStats(q.kp).right+'</span></div>';
  if(!ok && a.picked){
    h+='<div class="why"><b>错因分析</b><div class="line2">你选的是 <em>'+esc(pickedText(q,a))+'</em><br>正确答案是 <i>'+esc(rightText(q))+'</i></div></div>';
  }
  if(q.explain) h+='<div class="exp">'+(q.own?'解析（整理补充）：':'解析：')+esc(q.explain)+'</div>';
  else if(a) h+='<div class="exp">暂无解析</div>';
  if(a && KM[q.kp] && KM[q.kp].note) h+='<div class="kpnote"><b>知识点解析 · '+esc(KM[q.kp].name)+'</b>'+esc(KM[q.kp].note)+'</div>';
  if(q.kind==="text" && q.ref) h+='<div class="ref"><b>参考答案</b>'+esc(q.ref)+'</div>';
  if(r0.c+r0.w>0) h+='<div class="exp" style="color:#9A9A9A">历史：答对 '+r0.c+' 次，答错 '+r0.w+' 次</div>';
  h+='</div>';
  return h;
}
function judge(q,p){
  if(q.kind==="single") return p===q.answer;
  if(q.kind==="judge") return p===q.answer;
  if(q.kind==="multi") return p.slice().sort().join("")===q.answer.split("").sort().join("");
  return false;
}
function commit(q,ok,picked,revealed){
  S.ans[q.id]={ok:ok,picked:picked,revealed:!!revealed};
  var r=store.rec[q.id]||{c:0,w:0,last:null};
  if(ok) r.c++; else r.w++;
  r.last = ok?"right":"wrong";
  store.rec[q.id]=r;
  if(ok) S.stat.r++; else S.stat.w++;
  sfx(ok ? "ok" : "bad");
  queueSync();
  var k=today(); store.daily[k]=store.daily[k]||{n:0}; store.daily[k].n++;
  save(); render();
}

  var h='<h3>'+esc(k.name)+'</h3><div class="sub">'+esc(c.name)+' · 该知识点 '+ks.total+' 题，已掌握 '+ks.right+'</div>';
  h+='<div class="line">题目</div><div style="display:flex;flex-wrap:wrap;gap:6px">';
