<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#FFFFFF"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="软工刷题"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2358CC02'/%3E%3Ctext x='32' y='44' font-size='26' font-weight='bold' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E✓%3C/text%3E%3C/svg%3E"/>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2358CC02'/%3E%3Ctext x='32' y='44' font-size='26' font-weight='bold' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E✓%3C/text%3E%3C/svg%3E"/>
<title>医学软件工程 · 刷题</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --green:#58CC02; --green-d:#46A302; --green-l:#D7FFB8;
  --blue:#1CB0F6; --blue-d:#1899D6; --purple:#CE82FF; --purple-d:#A568CC;
  --orange:#FF9600; --orange-d:#E08600; --red:#FF4B4B; --red-d:#D33131;
  --gold:#FFC800; --teal:#00CD9C;
  --ink:#3C3C3C; --ink2:#4B4B4B; --muted:#AFAFAF; --line:#E5E5E5; --bg:#FFFFFF; --soft:#F7F7F7;
}
html,body{margin:0;padding:0;height:100%}
body{
  background:#F2F4F7; color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.app{max-width:560px;margin:0 auto;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;
  position:relative;overflow:hidden;box-shadow:0 0 60px rgba(20,30,60,.06)}
@media (max-width:600px){.app{box-shadow:none}}

/* ---------- Duolingo-ish buttons ---------- */
.btn{border:0;border-radius:16px;padding:14px 18px;font-size:15px;font-weight:800;font-family:inherit;
  letter-spacing:.02em;cursor:pointer;transition:transform .06s, box-shadow .06s;display:inline-flex;
  align-items:center;justify-content:center;gap:6px;text-transform:none}
.btn.primary{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-d)}
.btn.blue:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-d)}
.btn.ghost{background:#fff;color:var(--ink2);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.wide{width:100%}
.btn.small{padding:10px 14px;font-size:13px;border-radius:13px}
.btn:disabled{opacity:.45;pointer-events:none}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:4px 9px;
  border-radius:8px;background:var(--soft);color:#777;border:1.5px solid var(--line)}
.chip.key{background:#FFF6DB;color:#B07800;border-color:#FFE8A3}
.chip.mian{background:#F3F4F7;color:#9AA0AD}
.chip.zhong{background:#FFF6DB;color:#B07800;border-color:#FFE8A3}
.chip.nan{background:#FFEDED;color:#D33131;border-color:#FFD3D3}
.chip.type{background:#EAF7FF;color:#1899D6;border-color:#CDEEFF}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 16px;
  background:#fff;border-bottom:2px solid var(--line)}
.top .ttl{font-size:15px;font-weight:900;flex:1;text-align:center;letter-spacing:.01em}
.iconbtn{width:38px;height:38px;border-radius:13px;border:2px solid var(--line);background:#fff;color:#7B7B7B;
  display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;font-weight:800;
  box-shadow:0 3px 0 var(--line)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}

/* ---------- home header ---------- */
.hhead{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.hhead .logo{font-size:17px;font-weight:900;letter-spacing:-.01em;color:var(--green-d);display:flex;
  align-items:center;gap:8px}
.hhead .logo svg{width:26px;height:26px}
.hhead .spacer{flex:1}
.pill{display:flex;align-items:center;gap:5px;background:#FFF6DB;border:2px solid #FFE8A3;color:#B07800;
  font-weight:900;font-size:13px;padding:5px 10px;border-radius:12px}
.pill.blue{background:#EAF7FF;border-color:#CDEEFF;color:#1899D6}

/* ---------- daily card ---------- */
.daily{margin:12px 16px 0;border:2px solid var(--line);border-radius:20px;padding:16px;
  background:linear-gradient(180deg,#FFFFFF,#FAFFFA);display:flex;align-items:center;gap:14px}
.daily .ring{flex:none;position:relative}
.daily .ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-size:17px;font-weight:900;color:var(--green-d);line-height:1.1}
.daily .ring b small{font-size:9px;font-weight:800;color:var(--muted);letter-spacing:.08em}
.daily .info{flex:1;min-width:0}
.daily .kicker{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.1em}
.daily .h1{font-size:19px;font-weight:900;letter-spacing:-.02em;margin:2px 0 4px}
.daily .sub{font-size:12px;color:#8C8C8C}

/* ---------- quick grid ---------- */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 16px 0}
.quick button{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 4px 10px;
  font-family:inherit;font-size:11px;font-weight:800;color:var(--ink2);cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:6px;box-shadow:0 3px 0 var(--line)}
.quick button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.quick em{font-style:normal;width:32px;height:32px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;font-size:17px;background:#F0FFF0}

/* ---------- learning path ---------- */
.pathwrap{margin:18px 16px 34px;position:relative}
.path-title{font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.12em;margin:0 4px 14px}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px}
.path:before{content:"";position:absolute;left:50%;top:10px;bottom:10px;width:0;border-left:3px dashed #E8E8E8}
.step{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.step:nth-child(odd){align-items:flex-end;padding-right:22%}
.step:nth-child(even){align-items:flex-start;padding-left:22%}
.node{width:76px;height:76px;border-radius:50%;border:0;cursor:pointer;position:relative;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:15px;
  box-shadow:0 6px 0 rgba(0,0,0,.16);transition:transform .08s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.16)}
.node .pct{font-size:15px;letter-spacing:-.02em}
.node .ico{font-size:26px}
.node.done{background:var(--gold)!important;color:#7A5B00;box-shadow:0 6px 0 #D9A800}
.step .label{font-size:12.5px;font-weight:800;color:var(--ink2);text-align:center;max-width:150px}
.step .label small{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-top:2px}
.step button.start{border:0;font-family:inherit;cursor:pointer;background:var(--green);color:#fff;font-size:11px;font-weight:900;padding:6px 12px;border-radius:11px;
  box-shadow:0 3px 0 var(--green-d);margin-top:-2px}

/* ---------- study ---------- */
.bar{height:14px;background:#E9EDF2;border-radius:99px;margin:14px 16px 0;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .35s;
  box-shadow:inset 0 4px 0 rgba(255,255,255,.28)}
.card{background:#fff;border:2px solid var(--line);border-radius:20px;margin:14px 16px 0;padding:18px}
.ctop{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.ctop .fav{margin-left:auto;border:0;background:transparent;font-size:20px;color:#D8D8D8;cursor:pointer;padding:0 2px}
.ctop .fav.on{color:var(--gold)}
.stem{font-size:16.5px;line-height:1.7;font-weight:800;letter-spacing:-.01em;color:#2B2B2B}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:2px solid var(--line);
  border-radius:14px;padding:12px 13px;font-family:inherit;font-size:14.5px;line-height:1.55;color:#3C3C3C;
  cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .06s, box-shadow .06s;font-weight:600}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt .k{flex:none;width:26px;height:26px;border-radius:9px;background:#F2F4F7;color:#7B7B7B;font-size:12.5px;
  font-weight:900;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--blue);box-shadow:0 3px 0 var(--blue-d);background:#F3FBFF}
.opt.sel .k{background:var(--blue);color:#fff}
.opt.ok{border-color:var(--green);box-shadow:0 3px 0 var(--green-d);background:#F1FFE6}
.opt.ok .k{background:var(--green);color:#fff}
.opt.bad{border-color:var(--red);box-shadow:0 3px 0 var(--red-d);background:#FFF2F2;animation:shake .3s}
.opt.bad .k{background:var(--red);color:#fff}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.fb{margin-top:14px;border-radius:16px;padding:14px;border:2px solid var(--line);background:#FAFAFA}
.fb.ok{background:#F1FFE6;border-color:#C9F0A6}
.fb.bad{background:#FFF2F2;border-color:#FFC9C9}
.fb .head{font-size:15px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fb.ok .head{color:var(--green-d)} .fb.bad .head{color:var(--red-d)}
.fb .head .ans{margin-left:auto;font-size:11.5px;font-weight:800;color:#5B6470;background:#fff;
  border:1.5px solid var(--line);border-radius:9px;padding:3px 8px}
.fb .kp{margin-top:9px;font-size:12.5px;color:#5B6470;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fb .kplink{border:1.5px solid #CDEEFF;background:#EAF7FF;color:#1899D6;font-weight:900;font-family:inherit;
  font-size:12px;padding:4px 10px;border-radius:9px;cursor:pointer}
.fb .exp{margin-top:9px;font-size:13px;line-height:1.75;color:#4B4B4B;white-space:pre-wrap}
.ref{margin-top:10px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;
  font-size:13px;line-height:1.75;color:#3C3C3C}
.ref b{display:block;font-size:11.5px;color:var(--blue-d);margin-bottom:4px;font-weight:900}
.why{margin-top:10px;background:#fff;border:1.5px solid #FFD3D3;border-radius:12px;padding:11px 12px}
.why b{font-size:12px;color:var(--red-d);display:block;margin-bottom:5px;font-weight:900}
.why .line2{font-size:12.5px;color:#4B4B4B;line-height:1.75}
.why .line2 em{font-style:normal;color:var(--red-d);font-weight:900}
.why .line2 i{font-style:normal;color:var(--green-d);font-weight:900}

.ctrl{display:flex;gap:9px;margin:16px 16px 26px}
.ctrl .btn{flex:1}
.ctrl .btn.primary{flex:1.5}
.meta{text-align:center;font-size:11px;color:#B5B5B5;margin:8px 16px 0}

/* ---------- summary ---------- */
.sum{padding:30px 20px;text-align:center}
.sum h2{font-size:24px;margin:16px 0 4px;letter-spacing:-.02em;font-weight:900}
.sum p{color:var(--muted);font-size:13px;margin:0}
.sumstats{display:flex;justify-content:center;gap:22px;margin:22px 0 26px;flex-wrap:wrap}
.sumstats div{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.06em}
.sumstats b{display:block;font-size:24px;color:var(--ink);font-weight:900;letter-spacing:-.02em;margin-bottom:2px}

/* ---------- lists ---------- */
.sec{margin:20px 16px 6px;display:flex;align-items:center;justify-content:space-between}
.sec .t{font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.12em}
.sec .l{border:0;background:transparent;color:var(--blue-d);font-size:12px;font-weight:900;font-family:inherit;cursor:pointer}
.list{margin:0 16px 28px;display:flex;flex-direction:column;gap:9px}
.item{background:#fff;border:2px solid var(--line);border-radius:16px;padding:13px 14px;cursor:pointer;
  box-shadow:0 3px 0 var(--line)}
.item:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.item .m{font-size:10.5px;color:var(--muted);display:flex;gap:8px;font-weight:800;letter-spacing:.04em}
.item p{margin:6px 0 0;font-size:13.5px;color:#3C3C3C;line-height:1.55;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600}
.item .ans{font-size:11.5px;color:var(--green-d);margin-top:7px;font-weight:800;line-height:1.5}
.item .ans span{color:#8C8C8C;font-weight:600}

/* kp */
details.grp{background:#fff;border:2px solid var(--line);border-radius:16px;box-shadow:0 3px 0 var(--line);
  overflow:hidden}
details.grp>summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;align-items:center;gap:9px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .t{font-size:13.5px;font-weight:900;flex:1;min-width:0;padding-right:6px;line-height:1.4}
details.grp>summary .n{font-size:10.5px;color:var(--muted);font-weight:800;flex:none;white-space:nowrap}
details.grp>summary .ar{color:#C9C9C9;transition:.2s;font-size:12px;font-weight:900}
details.grp[open]>summary .ar{transform:rotate(90deg)}
.kprow{display:flex;align-items:center;gap:9px;padding:11px 15px;border-top:2px solid #F2F2F2;cursor:pointer}
.kprow:active{background:#FAFAFA}
.kprow .t{font-size:13px;color:#3C3C3C;flex:1;font-weight:700}
.kprow .mini{width:52px;height:8px;border-radius:99px;background:#EDEDED;overflow:hidden;flex:none}
.kprow .mini i{display:block;height:100%;background:var(--green);border-radius:99px}
.kprow .s{font-size:10.5px;color:var(--muted);font-weight:800;flex:none;width:30px;text-align:right}

/* kd cards */
.kdcard{background:#fff;border:2px solid var(--line);border-radius:18px;padding:15px 16px;box-shadow:0 3px 0 var(--line)}
.kdcard .top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.kdcard .nm{font-size:15px;font-weight:900;letter-spacing:-.01em}
.kdcard .sl{font-size:10.5px;color:var(--muted);margin-left:auto;font-weight:800}
.kdcard ul{margin:6px 0 10px;padding-left:16px}
.kdcard li{font-size:12.5px;line-height:1.7;color:#4B4B4B;margin-bottom:4px;font-weight:600}
.kdcard .foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kdcard .cnt{font-size:11px;color:var(--muted);font-weight:800}
.kdcard .go{margin-left:auto}
.kdnote{margin:0 16px 12px;font-size:11.5px;color:#9A9A9A;line-height:1.7}
.kdrow{display:flex;align-items:center;gap:10px;padding:13px 14px}
.kdrow b{font-size:14.5px;font-weight:900;letter-spacing:-.01em}
.kdrow-n{margin-left:auto;font-size:11.5px;color:#9A9A9A;font-weight:800}
.kdrow-a{color:#CFCFCF;font-weight:900;font-size:15px}

.menu-list{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--line);
  background:#fff;border-radius:14px;padding:13px 14px;font-family:inherit;font-size:14px;font-weight:800;
  color:var(--ink);cursor:pointer;text-decoration:none;box-shadow:0 3px 0 var(--line)}
.mi:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.mi span{font-size:18px;width:24px;text-align:center}
.mi i{margin-left:auto;font-style:normal;color:#C9C9C9;font-weight:900}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:56px 24px;line-height:1.9}
.ava{width:38px;height:38px;border-radius:13px;border:2px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.ava.big{width:62px;height:62px;border-radius:20px;font-size:32px;box-shadow:0 4px 0 var(--line);cursor:default}
.avaimg-wrap{display:inline-flex;align-items:center;justify-content:center;overflow:hidden;padding:0}
.avaimg{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.ava .avaimg-wrap{width:100%;height:100%;border-radius:inherit}
.rkava .avaimg-wrap{width:26px;height:26px;border-radius:8px;display:inline-flex}
.inp{width:100%;border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-size:15px;
  font-family:inherit;font-weight:600;color:var(--ink);margin-bottom:10px;outline:none;background:#fff}
.inp:focus{border-color:var(--blue)}
.line{font-size:11.5px;font-weight:900;color:#9A9A9A;letter-spacing:.08em;margin:16px 0 8px}
.avapick{display:flex;flex-wrap:wrap;gap:8px}
.avapick button{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:#fff;
  font-size:21px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.avapick button.on{border-color:var(--green);box-shadow:0 3px 0 var(--green-d);background:#F1FFE6}
.sw{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;color:#4B4B4B}
.sw input{width:20px;height:20px;accent-color:#58CC02}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:6px 0 4px}
.stats3 div{background:#FAFAFA;border:2px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.stats3 b{display:block;font-size:20px;font-weight:900;letter-spacing:-.02em}
.stats3 span{font-size:10.5px;color:#9A9A9A;font-weight:800}
.tabs{display:flex;gap:8px;padding:14px 16px 4px}
.tabs button{flex:1;border:2px solid var(--line);background:#fff;border-radius:13px;padding:10px 4px;
  font-family:inherit;font-size:12.5px;font-weight:900;color:#7B7B7B;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.tabs button.on{background:#F1FFE6;border-color:var(--green);color:var(--green-d);box-shadow:0 3px 0 var(--green-d)}
.rankrow{display:flex;align-items:center;gap:10px;padding:12px 14px}
.rankrow .rk{width:26px;text-align:center;font-weight:900;font-size:13px;color:#B5B5B5}
.rankrow .rkava{font-size:20px}
.rankrow b{font-size:14px;font-weight:900;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rankrow .rkval{font-size:12.5px;font-weight:900;color:var(--green-d)}
.empty .big{font-size:40px;display:block;margin-bottom:10px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;background:rgba(20,20,30,.42);display:flex;align-items:flex-end;
  justify-content:center;z-index:60}
.sheet-wrap[hidden]{display:none}
.sheet{width:100%;max-width:560px;background:#fff;border-radius:22px 22px 0 0;padding:20px 18px 26px;
  animation:up .24s ease;max-height:86vh;overflow:auto;border-top:3px solid var(--line)}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.sheet h3{margin:0 0 3px;font-size:18px;font-weight:900}
.sheet .sub{font-size:12px;color:var(--muted);margin-bottom:12px}
.sheet .line{font-size:11.5px;color:#8C8C8C;font-weight:900;letter-spacing:.08em;margin:16px 0 7px}
.sheet textarea{width:100%;min-height:96px;border:2px solid var(--line);border-radius:12px;padding:10px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#555;resize:vertical}

.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(12px);background:#3C3C3C;color:#fff;
  font-size:12.5px;font-weight:800;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;
  transition:.2s;z-index:80;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.on{opacity:1;transform:translateX(-50%)}
.qimgs{margin-top:12px;display:flex;flex-direction:column;gap:8px}

240596992","name":"医院信息系统的发展阶段及趋势","ch":"m2","qids":["q16","q17","q18","q19","q20","q21"],"chName":"软件工程概述","mian":0,"zhong":0,"nan":0,"note":"发展大体经历：单机收费为主的 HIS 起步阶段 → 以电子病历为核心的临床信息系统阶段 → 区域医疗与互联互通阶段。趋势是云化、智能化、标准化（HL7、FHIR 等）。"},{"id":"1889562364307705856","name":"医院信息系统分类及组成","ch":"m2","qids":["q22","q23","q24"],"chName":"软件工程概述","mian":0,"zhong":0,"nan":0,"note":"按业务可分为 HIS（医院管理）、CIS（临床）、LIS（检验）、PACS（影像）、EMR（电子病历）等；物理组成包括硬件、网络、数据库、应用软件与运维体系。"},{"id":"1889562364706164736","name":"软件危机","ch":"m2","qids":["q25","q26","q27","q28"],"chName":"软件工程概述","mian":0,"zhong":1,"nan":0,"note":"软件危机指软件开发中普遍存在的成本超支、进度延误、质量不可靠、难以维护等现象。根源是软件规模与复杂度快速增长，而工程化方法滞后。"},{"id":"1889562364773273600","name":"软件工程","ch":"m2","qids":["q29","q30","q31","q32","q33"],"chName":"软件工程概述","mian":0,"zhong":1,"nan":0,"note":"用工程化、系统化的方法开发和维护软件，强调开发过程、规范、度量与质量保证，以可控的成本和进度产出可靠、可维护的软件。"},{"id":"1889562365045903360","name":"软件开发模型的定义","ch":"m2","qids":["q34","q35","q36","q37","q38","q39","q40","q41"],"chName":"软件工程概述","mian":0,"zhong":0,"nan":0,"note":"软件开发模型是描述开发过程活动、顺序、产物与约束的框架，用来把复杂开发工作组织成可控、可管理的阶段。"},{"id":"1889562365113012224","name":"主要模型","ch":"m2","qids":["q42","q43","q44","q45","q46","q47","q48","q49","q50"],"chName":"软件工程概述","mian":0,"zhong":0,"nan":1,"note":"常见模型：瀑布模型（顺序推进、文档驱动）、原型模型（快速试错、需求不清时用）、螺旋模型（风险驱动、迭代）、增量与迭代模型、敏捷模型（小步快跑、拥抱变化）。选择取决于需求稳定性与项目风险。"},{"id":"1889562365847015424","name":"可行性研究","ch":"m3","qids":["q51","q52","q53","q54","q55","q56","q57","q58"],"chName":"项目计划","mian":1,"zhong":1,"nan":0,"note":"在立项前从技术、经济、操作、法律四方面论证项目是否值得做，避免盲目投入；产出可行性研究报告，作为是否立项的依据。"},{"id":"1889562366375497728","name":"系统流程图","ch":"m3","qids":["q59","q60"],"chName":"项目计划","mian":1,"zhong":0,"nan":1,"note":"系统流程图描述系统的物理模型，用符号表示输入、处理、存储、输出以及人工环节，说明数据在系统中如何流动。"},{"id":"1889562366442606592","name":"可行性研究报告内容","ch":"m3","qids":["q61","q62","q63","q64"],"chName":"项目计划","mian":1,"zhong":0,"nan":0,"note":"一般包括项目背景与目标、现行系统分析、候选方案、技术/经济/操作可行性分析、成本效益估算、结论与建议。"},{"id":"1889562366635544576","name":"需求分析","ch":"m4","qids":["q65","q66","q67"],"chName":"需求分析","mian":0,"zhong":1,"nan":0,"note":"明确系统“做什么”，产出需求规格说明书，涵盖功能需求、性能需求、数据需求与约束条件，是后续设计与验收的依据。"},{"id":"1889562366895591424","name":"数据流图","ch":"m4","qids":["q68","q69","q70","q71","q72","q73","x1"],"chName":"需求分析","mian":0,"zhong":1,"nan":0,"note":"由外部实体、加工、数据流、数据存储四要素组成，描述系统的逻辑模型；采用分层（0 层、1 层……）自顶向下逐层分解。"},{"id":"1889562367235330048","name":"数据字典","ch":"m4","qids":["q74","q75"],"chName":"需求分析","mian":0,"zhong":0,"nan":0,"note":"对数据流图中每个元素（数据流、数据存储、加工、外部实体）给出精确定义，是数据流图的配套说明，保证设计与开发理解一致。"},{"id":"1889562367646371840","name":"加工逻辑的定义、常用技术和作用","ch":"m4","qids":["q76"],"chName":"需求分析","mian":0,"zhong":0,"nan":0,"note":"描述一个加工“按什么规则做”的说明；常用结构化语言、判定表、判定树三类技术，作用是把 DFD 中的加工落到可实现的处理逻辑。"},{"id":"1889562367713480704","name":"结构化语言","ch":"m4","qids":["q77","q78","q79"],"chName":"需求分析","mian":0,"zhong":0,"nan":0,"note":"用顺序、选择、循环三种基本结构配合自然语言描述加工逻辑，介于自然语言与程序设计语言之间，既易懂又接近实现。"},{"id":"1889562368132911104","name":"结构化分析方法","ch":"m4","qids":["q80","q81","q82","q83","q84"],"chName":"需求分析","mian":0,"zhong":0,"nan":0,"note":"自顶向下、逐层分解的分析方法，用数据流图、数据字典、加工说明三件套描述系统的逻辑模型，强调“先逻辑后物理”。"},{"id":"1889562369022103552","name":"概要设计的任务","ch":"m5","qids":["q85","q86","q87","q88","q89","q90"],"chName":"概要设计","mian":0,"zhong":0,"nan":0,"note":"确定软件的模块结构、模块间接口、全局数据结构与处理流程，把需求转化为软件体系结构；不涉及模块内部的实现细节。"},{"id":"1889562369085018112","name":"耦合","ch":"m5","qids":["q91","q92","q93","q94","q95","q96","q97","q98","q99","q100","q101"],"chName":"概要设计","mian":0,"zhong":0,"nan":1,"note":"耦合是模块之间联系的紧密程度，越低越好。由低到高依次为：非直接耦合、数据耦合、标记耦合、控制耦合、外部耦合、公共耦合、内容耦合。"},{"id":"1889562369688997888","name":"内聚","ch":"m5","qids":["q102","q103","q104","q105","q106","q107","q108"],"chName":"概要设计","mian":0,"zhong":0,"nan":1,"note":"内聚是模块内部各成分结合的紧密程度，越高越好。由高到低：功能内聚、顺序内聚、通信内聚、过程内聚、时间内聚、逻辑内聚、偶然内聚。"},{"id":"1889562371031175168","name":"结构图（Structure Chart，SC）","ch":"m5","qids":["q109","q110","q111"],"chName":"概要设计","mian":0,"zhong":1,"nan":0,"note":"结构图描述模块的调用关系与参数传递，包含模块、调用、数据信息与控制信息；由数据流图映射得到，是概要设计的核心文档。"},{"id":"1889562371228307456","name":"结构化设计方法——变换映射","ch":"m5","qids":["q112","q113"],"chName":"概要设计","mian":0,"zhong":0,"nan":1,"note":"当 DFD 呈“输入—变换—输出”三段结构时，映射为输入模块、变换模块、输出模块三部分，得到变换型结构图。"},{"id":"1889562371295416320","name":"结构化设计方法——事务映射","ch":"m5","qids":["q114","q115","q116"],"chName":"概要设计","mian":0,"zhong":0,"nan":1,"note":"当 DFD 中存在事务中心（按条件分派多条处理路径）时，映射为事务控制模块加若干事务模块，得到事务型结构图。"},{"id":"1889562371618377728","name":"详细设计的任务","ch":"m6","qids":["q117","q118","q119","q120","q121","q122"],"chName":"详细设计","mian":0,"zhong":0,"nan":0,"note":"为每个模块设计内部算法与数据结构，明确处理细节，产出可直接用于编码的设计文档，是编码的直接依据。"},{"id":"1889562371886813184","name":"详细设计工具——程序流程图","ch":"m6","qids":["q123","q124","q125","q126","q127"],"chName":"详细设计","mian":0,"zhong":1,"nan":0,"note":"用图形符号表示程序的控制流程，直观易懂；但不强制结构化，容易画出带任意跳转的非结构化流程。"},{"id":"1889562371953922048","name":"详细设计工具——N-S图（盒图）","ch":"m6","qids":["q128","q129","x2"],"chName":"详细设计","mian":0,"zhong":1,"nan":0,"note":"用嵌套的矩形框表示顺序、选择、循环，只能表达结构化结构，没有箭头，避免随意跳转。"},{"id":"1889562372025225216","name":"详细设计工具——PAD图","ch":"m6","qids":["q130"],"chName":"详细设计","mian":0,"zhong":1,"nan":0,"note":"问题分析图，用二维树形结构表示：从左到右表示层次，自上而下表示顺序，适合逐步细化程序逻辑。"},{"id":"1889562372885057536","name":"测试方法","ch":"m8","qids":["q131","q132","x3"],"chName":"测试","mian":0,"zhong":1,"nan":0,"note":"分为黑盒测试（只看输入输出，验证功能）与白盒测试（看内部结构，验证逻辑覆盖）；按阶段又分单元测试、集成测试、系统测试、验收测试。"},{"id":"1889562375099650048","name":"调试","ch":"m8","qids":["q133","q134","q135"],"chName":"测试","mian":0,"zhong":0,"nan":0,"note":"测试负责发现错误，调试负责定位并修正错误。调试依赖经验与推理，先定位再改，改完需回归测试确认。"},{"id":"1889562375166758912","name":"自动测试工具","ch":"m8","qids":["q136","q137"],"chName":"测试","mian":0,"zhong":0,"nan":0,"note":"用脚本或工具自动执行测试用例、比对预期结果并生成报告，主要用于回归测试，提高效率与一致性。"},{"id":"1889562375372279808","name":"软件维护的概念及分类","ch":"m9","qids":["q138","q139","q140","q141","q142"],"chName":"软件维护","mian":0,"zhong":1,"nan":0,"note":"软件交付后的修改活动，分为改正性维护（修缺陷）、适应性维护（适应环境变化）、完善性维护（增加或改进功能）、预防性维护（提高可维护性以备将来）。"},{"id":"1889562375569412096","name":"软件维护的代价","ch":"m9","qids":["q143","q144","q145","q146","q147","q148"],"chName":"软件维护","mian":0,"zhong":1,"nan":0,"note":"维护费用通常占软件生命周期总成本的大部分（常超过 60%），且随使用年限上升。文档缺失、设计不良、频繁变更都会显著抬高维护代价。"},{"id":"1889562375770738688","name":"面向对象方法概述","ch":"m10","qids":["q149","q150"],"chName":"面向对象的方法","mian":0,"zhong":0,"nan":0,"note":"以对象为中心，把数据与操作封装在一起，通过继承与多态实现复用，使软件结构更贴近现实问题域。"},{"id":"1889562376181780480","name":"面向对象基本概念","ch":"m10","qids":["q151","q152"],"chName":"面向对象的方法","mian":0,"zhong":1,"nan":1,"note":"核心概念：对象、类、封装、继承、多态、消息。类是对对象的抽象，对象是类的实例；封装隐藏实现细节，继承复用共性，多态让同一消息产生不同响应。"},{"id":"1889562376450215936","name":"UML建模概述","ch":"m10","qids":["q153","q154","q155","q156"],"chName":"面向对象的方法","mian":0,"zhong":1,"nan":0,"note":"UML 是统一的建模语言，用一组图从结构与行为两方面描述系统。结构图包括类图、用例图、组件图、部署图；行为图包括顺序图、协作图、状态图、活动图。"},{"id":"1889562376651542528","name":"Use Case图","ch":"m10","qids":["q157","q158","q159","q160","q161","q162","q163"],"chName":"面向对象的方法","mian":0,"zhong":1,"nan":1,"note":"描述系统与外部参与者（Actor）之间的功能关系。要素有用例、参与者、关联，以及 include（包含）、extend（扩展）、泛化三种关系。"},{"id":"1889562377087750144","name":"类图（Class Diagram）的概念","ch":"m10","qids":["q164","q165","q166","q167","q168","q169","q170","q171"],"chName":"面向对象的方法","mian":0,"zhong":1,"nan":1,"note":"描述系统中类的静态结构与相互关系。类通常画成三栏：类名、属性、操作；类图是面向对象建模中最核心的图。"},{"id":"1889562377154859008","name":"类图的关系","ch":"m10","qids":["q172","q173","q174","q175","q176","q177","q178"],"chName":"面向对象的方法","mian":0,"zhong":1,"nan":1,"note":"类之间的关系有依赖、关联、聚合、组合、继承（泛化）、实现。依赖最弱、组合最强，菱形与箭头用于区分聚合与组合。"},{"id":"1889562377884667904","name":"建立系统动态模型","ch":"m10","qids":["q179","q180","q181","q182"],"chName":"面向对象的方法","mian":0,"zhong":0,"nan":0,"note":"用顺序图、协作图、状态图、活动图描述对象随时间变化的行为与交互，回答“系统运行起来怎么动”。"}],"questions":[{"id":"q1","ch":"m1","chName":"绪论","kp":"1889562363615645696","kpName":"医疗信息化","mian":0,"zhong":0,"nan":0,"no":1,"type":"单选题","kind":"single","stem":"医疗信息化的核心目标包括以下哪一项？","options":[{"k":"A","t":"降低医院建设成本"},{"k":"B","t":"提高医疗效率和服务质量"},{"k":"C","t":"减少就诊患者数量"},{"k":"D","t":"提升医护人员薪资水平"}],"answer":"B","explain":"医疗信息化的核心是借助信息技术提升医疗服务的效率与质量，例如减少重复录入、缩短等待时间、降低差错率。","own":0,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":388143884,"key":0,"optNotes":{"A":"降低成本是附带效果，不是核心目标。","B":"提高效率与服务质量，是核心目标。","C":"减少患者数量与信息化无关。","D":"薪资水平与信息化目标无关。"}},{"id":"q2","ch":"m1","chName":"绪论","kp":"1889562363615645696","kpName":"医疗信息化","mian":0,"zhong":0,"nan":0,"no":2,"type":"单选题","kind":"single","stem":"在医疗信息化中，电子病历系统（EMR）的核心作用是什么？","options":[{"k":"A","t":"记录患者的基本生活习惯"},{"k":"B","t":"支持临床决策和患者信息管理"},{"k":"C","t":"监测医疗设备的状态"},{"k":"D","t":"提供药品销售数据"}],"answer":"B","explain":"EMR 把患者的诊疗信息电子化并集中管理，既方便调阅与共享，也为临床决策（用药、检查、警示）提供依据。","own":0,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":388143884,"key":0,"optNotes":{"A":"生活习惯不是 EMR 的核心职能。","B":"支持临床决策与患者信息管理，正确。","C":"设备状态监测属于设备管理系统。","D":"药品销售数据属于药房或经营系统。"}},{"id":"q3","ch":"m1","chName":"绪论","kp":"1889562363615645696","kpName":"医疗信息化","mian":0,"zhong":0,"nan":0,"no":3,"type":"多选题","kind":"multi","stem":"以下哪些属于医疗信息化的主要应用场景？","options":[{"k":"A","t":"电子病历系统（EMR）"},{"k":"B","t":"远程医疗和在线诊断"},{"k":"C","t":"医院设备的物理维护"},{"k":"D","t":"健康数据的云存储与分析"},{"k":"E","t":"医疗保险的政策制定"}],"answer":"ABD","explain":"医疗信息化的应用场景集中在临床与健康数据环节：电子病历、远程医疗、健康数据云存储与分析。设备物理维护属后勤，医保政策制定属行政决策。","own":0,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":388143884,"key":0,"optNotes":{"A":"EMR 是典型应用场景。","B":"远程医疗是典型场景。","C":"设备物理维护是后勤维修，不属于信息化。","D":"健康数据云存储与分析是典型场景。","E":"医保政策制定属行政管理，不是信息化应用场景。"}},{"id":"q4","ch":"m1","chName":"绪论","kp":"1889562363682754560","kpName":"医学软件工程内容、主题与目标","mian":0,"zhong":0,"nan":0,"no":1,"type":"单选题","kind":"single","stem":"为什么医学软件工程需要特别关注数据安全性？","options":[{"k":"A","t":"医学领域数据量小"},{"k":"B","t":"医学数据通常涉及患者隐私和敏感信息"},{"k":"C","t":"医学数据可公开使用"},{"k":"D","t":"数据安全性对软件开发无关紧要"}],"answer":"B","explain":"医疗数据包含身份、诊断、用药、影像等敏感信息，一旦泄露或篡改后果严重，因此安全性是医学软件的首要约束。","own":0,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":388145364,"key":0,"optNotes":{"A":"医学数据量并不小，反而规模庞大。","B":"涉及隐私与敏感信息，是根本原因。","C":"医学数据绝不能公开使用。","D":"说安全无关紧要是错误的。"}},{"id":"q5","ch":"m1","chName":"绪论","kp":"1889562363682754560","kpName":"医学软件工程内容、主题与目标","mian":0,"zhong":0,"nan":0,"no":2,"type":"多选题","kind":"multi","stem":"软件工程的主要目标包括以下哪些？","options":[{"k":"A","t":"提升软件的可维护性和可靠性"},{"k":"B","t":"降低软件开发成本"},{"k":"C","t":"确保快速迭代开发"},{"k":"D","t":"提供高效的用户体验"},{"k":"E","t":"加强软件的安全性和隐私保护"}],"answer":"ABE","explain":"软件工程的主要目标是提高可维护性与可靠性、降低开发与维护成本、加强安全与隐私保护；快速迭代是手段，用户体验是设计追求，都不在经典目标清单内。","own":0,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":388145364,"key":0,"optNotes":{"A":"提升可维护性与可靠性，是主要目标。","B":"降低开发成本，是主要目标。","C":"快速迭代属于开发方式，不是目标。","D":"用户体验重要，但不属于本题列出的主要目标。","E":"加强安全与隐私保护，是主要目标。"}},{"id":"q6","ch":"m1","chName":"绪论","kp":"1889562363682754560","kpName":"医学软件工程内容、主题与目标","mian":0,"zhong":0,"nan":0,"no":3,"type":"单选题","kind":"single","stem":"医学软件工程的主要目标是什么？","options":[{"k":"A","t":"解决医学领域所有问题"},{"k":"B","t":"开发、评估和维护用于医学领域的软件系统"},{"k":"C","t":"取代医生的工作"},{"k":"D","t":"提高计算机硬件性能"}],"answer":"B","explain":"医学软件工程是用工程化方法开发、评估、维护医学领域软件系统的学科，既不是包治百病，也不替代医生。","own":0,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":388145364,"key":0,"optNotes":{"A":"“解决医学领域所有问题”是夸大。","B":"开发、评估、维护医学软件系统，正确。","C":"软件不取代医生。","D":"硬件性能不属于医学软件工程。"}},{"id":"q7","ch":"m1","chName":"绪论","kp":"1889562363682754560","kpName":"医学软件工程内容、主题与目标","mian":0,"zhong":0,"nan":0,"no":4,"type":"单选题","kind":"single","stem":"医学软件工程的主题不包括以下哪一项？","options":[{"k":"A","t":"软件开发生命周期管理"},{"k":"B","t":"医学影像处理技术"},{"k":"C","t":"药物化学分子结构分析"},{"k":"D","t":"医学数据的存储和安全性"}],"answer":"C","explain":"医学软件工程关注软件生命周期、医学数据处理、影像处理、存储与安全等；药物化学分子结构分析属于药学或化学专业领域。","own":0,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":388145364,"key":0,"optNotes":{"A":"生命周期管理是主题之一。","B":"医学影像处理是主题之一。","C":"药物化学分子结构分析属于药学领域，不是本课程主题。","D":"数据存储与安全是主题之一。"}},{"id":"q8","ch":"m1","chName":"绪论","kp":"1889562363682754560","kpName":"医学软件工程内容、主题与目标","mian":0,"zhong":0,"nan":0,"no":5,"type":"单选题","kind":"single","stem":"以下哪一项最能体现医学软件工程的目标？","options":[{"k":"A","t":"开发医疗诊断支持系统"},{"k":"B","t":"设计新的外科手术器械"},{"k":"C","t":"研究人类基因组"},{"k":"D","t":"优化医院建筑布局"}],"answer":"A","explain":"开发医疗诊断支持系统是典型的医学软件工程产出；器械设计、基因组研究、建筑布局分别属于医疗器械、生物学与基建。","own":0,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":388145364,"key":0,"optNotes":{"A":"诊断支持系统是医学软件，最能体现目标。","B":"手术器械属于医疗器械设计。","C":"基因组研究属于生物学。","D":"建筑布局属于基本建设。"}},{"id":"q9","ch":"m1","chName":"绪论","kp":"1889562363682754560","kpName":"医学软件工程内容、主题与目标","mian":0,"zhong":0,"nan":0,"no":6,"type":"单选题","kind":"single","stem":"医学软件工程在开发过程中需要遵循什么样的规范？","options":[{"k":"A","t":"一般软件开发规范即可，无需特殊要求"},{"k":"B","t":"既需要遵循软件工程规范，也需要符合医学领域的法律和伦理要求"},{"k":"C","t":"完全依赖医学领域的规范，软件工程规范可以忽略"},{"k":"D","t":"只需要满足用户需求，不需要遵守任何规范"}],"answer":"B","explain":"医学软件既要遵循软件工程的规范与流程，也必须符合医疗相关的法律法规与伦理要求（隐私、知情同意、数据安全）。","own":0,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":388145364,"key":0,"optNotes":{"A":"医学软件不能只用一般规范。","B":"两者都需遵循，正确。","C":"忽略软件工程规范会导致质量失控。","D":"不遵守任何规范是不可接受的。"}},{"id":"q10","ch":"m2","chName":"软件工程概述","kp":"1889562364177682432","kpName":"医院信息系统定义","mian":0,"zhong":0,"nan":0,"no":1,"type":"单选题","kind":"single","stem":"以下哪项最能准确描述医院信息系统（HIS）的核心目标？","options":[{"k":"A","t":"实现医院的全面自动化"},{"k":"B","t":"优化医院资源配置并提升医疗服务质量"},{"k":"C","t":"减少医院的运营成本"},{"k":"D","t":"实现患者数据的完全公开化"}],"answer":"B","explain":"HIS 的核心是通过信息整合优化资源配置、提升医疗服务质量与效率，“全面自动化”“数据公开”都不是它的目标。","own":0,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":460722763,"key":0,"optNotes":{"A":"“全面自动化”过于绝对。","B":"优化资源配置、提升服务质量，是核心目标。","C":"降成本是结果之一，不是核心目标。","D":"患者数据不能完全公开。"}},{"id":"q11","ch":"m2","chName":"软件工程概述","kp":"1889562364177682432","kpName":"医院信息系统定义","mian":0,"zhong":0,"nan":0,"no":2,"type":"单选题","kind":"single","stem":"医院信息系统（HIS）的定义中强调了其主要作用是？","options":[{"k":"A","t":"记录患者的就诊信息"},{"k":"B","t":"整合医院各类信息资源，提高医疗管理和服务效率"},{"k":"C","t":"管理医院的财务和人力资源"},{"k":"D","t":"提供医生的工作日志"}],"answer":"B","explain":"HIS 定义强调的是把医院各类信息资源整合起来，支撑医疗与管理，从而提高效率。","own":0,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":460722763,"key":0,"optNotes":{"A":"记录就诊只是最基本的一小块。","B":"整合信息资源、提高管理与服务效率，正确。","C":"财务人事只是其中一类模块。","D":"工作日志不是 HIS 的定位。"}},{"id":"q12","ch":"m2","chName":"软件工程概述","kp":"1889562364177682432","kpName":"医院信息系统定义","mian":0,"zhong":0,"nan":0,"no":3,"type":"单选题","kind":"single","stem":"医院信息系统（HIS）的发展对医疗行业的主要影响是以下哪一项？","options":[{"k":"A","t":"增加了医务人员的工作量"},{"k":"B","t":"改善了数据管理和提升了运营效率"},{"k":"C","t":"完全取代了传统的医疗管理方式"},{"k":"D","t":"降低了对信息安全的要求"}],"answer":"B","explain":"HIS 带来的主要变化是数据集中管理、流程可追溯、运营效率提升。","own":0,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":460722763,"key":0,"optNotes":{"A":"规范使用后总体是减负，不是增加。","B":"改善数据管理、提升运营效率，正确。","C":"“完全取代”过于绝对。","D":"信息化反而提高了安全要求。"}},{"id":"q13","ch":"m2","chName":"软件工程概述","kp":"1889562364177682432","kpName":"医院信息系统定义","mian":0,"zhong":0,"nan":0,"no":4,"type":"单选题","kind":"single","stem":"医院信息系统（HIS）与电子病历系统（EMR）的主要区别是什么？","options":[{"k":"A","t":"HIS侧重于医院整体管理，而EMR侧重于患者病历管理"},{"k":"B","t":"HIS仅供医生使用，而EMR面向所有医疗人员"},{"k":"C","t":"HIS主要用于数据存储，而EMR主要用于数据分析"},{"k":"D","t":"HIS是一种硬件系统，而EMR是一种软件系统"}],"answer":"A","explain":"HIS 覆盖全院管理（挂号、住院、收费、药品、财务等），EMR 聚焦患者病历信息的记录与调阅。","own":0,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":460722763,"key":0,"optNotes":{"A":"HIS 侧重整体管理、EMR 侧重病历，正确。","B":"HIS 面向全院各类人员。","C":"两者都既存储也分析。","D":"两者都是软件系统。"}},{"id":"q14","ch":"m2","chName":"软件工程概述","kp":"1889562364177682432","kpName":"医院信息系统定义","mian":0,"zhong":0,"nan":0,"no":5,"type":"单选题","kind":"single","stem":"医院信息系统（HIS）的主要功能不包括以下哪一项？","options":[{"k":"A","t":"患者信息管理"},{"k":"B","t":"临床决策支持"},{"k":"C","t":"医疗设备的硬件维修"},{"k":"D","t":"财务管理"}],"answer":"C","explain":"设备硬件维修属于设备科的后勤维修业务，不是信息系统的功能模块。","own":0,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":460722763,"key":0,"optNotes":{"A":"患者信息管理是 HIS 功能。","B":"临床决策支持是 HIS 功能。","C":"硬件维修属后勤，不是信息系统功能。","D":"财务管理是 HIS 功能。"}},{"id":"q15","ch":"m2","chName":"软件工程概述","kp":"1889562364177682432","kpName":"医院信息系统定义","mian":0,"zhong":0,"nan":0,"no":6,"type":"单选题","kind" :1,"type":"单选题","kind":"single","stem":"在数据流图中，○（椭圆）代表（ ）。","options":[{"k":"A","t":"源点"},{"k":"B","t":"终点"},{"k":"C","t":"加工"},{"k":"D","t":"模块"}],"answer":"C","explain":"数据流图四种符号：椭圆（圆）表示加工，矩形表示外部实体，箭头表示数据流，双线/开口矩形表示数据存储。","own":1,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":460841381,"key":1,"optNotes":{"A":"源点用矩形（外部实体）表示。","B":"终点同样用外部实体表示。","C":"椭圆表示加工，正确。","D":"模块是结构图的概念。"}},{"id":"q69","ch":"m4","chName":"需求分析","kp":"1889562366895591424","kpName":"数据流图","mian":0,"zhong":1,"nan":0,"no":2,"type":"单选题","kind":"single","stem":"在数据流图中，有名字及方向的成分是( )。","options":[{"k":"A","t":"控制流"},{"k":"B","t":"信息流"},{"k":"C","t":"数据流"},{"k":"D","t":"信号流"}],"answer":"C","explain":"数据流图中有名字、有方向的箭头就是数据流，表示数据在加工、实体、存储之间的流动。","own":1,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":460841381,"key":1,"optNotes":{"A":"控制流不是 DFD 的概念。","B":"“信息流”不是 DFD 的标准术语。","C":"数据流，正确。","D":"信号流不属于 DFD。"}},{"id":"q70","ch":"m4","chName":"需求分析","kp":"1889562366895591424","kpName":"数据流图","mian":0,"zhong":1,"nan":0,"no":3,"type":"单选题","kind":"single","stem":"对于分层的DFD，父图与子图的平衡指子图的输入、输出数据流同父图相应加工的输入、输出数据流（ ）","options":[{"k":"A","t":"必须一致"},{"k":"B","t":"数目必须相等"},{"k":"C","t":"名字必须相同"},{"k":"D","t":"数目必须不等"}],"answer":"A","explain":"父图与子图平衡指：子图的输入输出数据流必须与父图中对应加工的输入输出保持一致，否则说明分解有误。","own":1,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":460841381,"key":1,"optNotes":{"A":"必须一致，正确。","B":"只求数目相等不够，还要同名同义。","C":"名字相同但不一致仍不平衡。","D":"强调不等是错误的。"}},{"id":"q71","ch":"m4","chName":"需求分析","kp":"1889562366895591424","kpName":"数据流图","mian":0,"zhong":1,"nan":0,"no":4,"type":"单选题","kind":"single","stem":"通过（ ）可以完成数据流图的细化。","options":[{"k":"A","t":"结构分解"},{"k":"B","t":"功能分解"},{"k":"C","t":"数据分解"},{"k":"D","t":"系统分解"}],"answer":"B","explain":"DFD 的细化靠功能分解：把一个加工按功能拆成若干子加工，形成下一层数据流图。","own":1,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":460841381,"key":1,"optNotes":{"A":"结构分解不是 DFD 细化的说法。","B":"功能分解，正确。","C":"数据分解针对数据而非加工。","D":"系统分解过于笼统。"}},{"id":"q72","ch":"m4","chName":"需求分析","kp":"1889562366895591424","kpName":"数据流图","mian":0,"zhong":1,"nan":0,"no":5,"type":"单选题","kind":"single","stem":"DFD中的每个加工至少有（ ）","options":[{"k":"A","t":"一个输入流或一个输出流"},{"k":"B","t":"一个输入流和一个输出流"},{"k":"C","t":"一个输入流"},{"k":"D","t":"一个输出流"}],"answer":"B","explain":"DFD 中每个加工都必须既有输入数据流又有输出数据流（不能只进不出或只出不进），否则数据处理无意义。","own":1,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":460841381,"key":1,"optNotes":{"A":"“或”不成立，必须两者都有。","B":"一个输入和一个输出，正确。","C":"只有输入不完整。","D":"只有输出也不完整。"}},{"id":"q73","ch":"m4","chName":"需求分析","kp":"1889562366895591424","kpName":"数据流图","mian":0,"zhong":1,"nan":0,"no":6,"type":"判断题","kind":"judge","stem":"数据流图是描述软件系统物理模型的工具（ ）","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"错","explain":"数据流图描述的是系统的逻辑模型（做什么、数据怎么流），物理模型由系统流程图等描述。","own":1,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":460841381,"key":1,"optNotes":{"A":"说 DFD 是物理模型，错误。","B":"正确，DFD 是逻辑模型工具。"}},{"id":"x1","ch":"m4","chName":"需求分析","kp":"1889562366895591424","kpName":"数据流图","mian":0,"zhong":1,"nan":0,"no":7,"type":"简答题","kind":"text","stem":"（期末卷 综合题·30分）某银行需要开发一套处理活期存取款业务的软件系统，系统功能如下：\n（1）审查分类：系统首先根据储户所填的存/取款单，确定本次业务的性质，并将存/取款单和存折交下一步处理；\n（2）处理存款：系统将存款单上的存款金额分别记录在存折和帐目文件中，并将现金存入现金库；最后将存折还给储户；\n（3）处理取款：系统将取款单上的取款金额分别记录在存折和帐目文件中，并从现金库提取现金；最后将现金和存折还给储户。\n根据以上需求完成：1）绘制该系统的顶层、第一层和第二层数据流图（20 分）；2）绘制该系统的软件结构图（10 分）。","options":[],"answer":"","explain":"参考答案：\n\n一、顶层数据流图（0 层）\n外部实体：储户；中心加工：存取款业务处理系统。\n储户 → 系统：存/取款单、存折；系统 → 储户：现金、存折、（回执）。\n（现金库与帐目文件属于系统内部数据存储，顶层一般不画出，只画系统与外部实体之间的数据流。）\n\n二、第一层数据流图\n加工：P1 审查分类、P2 处理存款、P3 处理取款。\n数据存储：D1 存折文件、D2 帐目文件、D3 现金库。\n数据流：储户→P1 存/取款单；P1→P2 存款单＋存折；P1→P3 取款单＋存折；\nP2→D1 存款记录、P2→D2 存款帐目、P2→D3 现金入库、P2→储户 存折；\nP3→D1 取款记录、P3→D2 取款帐目、D3→P3 提现、P3→储户 现金＋存折。\n\n三、第二层数据流图（对 P2、P3 继续分解）\nP2 处理存款 → 2.1 登记存折、2.2 登记帐目、2.3 现金入库；\nP3 处理取款 → 3.1 登记存折、3.2 登记帐目、3.3 现金出库。\n分解后父图与子图必须平衡：子图的输入输出数据流与父图中对应加工的输入输出保持一致。\n\n四、软件结构图（SC）\n顶层模块：存取款业务系统。\n第一层：审查分类、处理存款、处理取款三个模块，由顶层调用，并传递「存/取款单」「存折」「金额」等数据信息。\n第二层：处理存款下挂「登记存折」「登记帐目」「现金入库」；处理取款下挂「登记存折」「登记帐目」「现金出库」。\n该结构由第一层 DFD 映射得到——P1 属于事务型（按业务性质分派到存款/取款两条路径），因此上层宜用事务型结构图；处理存款、处理取款各自内部是顺序执行的，对应变换型结构。\n\n评分要点：外部实体与数据存储是否齐全、数据流是否双向标注清楚、父图子图是否平衡、模块是否按事务/变换映射拆分。","own":1,"imgs":[],"ansImgs":["data:image/webp;base64,UklGRlY3AABXRUJQVlA4IEo3AADQAAGdASqEAzACPkkkj0YioaEhITXYwFAJCWlu/FuZ5ev40JB14+o+UDzD4Hvc9BPZXlIe8fw3nR/un67e4D9L+wB/bfKW/cf3Bf1b/jeoD9hP2v94j/i+oz/V/378mfkA/zH+l9cP/d///3E/8N/zPYA/a/04v3g+DD+2f8n9z/bc/////9wD//+1x/AP//1s/SP+Zfi733/z3+pfrl/WfSX8O+Qfp/5Df3P9m/gB/a/AvzT/rPQr+O/VP63/Z/23/tX7e/Cf88/Hv+wfs37H/BD9t/K7+4fIF+Lfxz+4f1X9uv7R+7/1E+4/4fuVM0/wf+C/qv68fv/9Avqz8i/tP9q/xf/A/uf7texL+9/zX9vfcD8o/qf+f/s/wAfxz+V/5X+v/3v/of3r///T/9L/73868jf6n/nf+L/dPgB/j39M/2X+Q/Ij6SP17/R/3T/L/8v++f///1fET8j/tH/E/xf+d/an7Bv5H/N/9J/bv8n/6/8j////H9wH/s9zH7Wf/L3Lf13/9f5/hdx5bm6OMeI0cY8Ro4x4jRxjxGjjHiNHGPEaOMeI0cY8Ro4qnbu1qJSVdRJLuyxM5bEfuo1MJmEgbK1O6RDnP1IU8SJDI8QXffhRDS/EtYV7p+dYO/C8kt9yiZ0bos9n8Ro4x4jRxjxGjjHiNHGPEaOMUzR/YnJdxuIq6rICuk4Th/INb19Se1DjT5CEQVqg4VWSufPkZfVnWgZiMxHxrypOyEjDtg2STR1QQrPx1VNLhsgoa5P6JcGe+VERW/FTyDIjrn0CD3Kkt7qx3MYlF4MRdhx1IQ9RNHGPEaOMeI0cY8Ro4x4jL1RZaostUWWqLLVFlqiy1RZa50tYx4jRxjxGjjHiNHGPEaOMeI0cY8Ro4x4jRxjxGjjHiNHGPEaOMeI0cY8Ro4x4jRxjxGjjHiNHGPEaOMeI0cY8Ro4x4jRxjxGjjHiNHGPEaOMeI0cY8Ro4x4jRxjxGjjHiNHGPEaOMeI0cY8Ro4x4jRxjxGjjHiNHGPEaOMeI0cY8Ro4x4jRxjxGjjHiNHGPEaOMeI0cY8Ro4x4jRxjxGjjHiNHGPEaOMeI0cY8Ro4x4jRxjxGjjHiNHGPEaOMeI0cY8Ro4x4jRxjxGjjHiNHGPEaOMeI0cY8Ro4x4jRxjxGjjHiNG6wTvBdJbsR7OKEM9K3eD2O4CV/os/yj+njgqFyaULsswktFm6OMeI0cY8Ro4x4jRxjxGjjHiH6AqnfobvWTnQuFFREZcUMhiDzQ86tDLqfB1hxafiNHGKWrD65LeObUgb9bC70eknlKkgij3YuonLhMR1JcvR8xkyuTrvhx0uQwM9WlEAyQtTpuGPpkhsoxTU2OTKV26Elb48tnabj07NwFIVu3N0cY8RDKZXRxiocFdWyKd775T+Pv/MyWT892ZQTaL1yj/tTzBvRv5Ppaw01iEPc+n5fDEAx1wZuxgqHVhVjc3SOWxe6LRpYdpwHqJo4x4h+spNQ48BhO6gPLWMeFNfPX0Djho8k6ApbtNGRJ9HGPEQNCGvORGWpeTuqQf3s3jYX0NsBp+D04Qsh5+4WjtFPTnT+nTOAagD4RpGP9qmOubQP0nWv9YB+UY8Ro4rQ36SCITJjhmiM/y9omsYqbXHFRDCmjP4HlrGPEZZ3teOkY60Fo2o6UY7rk+O08JqGwNEZFrnj6ipCWdNS4eyqVQniyH/pQxrP+k7L/K0rfHluUa+h5/3EPzgG5 ,"ref":"","score":null,"mine":"","paper":460995958,"key":1,"optNotes":{"A":"说法正确。","B":"与 N-S 图的设计目的矛盾。"}},{"id":"q129","ch":"m6","chName":"详细设计","kp":"1889562371953922048","kpName":"详细设计工具——N-S图（盒图）","mian":0,"zhong":1,"nan":0,"no":2,"type":"单选题","kind":"single","stem":"在详细设计的图示工具中，（ ）的形状象一个盒子。","options":[{"k":"A","t":"HIPO图"},{"k":"B","t":"流程图"},{"k":"C","t":"N-S图"},{"k":"D","t":"PAD图"}],"answer":"C","explain":"N-S 图（盒图）由嵌套的矩形框组成，外形就像一个盒子，因此得名。","own":1,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":460995958,"key":1,"optNotes":{"A":"HIPO 图是层次图。","B":"流程图用箭头与菱形。","C":"N-S 图，正确。","D":"PAD 图是树形二维图。"}},{"id":"x2","ch":"m6","chName":"详细设计","kp":"1889562371953922048","kpName":"详细设计工具——N-S图（盒图）","mian":0,"zhong":1,"nan":0,"no":3,"type":"简答题","kind":"text","stem":"（期末卷 第26题·10分）根据下图所示程序流程图，绘制等价的 N-S 盒图（图略，结构如下）：\n开始 → 判断 P：P 为假则结束；P 为真则顺序执行 A、B；\n接着判断 Q：Q 为真则返回 P 的条件判断处继续外层循环；Q 为假则返回 B 之前继续执行 B。\n请把该流程图转换为等价的 N-S 盒图，并说明转换后程序的执行顺序。","options":[],"answer":"","explain":"参考答案（文字版 N-S 图）：\n外层是「当 P 成立」的循环（while 型），循环体内包含两步：①执行 A；②进入「重复……直到 Q 成立」的内层循环（until 型），其循环体只有 B。\n\n① 外层：当型循环（先判断 P，成立才进入，P 为假直接结束）——对应流程图 P 处的判断与「结束」出口；\n② 循环体：先执行 A，再执行内层循环；\n③ 内层：重复型循环（先执行 B，再判断 Q；Q 为假继续做 B，Q 为真退出内层）；\n④ 内层退出后回到外层条件 P 继续判断，形成外层循环。\n\n用结构化语言描述：\nwhile P do\n    A;\n    repeat\n        B\n    until Q;\nend while\n\n要点：N-S 图只能用顺序、选择、循环三种结构化结构嵌套表示，P 对应「当型」循环框（带条件栏），Q 对应「直到型」循环框（条件写在下边框内），A、B 是顺序框，整个过程不需要任何箭头跳转。","own":1,"imgs":[],"ansImgs":["data:image/webp;base64,UklGRlwoAABXRUJQVlA4IFAoAADQ/QCdASqEA4ACPkkij0YioaEhITE5EFAJCWlu4XdF9tBc/xC/btWm9H5otha4DPXl/DAeYB40f6we4D9wPUB5o3+m/aT3Tf3D1AP69/lOsP9Any1f28+Ev+7/9n0uNWI8Gf1T+S/qj33/0j8ifOH8Q+T/rv5Hf2P2Jf5vx58/eZf8Z+pv2j+tftd/eP3Q+G/6r+PXmv7tv3X1Bfx3+Of2/+yftR/dv3j4/zJv69/ePUC9aPj393/q37gf2P92/Xy/YfzC9xPzj+r/8X3AP47/Lf8x/a/3q/t3//+gv7L/lvGZ+y/6D/fe4D/JP6z/tP8V/mf2O+k/9r/1/9u/zf/U/z3///+Pw7/K/7v/2P8L8BH8q/oX+1/v3+R/9n+i////7+7D/4e6f90P//7nH7Vf/8Ohpnw0tLuhpnw0tLuhpnw0tLuhpnw0tLuhpnw0tLuhpnw0tLtk55w6q9K+YeprfWhE27qcdTqyTrChn70McC7w "C","t":"黑盒测试"},{"k":"D","t":"白盒测试"}],"answer":"CD","explain":"动态测试是从测试方法维度划分的：黑盒测试（只看输入输出）与白盒测试（看内部逻辑与覆盖）。单元测试、集成测试是按阶段的划分，属于另一个维度。","own":1,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":461012844,"key":1,"optNotes":{"A":"单元测试是测试阶段，不是方法分类。","B":"集成测试也是阶段划分。","C":"黑盒测试属动态测试方法。","D":"白盒测试属动态测试方法。"}},{"id":"q132","ch":"m8","chName":"测试","kp":"1889562372885057536","kpName":"测试方法","mian":0,"zhong":1,"nan":0,"no":2,"type":"单选题","kind":"single","stem":"一只小狗在叫，叫是这个小狗对象的（ ）","options":[{"k":"A","t":"属性"},{"k":"B","t":"事件"},{"k":"C","t":"方法"},{"k":"D","t":"调用"}],"answer":"C","explain":"对象的状态与特征叫属性，对象的动作与行为叫方法。“叫”是动作，因此是方法。","own":1,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":461012844,"key":1,"optNotes":{"A":"属性描述状态或特征。","B":"事件是触发行为的动作，不是行为本身。","C":"叫是行为动作，属方法，正确。","D":"调用是使用方法的动作。"}},{"id":"x3","ch":"m8","chName":"测试","kp":"1889562372885057536","kpName":"测试方法","mian":0,"zhong":1,"nan":0,"no":3,"type":"简答题","kind":"text","stem":"（期末卷 第27题）用等价分类法设计测试用例。\n用户设置密码时，要求符合以下规范，如不符合则输出相应的错误信息：\n1）设置的密码应包含 6～8 个字符；\n2）密码可以是字母、数字和符号（仅限 ASCII 标准字符）；\n3）密码应至少包含一个大写字母和一个符号。\n请分析程序规格说明中对输入条件的要求，列出等价类表（包含有效等价类和无效等价类），并使用等价分类法设计测试用例。","options":[],"answer":"","explain":"参考答案：\n\n一、等价类划分\n① 长度：有效 6≤L≤8；无效 L<6；无效 L>8\n② 字符集：有效 全部为 ASCII 字母/数字/符号；无效 含非 ASCII 字符（中文、全角符号、空格等）\n③ 大写字母：有效 ≥1 个大写字母；无效 无大写字母\n④ 符号：有效 ≥1 个符号；无效 无符号\n\n二、测试用例（每条只针对一个无效类，其余条件均取有效值）\n1. Abc12!　→ 6 位、含大写 A 与符号 !　→ 通过（有效）\n2. Abcd123!　→ 8 位、有效　→ 通过（边界上界）\n3. Abc1!　→ 5 位　→ 期望提示「长度不足」\n4. Abcd1234!　→ 9 位　→ 期望提示「长度超限」\n5. abc123!　→ 无大写字母　→ 期望提示「需含大写字母」\n6. Abc1234　→ 无符号　→ 期望提示「需含符号」\n7. Abc 12!　→ 含空格（非允许字符）　→ 期望提示「含非法字符」\n8. Ａbc12!　→ 含全角字母（非 ASCII）　→ 期望提示「含非法字符」\n\n要点：无效等价类要逐一覆盖，不能几个无效条件放在同一条用例里（否则无法判断是哪个条件触发报错）；有效用例应尽量取边界值（6 位与 8 位）。","own":1,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":0,"key":1},{"id":"q133","ch":"m8","chName":"测试","kp":"1889562375099650048","kpName":"调试","mian":0,"zhong":0,"nan":0,"no":1,"type":"单选题","kind":"single","stem":"在调试过程中，哪种方法最常用来定位程序中的错误？","options":[{"k":"A","t":"代码注释"},{"k":"B","t":"断点调试"},{"k":"C","t":"重写代码"},{"k":"D","t":"代码格式化"}],"answer":"B","explain":"断点调试可以在可疑位置暂停程序、检查变量与调用栈，是最常用的错误定位手段。","own":0,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":461020802,"key":1,"optNotes":{"A":"注释不参与执行，无法定位错误。","B":"断点调试，正确。","C":"重写代码是最后手段，不是定位方法。","D":"格式化只改排版。"}},{"id":"q134","ch":"m8","chName":"测试","kp":"1889562375099650048","kpName":"调试","mian":0,"zhong":0,"nan":0,"no":2,"type":"单选题","kind":"single","stem":"在调试过程中，哪一个选项最能帮助开发者发现逻辑错误？","options":[{"k":"A","t":"打印日志信息"},{"k":"B","t":"代码格式化工具"},{"k":"C","t":"自动补全工具"},{"k":"D","t":"语法检查工具"}],"answer":"A","explain":"打印日志能记录运行时的中间状态与分支走向，是发现逻辑错误最直接的成本低手段。","own":0,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":461020802,"key":1,"optNotes":{"A":"打印日志，正确。","B":"格式化工具不查逻辑。","C":"自动补全只影响编码效率。","D":"语法检查只查语法，不查逻辑。"}},{"id":"q135","ch":"m8","chName":"测试","kp":"1889562375099650048","kpName":"调试","mian":0,"zhong":0,"nan":0,"no":3,"type":"单选题","kind":"single","stem":"在调试时，以下哪种情况最适合使用单步调试？","options":[{"k":"A","t":"程序崩溃且完全无法启动"},{"k":"B","t":"需要逐步检查代码的执行路径"},{"k":"C","t":"需要快速定位大规模程序的瓶颈"},{"k":"D","t":"需要对全局变量的状态进行批量检查"}],"answer":"B","explain":"单步调适用于需要逐行跟踪执行路径、观察变量如何变化的场景。","own":0,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":461020802,"key":1,"optNotes":{"A":"完全无法启动时根本无法单步。","B":"逐步检查执行路径，正确。","C":"性能瓶颈要靠性能分析工具。","D":"批量检查全局变量更适合日志或监视窗口。"}},{"id":"q136","ch":"m8","chName":"测试","kp":"1889562375166758912","kpName":"自动测试工具","mian":0,"zhong":0,"nan":0,"no":1,"type":"单选题","kind":"single","stem":"自动测试工具的主要作用不包括以下哪一项？","options":[{"k":"A","t":"减少人工测试的工作量"},{"k":"B","t":"提高测试的准确性"},{"k":"C","t":"完全替代人工测试"},{"k":"D","t":"提高测试效率"}],"answer":"C","explain":"自动测试工具能减少人工工作量、提高准确性与效率，但无法完全替代人工测试，尤其是探索性测试与体验判断。","own":0,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":461031103,"key":1,"optNotes":{"A":"减少人工工作量，是它的作用。","B":"提高准确性，是它的作用。","C":"“完全替代人工测试”不成立，故选它。","D":"提高效率，是它的作用。"}},{"id":"q137","ch":"m8","chName":"测试","kp":"1889562375166758912","kpName":"自动测试工具","mian":0,"zhong":0,"nan":0,"no":2,"type":"单选题","kind":"single","stem":"以下哪种测试类型最适合使用自动测试工具？","options":[{"k":"A","t":"用户体验测试"},{"k":"B","t":"界面设计测试"},{"k":"C","t":"回归测试"},{"k":"D","t":"需求分析"}],"answer":"C","explain":"回归测试是反复执行既有用例、验证修改没有破坏原有功能，最典型地适合自动化。","own":0,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":461031103,"key":1,"optNotes":{"A":"用户体验测试需要人的主观判断。","B":"界面设计测试偏人工评审。","C":"回归测试，正确。","D":"需求分析不是测试活动。"}},{"id":"q138","ch":"m9","chName":"软件维护","kp":"1889562375372279808","kpName":"软件维护的概念及分类","mian":0,"zhong":1,"nan":0,"no":1,"type":"单选题","kind":"single","stem":"在软件维护的分类中，哪一种维护主要目的是为了修正软件中的错误或缺陷？","options":[{"k":"A","t":"适应性维护"},{"k":"B","t":"完善性维护"},{"k":"C","t":"纠错性维护"},{"k":"D","t":"预防性维护"}],"answer":"C","explain":"纠错性维护（改正性维护）专门用于修复运行中暴露的错误与缺陷。","own":0,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":468213313,"key":0,"optNotes":{"A":"适应性维护是适应环境变化。","B":"完善性维护是增强功能。","C":"纠错性维护，正确。","D":"预防性维护是为将来做准备。"}},{"id":"q139","ch":"m9","chName":"软件维护","kp":"1889562375372279808","kpName":"软件维护的概念及分类","mian":0,"zhong":1,"nan":0,"no":2,"type":"单选题","kind":"single","stem":"以下哪种类型的软件维护属于为适应外部环境变化而进行的修改？","options":[{"k":"A","t":"纠错性维护"},{"k":"B","t":"适应性维护"},{"k":"C","t":"完善性维护"},{"k":"D","t":"预防性维护"}],"answer":"B","explain":"外部环境发生变化（操作系统升级、硬件更换、法规调整）时的修改属适应性维护。","own":0,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":468213313,"key":0,"optNotes":{"A":"纠错性维护修缺陷。","B":"适应性维护，正确。","C":"完善性维护加功能。","D":"预防性维护防患未然。"}},{"id":"q140","ch":"m9","chName":"软件维护","kp":"1889562375372279808","kpName":"软件维护的概念及分类","mian":0,"zhong":1,"nan":0,"no":3,"type":"单选题","kind":"single","stem":"完善性维护的主要目标是：","options":[{"k":"A","t":"修复软件缺陷"},{"k":"B","t":"增强软件功能或性能"},{"k":"C","t":"防止潜在问题发生"},{"k":"D","t":"对外部环境变化做出响应"}],"answer":"B","explain":"完善性维护是在软件运行期间增加新功能或改进性能，满足用户新的需求。","own":0,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":468213313,"key":0,"optNotes":{"A":"修复缺陷属纠错性维护。","B":"增强功能或性能 外部视角，是其特征。","B":"内部视角说法错误，故选它。","C":"由 Actor 初始化，是其特征。","D":"为 Actor 提供值，是其特征。"}},{"id":"q160","ch":"m10","chName":"面向对象的方法","kp":"1889562376651542528","kpName":"Use Case图","mian":0,"zhong":1,"nan":1,"no":4,"type":"判断题","kind":"judge","stem":"Use Case之间可以是调用关系。（ ）","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"错","explain":"用例之间只有 include（包含）、extend（扩展）、泛化三种关系，不存在“调用”关系。","own":1,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":468912395,"key":1,"optNotes":{"A":"说“调用关系”是错的。","B":"正确，用例间无调用关系。"}},{"id":"q161","ch":"m10","chName":"面向对象的方法","kp":"1889562376651542528","kpName":"Use Case图","mian":0,"zhong":1,"nan":1,"no":5,"type":"判断题","kind":"judge","stem":"一个Actor和Use Case之间的通信关联对应一个边界类。（ ）","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"对","explain":"参与者与用例之间的通信关联，在实现层面通常对应一个边界类（负责与外部交互的界面/接口对象）。","own":1,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":468912395,"key":1,"optNotes":{"A":"说法正确。","B":"与边界类的定义矛盾。"}},{"id":"q162","ch":"m10","chName":"面向对象的方法","kp":"1889562376651542528","kpName":"Use Case图","mian":0,"zhong":1,"nan":1,"no":6,"type":"单选题","kind":"single","stem":"Use Case图中不包括：（ ）","options":[{"k":"A","t":"Use Case（用例）"},{"k":"B","t":"Actor（执行者）"},{"k":"C","t":"通信关联"},{"k":"D","t":"加工处理"}],"answer":"D","explain":"用例图的基本元素是用例、参与者、通信关联（以及 include/extend 等关系）；“加工处理”是数据流图的元素。","own":1,"imgs":[],"ansImgs":[],"ref":"","score":null,"mine":"","paper":468912395,"key":1,"optNotes":{"A":"用例是基本元素。","B":"参与者是基本元素。","C":"通信关联是基本元素。","D":"加工处理属 DFD，不在用例图中。"}},{"id":"q163","ch":"m10","chName":"面向对象的方法","kp":"1889562376651542528","kpName":"Use Case图","mian":0,"zhong":1,"nan":1,"no":7,"type":"判断题","kind":"judge","stem":"下图表示UseCaseB是UseCaseA和UseCaseC的公共部分。（ ）","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"对","explain":"B 是 A、C 的共同部分并被提取出来复用，指从 A、C 指向 B 的 include（包含）关系，箭头方向指向被包含的公共用例。","own":1,"imgs":["data:image/webp;base64,UklGRpYnAABXRUJQVlA4IIonAABQqQCdASrLAVwBPlUqkkYjoqGhJFO6GHAKiWdu4XCBCCMdq/NPs3OjybOyfMHxv9Z6 function loadAuth(){
  try { return JSON.parse(localStorage.getItem(AUTH_KEY) || "null"); } catch(e){ return null; }
}
function saveAuth(){ try { localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); } catch(e){} }
function sbHeaders(extra){
  var h = { "apikey": SUPA.key, "Content-Type": "application/json" };
  if (auth && auth.access_token) h["Authorization"] = "Bearer " + auth.access_token;
  else h["Authorization"] = "Bearer " + SUPA.key;
  if (extra) for (var k in extra) h[k] = extra[k];
  return h;
}
async function sbSignUp(email, password){
  var r = await fetch(SUPA.url + "/auth/v1/signup", {
    method: "POST", headers: sbHeaders(), body: JSON.stringify({ email: email, password: password })
  });
  var j = await r.json();
  if (!r.ok) throw new Error(j.msg || j.error_description || j.message || "注册失败");
  if (j.access_token) { auth = { access_token: j.access_token, refresh_token: j.refresh_token, user: j.user }; saveAuth(); await ensureProfile(); return true; }
  return false; // 需要邮箱确认
}
async function sbSignIn(email, password){
  var r = await fetch(SUPA.url + "/auth/v1/token?grant_type=password", {
    method: "POST", headers: sbHeaders(), body: JSON.stringify({ email: email, password: password })
  });
  var j = await r.json();
  if (!r.ok) throw new Error(j.error_description || j.msg || "登录失败");
  auth = { access_token: j.access_token, refresh_token: j.refresh_token, user: j.user };
  saveAuth(); await ensureProfile(); return true;
}
function sbSignOut(){ auth = null; saveAuth(); }
async function sbRefresh(){
  if (!auth || !auth.refresh_token) return false;
  try {
    var r = await fetch(SUPA.url + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST", headers: sbHeaders(), body: JSON.stringify({ refresh_token: auth.refresh_token })
    });
    if (!r.ok) return false;
    var j = await r.json();
    auth.access_token = j.access_token; auth.refresh_token = j.refresh_token; saveAuth(); return true;
  } catch(e){ return false; }
}
async function sbFetch(path, opts){
  opts = opts || {};
  var r = await fetch(SUPA.url + path, {
    method: opts.method || "GET",
    headers: sbHeaders(opts.headers), body: opts.body
  });
  if (r.status === 401) { if (await sbRefresh()) return sbFetch(path, opts); }
  return r;
}
async function ensureProfile(){
  if (!auth || !auth.user) return;
  await sbFetch("/rest/v1/profiles?on_conflict=id", {
    method: "POST",
    headers: { "Prefer": "resolution=merge-duplicates,return=representation" },
    body: JSON.stringify([{ id: auth.user.id, nickname: (auth.profile && auth.profile.nickname) || ("同学" + String(auth.user.id).slice(0,4)), avatar: (auth.profile && auth.profile.avatar) || "🦉", public_rank: auth.profile ? auth.profile.public_rank : true }])
  });
  var r = await sbFetch("/rest/v1/profiles?id=eq." + auth.user.id + "&select=*");
  if (r.ok) { var rows = await r.json(); if (rows && rows[0]) { auth.profile = rows[0]; saveAuth(); } }
}
function myStats(course){
  var done=0, right=0, wrong=0, answers=0;
  Q.forEach(function(q){
    var r = store.rec[q.id];
    if (r) { done++; if (r.last==="right") right++; else wrong++; answers += (r.c||0)+(r.w||0); }
  });
  return { course: course, done: done, total: Q.length, right_cnt: right, wrong_cnt: wrong, answers: answers };
}
var syncTimer = null;
function queueSync(){
  if (!auth) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(doSync, 1200);
}
async function doSync(){
  if (!auth) return;
  var st = myStats(DATA.course);
  try {
    await sbFetch("/rest/v1/stats?on_conflict=uid,course", {
      method: "POST",
      headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify([{ uid: auth.user.id, course: st.course, done: st.done, total: st.total, right_cnt: st.right_cnt, wrong_cnt: st.wrong_cnt, answers: st.answers }])
    });
  } catch(e){}
}

    +'<button data-act="fav"><em>⭐</em>收藏</button>'
    +'</div>'

        +'<b>'+esc(k.name)+'</b><span class="kdrow-n">'+k.qids.length+' 题</span><span class="kdrow-a">›</span></div>';

/* ---------- study ---------- */
function startDeck(ids,title){
  if(!ids.length){ toast("这里还没有题目"); return; }
  S.deck=ids.slice(); S.idx=0; S.ans={}; S.pick=[]; S.title=title||""; S.stat={r:0,w:0}; S.t0=Date.now();
  S.view="study"; render();
}
function viewStudy(){
  if(S.idx>=S.deck.length) return viewSummary();
  var q=QM[S.deck[S.idx]], a=S.ans[q.id], r0=rec(q.id);
  var p=(S.idx+1)/S.deck.length;
  var h='<div class="top"><button class="iconbtn" data-act="home">←</button>'
    +'<div class="ttl">'+(S.idx+1)+' / '+S.deck.length+'</div>'
    +'<button class="iconbtn" data-act="kp-quick">◈</button></div>'
    +'<div class="bar"><i style="width:'+(p*100)+'%"></i></div>';
  h+='<div class="card"><div class="ctop"><span class="chip type">'+esc(q.type)+'</span>'
    +(q.key?'<span class="chip key">★ 考点</span>':'')
    +(q.zhong?'<span class="chip zhong">重点</span>':'')
    +(q.nan?'<span class="chip nan">难点</span>':'')
    +(q.mian?'<span class="chip mian">免考</span>':'')
    +'<button class="fav'+(isFav(q.id)?" on":"")+'" data-act="fav">'+(isFav(q.id)?"★":"☆")+'</button></div>'
    +'<div class="stem">'+esc(q.stem).split("\n").join("<br>")+'</div>'
    +((q.imgs && q.imgs.length) ? '<div class="qimgs">'+q.imgs.map(function(u){return '<img src="'+u+'" alt="题目配图">';}).join('')+'</div>' : '');

  if(q.kind==="text"){
    h+='<div class="opts"><button class="opt" data-act="reveal"><span class="k">?</span><span>简答题：先自己想，再点“看参考答案”</span></button></div>';
  } else {
    h+='<div class="opts">';
    q.options.forEach(function(o){
      var cls="opt";
      if(a){
        if(q.kind==="multi"){ var corr=q.answer.indexOf(o.k)>=0, ch=(a.picked||[]).indexOf(o.k)>=0;
          if(corr) cls+=" ok"; else if(ch) cls+=" bad"; }
        else if(q.kind==="judge"){ if(o.t===q.answer) cls+=" ok"; else if(a.picked===o.t) cls+=" bad"; }
        else { if(o.k===q.answer) cls+=" ok"; else if(a.picked===o.k) cls+=" bad"; }
      } else if(q.kind==="multi" && S.pick.indexOf(o.k)>=0) cls+=" sel";
      h+='<button class="'+cls+'" data-opt="'+esc(o.k)+'" data-txt="'+esc(o.t)+'">'
        +'<span class="k">'+esc(o.k)+'</span><span>'+esc(o.t)+'</span></button>';
      if(a && q.optNotes && q.optNotes[o.k]){
        var _r = (q.kind==="judge") ? (o.t===q.answer)
               : (q.kind==="multi" ? String(q.answer).indexOf(o.k)>=0 : o.k===q.answer);
        h+='<div class="optnote '+(_r?"right":"wrong")+'">'+esc(q.optNotes[o.k])+'</div>';
      }
    });
    h+='</div>';
    if(q.kind==="multi" && !a){
      h+='<div style="margin-top:12px"><button class="btn primary wide" data-act="confirm"'+(S.pick.length?'':' disabled')+'>确认选择（'+S.pick.length+'）</button></div>';
    }
  }
  if(a) h+=feedback(q,a,r0);
  h+='</div>';
  h+='<div class="ctrl"><button class="btn ghost" data-act="prev"'+(S.idx===0?' disabled':'')+'>上一题</button>'
    +'<button class="btn ghost" data-act="reveal"'+(a?' disabled':'')+'>看答案</button>'
    +'<button class="btn primary" data-act="next">'+(S.idx===S.deck.length-1?'完成':'下一题')+'</button></div>';
  h+='<div class="meta">'+esc(q.chName)+' · 第 '+q.no+' 题'+(q.score?' · '+q.score+' 分':'')+'</div>';
  return h;
}
function optText(q,k){ var o=(q.options||[]).filter(function(x){return x.k===k;})[0]; return o?(k+"「"+o.t+"」"):k; }
function pickedText(q,a){
  if(!a.picked) return "（未作答）";
  if(q.kind==="multi") return a.picked.map(function(k){return optText(q,k);}).join("、");
  if(q.kind==="judge") return a.picked;
  return optText(q,a.picked);
}
function rightText(q){
  if(q.kind==="judge"||q.kind==="text") return q.answer||"见参考答案";
  return String(q.answer||"").split("").map(function(k){return optText(q,k);}).join("、");
}
function feedback(q,a,r0){
  var ok=a.ok, h='<div class="fb '+(ok?"ok":"bad")+'">';
  h+='<div class="head">'+(ok?"✓ 答对了":(a.revealed?"○ 已看答案":"✕ 答错了"))
    +'<span class="ans">正确答案 '+esc(rightText(q))+'</span></div>';
  h+='<div class="kp">知识点 <button class="kplink" data-kp="'+q.kp+'">'+esc(q.kpName)+'</button>'
    +'<span>该知识点 '+kpStats(q.kp).total+' 题 · 已掌握 '+kpStats(q.kp).right+'</span></div>';
  if(!ok && a.picked){
    h+='<div class="why"><b>错因分析</b><div class="line2">你选的是 <em>'+esc(pickedText(q,a))+'</em><br>正确答案是 <i>'+esc(rightText(q))+'</i></div></div>';
  }
  if(a && q.ansImgs && q.ansImgs.length){
    h+='<div class="ansimgs">'+q.ansImgs.map(function(u,i){return '<img src="'+u+'" alt="答案图 '+(i+1)+'">';}).join('')+'</div>';
  }
  if(q.explain) h+='<div class="exp">'+(q.own?'解析（整理补充）：':'解析：')+esc(q.explain)+'</div>';
  else if(a) h+='<div class="exp">暂无解析</div>';
  if(a && KM[q.kp] && KM[q.kp].note) h+='<div class="kpnote"><b>知识点解析 · '+esc(KM[q.kp].name)+'</b>'+esc(KM[q.kp].note)+'</div>';
  if(q.kind==="text" && q.ref) h+='<div class="ref"><b>参考答案</b>'+esc(q.ref)+'</div>';
  if(r0.c+r0.w>0) h+='<div class="exp" style="color:#9A9A9A">历史：答对 '+r0.c+' 次，答错 '+r0.w+' 次</div>';
  h+='</div>';
  return h;
}
function judge(q,p){
  if(q.kind==="single") return p===q.answer;
  if(q.kind==="judge") return p===q.answer;
  if(q.kind==="multi") return p.slice().sort().join("")===q.answer.split("").sort().join("");
  return false;
}
function commit(q,ok,picked,revealed){
  S.ans[q.id]={ok:ok,picked:picked,revealed:!!revealed};
  var r=store.rec[q.id]||{c:0,w:0,last:null};
  if(ok) r.c++; else r.w++;
  r.last = ok?"right":"wrong";
  store.rec[q.id]=r;
  if(ok) S.stat.r++; else S.stat.w++;
  sfx(ok ? "ok" : "bad");
  queueSync();
  var k=today(); store.daily[k]=store.daily[k]||{n:0}; store.daily[k].n++;
  save(); render();
}

/* ---------- summary ---------- */
function viewSummary(){
  sfx("win");
  var t=S.stat.r+S.stat.w, secs=Math.max(1,Math.round((Date.now()-S.t0)/1000));
  var mm=Math.floor(secs/60), ss=secs%60;
  var h='<div class="top"><button class="iconbtn" data-act="home">←</button><div class="ttl">本轮完成</div><button class="iconbtn" data-act="menu" title="菜单">☰</button></div>';
  h+='<div class="sum"><div style="display:inline-block">'+ring(S.stat.r/Math.max(1,t),132,11,"#58CC02","#EDEDED")+'</div>';
  h+='<h2>'+pct(S.stat.r,t)+'% 正确</h2><p>'+esc(S.title||"本轮练习")+'</p>';
  h+='<div class="sumstats"><div><b>'+t+'</b>题数</div><div><b style="color:#58CC02">'+S.stat.r+'</b>答对</div>'
    +'<div><b style="color:#FF4B4B">'+S.stat.w+'</b>答错</div><div><b>'+mm+':'+(ss<10?"0":"")+ss+'</b>用时</div></div>';
  h+='<div style="display:flex;gap:9px"><button class="btn ghost" style="flex:1" data-act="again">再来一轮</button>'
    +'<button class="btn primary" style="flex:1.2" data-act="home">回到首页</button></div></div>';
  return h;
}

      +'<button class="btn blue" style="flex:1.2" data-act="import">导入</button></div>';
    h+='<div class="kdnote" style="margin-top:12px">小提示：把这份 html 发给自己时，只要文件名和打开方式不变，进度就还在。</div>';
  }
  h+='<div class="line">音效</div>'
    +'<label class="sw"><input type="checkbox" id="sfxBox" '+(SFX_ON?"checked":"")+'> 答题音效（答对/答错/完成）</label>'
    +'<div class="line">重置</div><div style="display:flex;gap:9px"><button class="btn ghost small" data-act="reset">清空全部进度</button></div>';
  $("#sheet").innerHTML=h; $("#sheetWrap").hidden=false;
}
function closeSheet(){ $("#sheetWrap").hidden=true; }


/* ---------- views: auth / me / rank ---------- */
function viewAuth(mode){
  mode = mode || "login";
  var h='<div class="top"><button class="iconbtn" data-act="home">←</button><div class="ttl">'+(mode==="login"?"登录":"注册")+'</div><button class="iconbtn" data-act="menu" title="菜单">☰</button></div>';
  h+='<div style="padding:20px 18px">'
    +'<div style="font-size:20px;font-weight:900;letter-spacing:-.02em;margin-bottom:6px">'
    +(mode==="login"?"登录后进排行榜":"创建账号，一起卷")+'</div>'
    +'<div style="font-size:12.5px;color:#9A9A9A;margin-bottom:18px">账号只用来存昵称、战绩和排名；不登录也能刷题，进度只在本机。</div>'
    +'<input id="authEmail" class="inp" type="email" placeholder="邮箱" autocomplete="email">'
    +'<input id="authPass" class="inp" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password">'
    +'<button class="btn primary wide" style="margin-top:6px" data-act="'+(mode==="login"?"doLogin":"doSignup")+'">'
    +(mode==="login"?"登录":"注册并登录")+'</button>'
    +'<button class="btn ghost wide" style="margin-top:9px" data-act="'+(mode==="login"?"signup":"login")+'">'
    +(mode==="login"?"没有账号？注册":"已有账号？去登录")+'</button>'
    +'<div id="authMsg" style="margin-top:12px;font-size:12.5px;color:#D33131;text-align:center"></div>'

function viewMe(){
  if(!auth) return viewAuth("login");
  var p = auth.profile || {};
  var st = myStats(DATA.course);
  var h='<div class="top"><button class="iconbtn" data-act="home">←</button><div class="ttl">我的档案</div><button class="iconbtn" data-act="menu" title="菜单">☰</button></div>';
  h+='<div style="padding:18px">'
    +'<div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">'

  ["🦉","🩺","🐧","🐱","🦊","🐼","🐨","🦁","🐸","🐙","🚀","🩵","🧠","📚","⚡","🍀"].forEach(function(e){
    h+='<button data-avatar="'+e+'" class="'+(p.avatar===e?"on":"")+'">'+e+'</button>';
  });
  h+='</div>'
    +'<div style="display:flex;gap:8px;margin-top:10px;align-items:center">'

    +'<span style="font-size:11px;color:#9A9A9A">jpg/png，自动裁成方形</span></div>'
    +'<input id="avaFile" type="file" accept="image/*" style="display:none">'
    +'<div class="line">隐私</div>'
    +'<label class="sw"><input type="checkbox" id="pubRank" '+(p.public_rank===false?"":"checked")+'> 在排行榜显示我的战绩</label>'

var rankTab = "done";
function viewRank(){
  var h='<div class="top"><button class="iconbtn" data-act="home">←</button><div class="ttl">排行榜</div><button class="iconbtn" data-act="menu" title="菜单">☰</button></div>';
  h+='<div class="tabs">'
    +'<button class="'+(rankTab==="done"?"on":"")+'" data-rank="done">学习进度</button>'
    +'<button class="'+(rankTab==="answers"?"on":"")+'" data-rank="answers">练习次数</button>'
    +'<button class="'+(rankTab==="acc"?"on":"")+'" data-rank="acc">正确率</button>'
    +'</div><div id="rankList" class="list"><div class="empty">加载中…</div></div>';
  return h;
}
async function loadRank(){
  var box = document.getElementById("rankList");
  if(!box) return;
  var order = rankTab==="done" ? "done" : (rankTab==="answers" ? "answers" : "acc");
  try{
    var r = await sbFetch("/rest/v1/leaderboard?course=eq." + encodeURIComponent(DATA.course)
      + "&public_rank=eq.true&select=nickname,avatar,done,total,right_cnt,answers,acc&order=" + order + ".desc,answers.desc&limit=50");
    var rows = await r.json();
    if(!Array.isArray(rows) || !rows.length){ box.innerHTML='<div class="empty"><span class="big">🏆</span>还没有人上榜<br>你注册后刷几题就能进榜</div>'; return; }
    var h='';
    rows.forEach(function(row,i){
      var val = rankTab==="done" ? (row.done + "/" + row.total)
              : rankTab==="answers" ? (row.answers + " 次")
              : (row.acc + "%");
      var medal = i===0?"🥇":i===1?"🥈":i===2?"🥉":(i+1);
      h+='<div class="item rankrow"><span class="rk">'+medal+'</span><span class="rkava">'+avaHtml(row.avatar)+'</span>'
        +'<b>'+esc(row.nickname||"同学")+'</b><span class="rkval">'+val+'</span></div>';
    });
    box.innerHTML = h;
  }catch(e){ box.innerHTML='<div class="empty">加载失败，检查网络</div>'; }
}

/* ---------- render ---------- */
function render(){
  var app=$("#app");
  if(S.view==="home") app.innerHTML=viewHome();
  else if(S.view==="study") app.innerHTML=viewStudy();
  else if(S.view==="summary") app.innerHTML=viewSummary();
  else if(S.view==="kp") app.innerHTML=viewKP();
  else if(S.view==="kd") app.innerHTML=viewKD();
  else if(S.view==="wrong") app.innerHTML=viewWrong();
  else if(S.view==="fav") app.innerHTML=viewFav();
  else if(S.view==="auth") app.innerHTML=viewAuth(S.authMode||"login");
  else if(S.view==="me") app.innerHTML=viewMe();
  else if(S.view==="rank"){ app.innerHTML=viewRank(); loadRank(); }
  window.scrollTo(0,0);
  bind();
  if(S.view==="study" && HAS_LS){ store.resume={deck:S.deck,idx:S.idx,ans:S.ans,title:S.title}; save(); }
}

function bind(){
  var app=$("#app");
  app.querySelectorAll("[data-ch]").forEach(function(el){
    el.onclick=function(){ var c=CM[el.dataset.ch]; startDeck(c.qids,c.name); };
  });
  app.querySelectorAll("[data-kp]").forEach(function(el){
    el.onclick=function(e){ e.stopPropagation(); openKP(el.dataset.kp); };
  });
  app.querySelectorAll("[data-kdopen]").forEach(function(el){
    el.onclick=function(){ S.view="kd"; render(); };
  });
  app.querySelectorAll("[data-kd]").forEach(function(el){
    el.onclick=function(){ var k=(DATA.kaodian||[]).filter(function(x){return x.id===el.dataset.kd;})[0];
      if(k&&k.qids.length) startDeck(k.qids.slice(),k.name); };
  });
  app.querySelectorAll("[data-kdall]").forEach(function(el){
    el.onclick=function(){ var k=(DATA.kaodian||[]).filter(function(x){return x.id===el.dataset.kdall;})[0];
      if(k&&k.allQids) startDeck(k.allQids.slice(),k.name+"（含免考）"); };
  });
  var sb = document.getElementById("sfxBox");
  if (sb) sb.onchange = function(){ SFX_ON = sb.checked; localStorage.setItem("quiz_sound", SFX_ON ? "1" : "0"); if(SFX_ON) sfx("tap"); };
  var af = document.getElementById("avaFile");
  if (af) af.onchange = function(){ pickAvatar(af.files && af.files[0]); };
  app.querySelectorAll("[data-avatar]").forEach(function(el){
    el.onclick=function(){ app.querySelectorAll(".avapick button").forEach(function(b){ b.classList.remove("on"); }); el.classList.add("on"); };
  });
  app.querySelectorAll("[data-rank]").forEach(function(el){
    el.onclick=function(){ rankTab=el.dataset.rank; S.view="rank"; render(); };
  });
  app.querySelectorAll("[data-jump]").forEach(function(el){
    el.onclick=function(){ startDeck([el.dataset.jump],"单题重做"); };
  });
  app.querySelectorAll("[data-opt]").forEach(function(el){
    el.onclick=function(){
      var q=QM[S.deck[S.idx]]; if(S.ans[q.id]) return;
      sfx("tap");
      if(q.kind==="multi"){ var k=el.dataset.opt,i=S.pick.indexOf(k); if(i>=0) S.pick.splice(i,1); else S.pick.push(k); render(); return; }
      var picked=(q.kind==="judge")?el.dataset.txt:el.dataset.opt;
      commit(q,judge(q,picked),picked,false);
    };
  });
  app.querySelectorAll("[data-act]").forEach(function(el){
    el.onclick=async function(){
      var act=el.dataset.act;
      if(act==="home"){ S.view="home"; render(); }
      else if(act==="settings"){ openSettings(); }
      else if(act==="login"){ S.authMode="login"; S.view="auth"; render(); }
      else if(act==="signup"){ S.authMode="signup"; S.view="auth"; render(); }
      else if(act==="me"){ S.view="me"; render(); }
      else if(act==="rank"){ S.view="rank"; render(); }
      else if(act==="logout"){ if(confirm("退出登录？本机进度会保留。")){ sbSignOut(); S.view="home"; render(); } }
      else if(act==="doLogin" || act==="doSignup"){
        var em=$("#authEmail").value.trim(), pw=$("#authPass").value;
        var msg=$("#authMsg");
        if(!em || pw.length<6){ msg.textContent="邮箱和至少 6 位密码"; return; }
        msg.textContent="处理中…"; msg.style.color="#9A9A9A";
        try{
          if(act==="doSignup"){
            var done = await sbSignUp(em,pw);
            if(!done) throw new Error("注册成功，但需要邮箱确认——请到邮箱点确认链接后再登录");
          } else { await sbSignIn(em,pw); }
          await doSync(); S.view="home"; render(); toast("已登录");
        }catch(e){ msg.textContent=e.message; msg.style.color="#D33131"; }
      }
      else if(act==="menu"){ sfx("tap"); openMenu(); }
      else if(act==="pickAvatar"){
        var f = $("#avaFile");
        if (f) f.click();
      }
      else if(act==="saveProfile"){
        var nick=$("#nickInput").value.trim().slice(0,12) || "同学";
        var pub=$("#pubRank").checked;
        var av=(auth.profile&&auth.profile.avatar)||"🦉";
        var sel=document.querySelector(".avapick .on"); if(sel) av=sel.dataset.avatar;
        auth.profile = Object.assign({}, auth.profile, {nickname:nick, avatar:av, public_rank:pub});
        saveAuth();
        try{
          await sbFetch("/rest/v1/profiles?on_conflict=id",{
            method:"POST", headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},
            body: JSON.stringify([{id:auth.user.id, nickname:nick, avatar:av, public_rank:pub}])
          });
          toast("已保存");
        }catch(e){ toast("保存失败，稍后再试"); }
        render();
      }
      else if(act==="toggleSfx"){
        SFX_ON = !SFX_ON; localStorage.setItem("quiz_sound", SFX_ON ? "1" : "0"); sfx("tap"); render();
      }
      else if(act==="import"){
        var box=$("#impBox"), v=(box&&box.value||"").trim();
        if(v.indexOf("ZHS1-")!==0){ toast("进度码格式不对"); return; }
        try{
          var obj=JSON.parse(decodeURIComponent(escape(atob(v.slice(5)))));
          if(!obj||!obj.rec) throw 0;
          store.rec=obj.rec||{}; store.fav=obj.fav||[]; store.daily=obj.daily||obj.streak||{};
          save(); closeSheet(); render(); toast("已导入");
        }catch(e){ toast("导入失败，检查进度码是否完整"); }
      }
      else if(act==="reset"){
        if(!confirm("确定清空全部进度？收藏和错题也会删除。")) return;
        store={rec:{},fav:[],resume:null,daily:{}}; save(); closeSheet(); render(); toast("已清空");
      }
      else if(act==="close"){ closeSheet(); }
      else if(act==="continue"){
        if(store.resume&&store.resume.deck&&store.resume.deck.length){
          S.deck=store.resume.deck.slice(); S.idx=Math.min(store.resume.idx||0,S.deck.length-1);
          S.ans=store.resume.ans||{}; S.title=store.resume.title||""; S.stat={r:0,w:0}; S.t0=Date.now();
          S.view="study"; render();
        } else { var c=CH[0]; startDeck(c.qids,c.name); }
      }
      else if(act==="random"){ var ids=Q.map(function(q){return q.id;}).sort(function(){return Math.random()-.5;}).slice(0,20);
        startDeck(ids,"随机 20 题"); }
      else if(act==="wrong"){ S.view="wrong"; render(); }
      else if(act==="fav"){ if(S.view==="study"){ toggleFav(); } else { S.view="fav"; render(); } }
      else if(act==="fav-start"){ startDeck(store.fav.slice(),"收藏题"); }
      else if(act==="wrong-start"){ var bad=Q.filter(function(q){var r=store.rec[q.id]; return r&&r.last==="wrong";}).map(function(q){return q.id;});
        startDeck(bad,"错题复习"); }
      else if(act==="kp"){ S.view="kp"; render(); }
      else if(act==="kd"){ S.view="kd"; render(); }
      else if(act==="kp-quick"){ openKP(QM[S.deck[S.idx]].kp); }
      else if(act==="kp-practice"){ var k=KM[el.dataset.kp]; closeSheet(); startDeck(k.qids,k.name); }
      else if(act==="confirm"){ var q3=QM[S.deck[S.idx]]; if(!S.pick.length) return;
        commit(q3,judge(q3,S.pick),S.pick.slice(),false); S.pick=[]; }
      else if(act==="reveal"){ var q4=QM[S.deck[S.idx]]; if(S.ans[q4.id]) return; commit(q4,false,null,true); }
      else if(act==="prev"){ if(S.idx>0){ S.idx--; S.pick=[]; render(); } }
      else if(act==="next"){ sfx("tap"); if(S.idx<S.deck.length-1){ S.idx++; S.pick=[]; render(); } else { S.view="summary"; render(); } }
      else if(act==="again"){ var w=S.deck.filter(function(id){var a=S.ans[id]; return a&&!a.ok;});
        startDeck(w.length?w:S.deck.slice(), w.length?"错题重做":S.title); }
    };
  });
}
var SFX_ON = (localStorage.getItem("quiz_sound") !== "0");
var _AC = null;
function _ac(){
  if(!_AC){ try{ _AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if(_AC && _AC.state === "suspended"){ try{ _AC.resume(); }catch(e){} }
  return _AC;
}
(function(){
  function unlock(){ var c = _ac(); if(c && c.state === "suspended"){ try{ c.resume(); }catch(e){} } }
  ["pointerdown","touchstart","keydown"].forEach(function(t){
    document.addEventListener(t, unlock, {passive:true, once:true});
  });
  document.addEventListener("click", unlock, {passive:true, once:true});
})();
function _beep(freq, dur, type, vol, delay){
  if(!SFX_ON) return;
  var c = _ac(); if(!c) return;
  var t0 = c.currentTime + (delay || 0);
  var o = c.createOscillator(), g = c.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.07, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur);
}
function sfx(kind){
  if(!SFX_ON) return;
  if(kind === "tap"){ _beep(760, .06, "triangle", .045); }
  else if(kind === "ok"){ _beep(660, .1, "sine", .07); _beep(880, .16, "sine", .07, .09); }
  else if(kind === "bad"){ _beep(220, .16, "sawtooth", .05); _beep(165, .22, "sawtooth", .045, .1); }
  else if(kind === "win"){ _beep(523, .12, "sine", .07); _beep(659, .12, "sine", .07, .12); _beep(784, .2, "sine", .08, .24); }
}
function avaHtml(v, cls){
  v = v || "🦉";
  if (String(v).indexOf("data:image") === 0) {
    return '<span class="' + (cls||"") + ' avaimg-wrap"><img class="avaimg" src="' + v + '" alt="头像"></span>';
  }
  return esc(v);
}
function pickAvatar(file){
  if (!file) return;
  var fr = new FileReader();
  fr.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var c = document.createElement("canvas");
      c.width = 160; c.height = 160;
      var ctx = c.getContext("2d");
      var side = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, 0, 0, 160, 160);
      var uri = c.toDataURL("image/webp", 0.85);
      auth.profile = Object.assign({}, auth.profile, {avatar: uri});
      saveAuth(); render(); toast("头像已更新，记得点保存");
    };
    img.src = e.target.result;
  };
  fr.readAsDataURL(file);
}
function toggleFav(){
  var q=QM[S.deck[S.idx]], i=store.fav.indexOf(q.id);
  if(i>=0){ store.fav.splice(i,1); toast("已取消收藏"); } else { store.fav.push(q.id); toast("已收藏，首页⭐里查看"); }
  save(); render();
}

document.addEventListener("click",function(e){ if(e.target.id==="sheetWrap") closeSheet(); });
document.addEventListener("keydown",function(e){
  if(S.view!=="study") return;
  var q=QM[S.deck[S.idx]];
  if(e.key==="ArrowRight"||e.key==="Enter"||e.key===" "){
    e.preventDefault();
    if(S.idx<S.deck.length-1){ S.idx++; S.pick=[]; render(); } else { S.view="summary"; render(); }
  } else if(e.key==="ArrowLeft"){ if(S.idx>0){ S.idx--; S.pick=[]; render(); } }
  else if(/^[a-eA-E1-5]$/.test(e.key) && !S.ans[q.id]){
    var idx="abcde".indexOf(e.key.toLowerCase()); if(idx<0) idx="12345".indexOf(e.key);
    var o=q.options[idx]; if(!o) return;
    if(q.kind==="multi"){ var i=S.pick.indexOf(o.k); if(i>=0) S.pick.splice(i,1); else S.pick.push(o.k); render(); }
    else { var picked=(q.kind==="judge")?o.t:o.k; commit(q,judge(q,picked),picked,false); }
  }
});
(function(){
  var x0=null,y0=null;
  document.addEventListener("touchstart",function(e){ if(S.view!=="study") return; x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  document.addEventListener("touchend",function(e){
    if(S.view!=="study"||x0===null) return;
    var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6){
      if(dx<0){ if(S.idx<S.deck.length-1){ S.idx++; S.pick=[]; render(); } }
      else { if(S.idx>0){ S.idx--; S.pick=[]; render(); } }
    }
  },{passive:true});
})();
render();
window.__quiz={start:startDeck,state:S,go:function(v){S.view=v;render();},kp:openKP};
})();
</script>
