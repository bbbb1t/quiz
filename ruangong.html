<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#FFFFFF"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="软工刷题"/>

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2358CC02'/%3E%3Ctext x='32' y='44' font-size='26' font-weight='bold' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E✓%3C/text%3E%3C/svg%3E"/>
<title>医学软件工程 · 刷题</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --green:#58CC02; --green-d:#46A302; --green-l:#D7FFB8;
  --blue:#1CB0F6; --blue-d:#1899D6; --purple:#CE82FF; --purple-d:#A568CC;
  --orange:#FF9600; --orange-d:#E08600; --red:#FF4B4B; --red-d:#D33131;
  --gold:#FFC800; --teal:#00CD9C;
  --ink:#3C3C3C; --ink2:#4B4B4B; --muted:#AFAFAF; --line:#E5E5E5; --bg:#FFFFFF; --soft:#F7F7F7;
}
html,body{margin:0;padding:0;height:100%}
body{
  background:#F2F4F7; color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.app{max-width:560px;margin:0 auto;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;
  position:relative;overflow:hidden;box-shadow:0 0 60px rgba(20,30,60,.06)}
@media (max-width:600px){.app{box-shadow:none}}

/* ---------- Duolingo-ish buttons ---------- */
.btn{border:0;border-radius:16px;padding:14px 18px;font-size:15px;font-weight:800;font-family:inherit;
  letter-spacing:.02em;cursor:pointer;transition:transform .06s, box-shadow .06s;display:inline-flex;
  align-items:center;justify-content:center;gap:6px;text-transform:none}
.btn.primary{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-d)}
.btn.blue:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-d)}
.btn.ghost{background:#fff;color:var(--ink2);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.wide{width:100%}
.btn.small{padding:10px 14px;font-size:13px;border-radius:13px}
.btn:disabled{opacity:.45;pointer-events:none}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:4px 9px;
  border-radius:8px;background:var(--soft);color:#777;border:1.5px solid var(--line)}
.chip.key{background:#FFF6DB;color:#B07800;border-color:#FFE8A3}
.chip.mian{background:#F3F4F7;color:#9AA0AD}
.chip.zhong{background:#FFF6DB;color:#B07800;border-color:#FFE8A3}
.chip.nan{background:#FFEDED;color:#D33131;border-color:#FFD3D3}
.chip.type{background:#EAF7FF;color:#1899D6;border-color:#CDEEFF}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 16px;
  background:#fff;border-bottom:2px solid var(--line)}
.top .ttl{font-size:15px;font-weight:900;flex:1;text-align:center;letter-spacing:.01em}
.iconbtn{width:38px;height:38px;border-radius:13px;border:2px solid var(--line);background:#fff;color:#7B7B7B;
  display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;font-weight:800;
  box-shadow:0 3px 0 var(--line)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}

/* ---------- home header ---------- */
.hhead{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.hhead .logo{font-size:17px;font-weight:900;letter-spacing:-.01em;color:var(--green-d);display:flex;
  align-items:center;gap:8px}
.hhead .logo svg{width:26px;height:26px}
.hhead .spacer{flex:1}
.pill{display:flex;align-items:center;gap:5px;background:#FFF6DB;border:2px solid #FFE8A3;color:#B07800;
  font-weight:900;font-size:13px;padding:5px 10px;border-radius:12px}
.pill.blue{background:#EAF7FF;border-color:#CDEEFF;color:#1899D6}

/* ---------- daily card ---------- */
.daily{margin:12px 16px 0;border:2px solid var(--line);border-radius:20px;padding:16px;
  background:linear-gradient(180deg,#FFFFFF,#FAFFFA);display:flex;align-items:center;gap:14px}
.daily .ring{flex:none;position:relative}
.daily .ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-size:17px;font-weight:900;color:var(--green-d);line-height:1.1}
.daily .ring b small{font-size:9px;font-weight:800;color:var(--muted);letter-spacing:.08em}
.daily .info{flex:1;min-width:0}
.daily .kicker{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.1em}
.daily .h1{font-size:19px;font-weight:900;letter-spacing:-.02em;margin:2px 0 4px}
.daily .sub{font-size:12px;color:#8C8C8C}

/* ---------- quick grid ---------- */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 16px 0}
.quick button{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 4px 10px;
  font-family:inherit;font-size:11px;font-weight:800;color:var(--ink2);cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:6px;box-shadow:0 3px 0 var(--line)}
.quick button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.quick em{font-style:normal;width:32px;height:32px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;font-size:17px;background:#F0FFF0}

/* ---------- learning path ---------- */
.pathwrap{margin:18px 16px 34px;position:relative}
.path-title{font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.12em;margin:0 4px 14px}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px}
.path:before{content:"";position:absolute;left:50%;top:10px;bottom:10px;width:0;border-left:3px dashed #E8E8E8}
.step{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.step:nth-child(odd){align-items:flex-end;padding-right:22%}
.step:nth-child(even){align-items:flex-start;padding-left:22%}
.node{width:76px;height:76px;border-radius:50%;border:0;cursor:pointer;position:relative;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:15px;
  box-shadow:0 6px 0 rgba(0,0,0,.16);transition:transform .08s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.16)}
.node .pct{font-size:15px;letter-spacing:-.02em}
.node .ico{font-size:26px}
.node.done{background:var(--gold)!important;color:#7A5B00;box-shadow:0 6px 0 #D9A800}
.step .label{font-size:12.5px;font-weight:800;color:var(--ink2);text-align:center;max-width:150px}
.step .label small{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-top:2px}
.step .start{background:var(--green);color:#fff;font-size:11px;font-weight:900;padding:5px 11px;border-radius:11px;
  box-shadow:0 3px 0 var(--green-d);margin-top:-2px}

/* ---------- study ---------- */
.bar{height:14px;background:#E9EDF2;border-radius:99px;margin:14px 16px 0;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .35s;
  box-shadow:inset 0 4px 0 rgba(255,255,255,.28)}
.card{background:#fff;border:2px solid var(--line);border-radius:20px;margin:14px 16px 0;padding:18px}
.ctop{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.ctop .fav{margin-left:auto;border:0;background:transparent;font-size:20px;color:#D8D8D8;cursor:pointer;padding:0 2px}
.ctop .fav.on{color:var(--gold)}
.stem{font-size:16.5px;line-height:1.7;font-weight:800;letter-spacing:-.01em;color:#2B2B2B}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:2px solid var(--line);
  border-radius:14px;padding:12px 13px;font-family:inherit;font-size:14.5px;line-height:1.55;color:#3C3C3C;
  cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .06s, box-shadow .06s;font-weight:600}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt .k{flex:none;width:26px;height:26px;border-radius:9px;background:#F2F4F7;color:#7B7B7B;font-size:12.5px;
  font-weight:900;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--blue);box-shadow:0 3px 0 var(--blue-d);background:#F3FBFF}
.opt.sel .k{background:var(--blue);color:#fff}
.opt.ok{border-color:var(--green);box-shadow:0 3px 0 var(--green-d);background:#F1FFE6}
.opt.ok .k{background:var(--green);color:#fff}
.opt.bad{border-color:var(--red);box-shadow:0 3px 0 var(--red-d);background:#FFF2F2;animation:shake .3s}
.opt.bad .k{background:var(--red);color:#fff}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.fb{margin-top:14px;border-radius:16px;padding:14px;border:2px solid var(--line);background:#FAFAFA}
.fb.ok{background:#F1FFE6;border-color:#C9F0A6}
.fb.bad{background:#FFF2F2;border-color:#FFC9C9}
.fb .head{font-size:15px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fb.ok .head{color:var(--green-d)} .fb.bad .head{color:var(--red-d)}
.fb .head .ans{margin-left:auto;font-size:11.5px;font-weight:800;color:#5B6470;background:#fff;
  border:1.5px solid var(--line);border-radius:9px;padding:3px 8px}
.fb .kp{margin-top:9px;font-size:12.5px;color:#5B6470;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fb .kplink{border:1.5px solid #CDEEFF;background:#EAF7FF;color:#1899D6;font-weight:900;font-family:inherit;
  font-size:12px;padding:4px 10px;border-radius:9px;cursor:pointer}
.fb .exp{margin-top:9px;font-size:13px;line-height:1.75;color:#4B4B4B;white-space:pre-wrap}
.ref{margin-top:10px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;
  font-size:13px;line-height:1.75;color:#3C3C3C}
.ref b{display:block;font-size:11.5px;color:var(--blue-d);margin-bottom:4px;font-weight:900}
.why{margin-top:10px;background:#fff;border:1.5px solid #FFD3D3;border-radius:12px;padding:11px 12px}
.why b{font-size:12px;color:var(--red-d);display:block;margin-bottom:5px;font-weight:900}
.why .line2{font-size:12.5px;color:#4B4B4B;line-height:1.75}
.why .line2 em{font-style:normal;color:var(--red-d);font-weight:900}
.why .line2 i{font-style:normal;color:var(--green-d);font-weight:900}

.ctrl{display:flex;gap:9px;margin:16px 16px 26px}
.ctrl .btn{flex:1}
.ctrl .btn.primary{flex:1.5}
.meta{text-align:center;font-size:11px;color:#B5B5B5;margin:8px 16px 0}

/* ---------- summary ---------- */
.sum{padding:30px 20px;text-align:center}
.sum h2{font-size:24px;margin:16px 0 4px;letter-spacing:-.02em;font-weight:900}
.sum p{color:var(--muted);font-size:13px;margin:0}
.sumstats{display:flex;justify-content:center;gap:22px;margin:22px 0 26px;flex-wrap:wrap}
.sumstats div{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.06em}
.sumstats b{display:block;font-size:24px;color:var(--ink);font-weight:900;letter-spacing:-.02em;margin-bottom:2px}

/* ---------- lists ---------- */
.sec{margin:20px 16px 6px;display:flex;align-items:center;justify-content:space-between}
.sec .t{font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.12em}
.sec .l{border:0;background:transparent;color:var(--blue-d);font-size:12px;font-weight:900;font-family:inherit;cursor:pointer}
.list{margin:0 16px 28px;display:flex;flex-direction:column;gap:9px}
.item{background:#fff;border:2px solid var(--line);border-radius:16px;padding:13px 14px;cursor:pointer;
  box-shadow:0 3px 0 var(--line)}
.item:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.item .m{font-size:10.5px;color:var(--muted);display:flex;gap:8px;font-weight:800;letter-spacing:.04em}
.item p{margin:6px 0 0;font-size:13.5px;color:#3C3C3C;line-height:1.55;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600}
.item .ans{font-size:11.5px;color:var(--green-d);margin-top:7px;font-weight:800;line-height:1.5}
.item .ans span{color:#8C8C8C;font-weight:600}

/* kp */
details.grp{background:#fff;border:2px solid var(--line);border-radius:16px;box-shadow:0 3px 0 var(--line);
  overflow:hidden}
details.grp>summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;align-items:center;gap:9px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .t{font-size:13.5px;font-weight:900;flex:1;min-width:0;padding-right:6px;line-height:1.4}
details.grp>summary .n{font-size:10.5px;color:var(--muted);font-weight:800;flex:none;white-space:nowrap}
details.grp>summary .ar{color:#C9C9C9;transition:.2s;font-size:12px;font-weight:900}
details.grp[open]>summary .ar{transform:rotate(90deg)}
.kprow{display:flex;align-items:center;gap:9px;padding:11px 15px;border-top:2px solid #F2F2F2;cursor:pointer}
.kprow:active{background:#FAFAFA}
.kprow .t{font-size:13px;color:#3C3C3C;flex:1;font-weight:700}
.kprow .mini{width:52px;height:8px;border-radius:99px;background:#EDEDED;overflow:hidden;flex:none}
.kprow .mini i{display:block;height:100%;background:var(--green);border-radius:99px}
.kprow .s{font-size:10.5px;color:var(--muted);font-weight:800;flex:none;width:30px;text-align:right}

/* kd cards */
.kdcard{background:#fff;border:2px solid var(--line);border-radius:18px;padding:15px 16px;box-shadow:0 3px 0 var(--line)}
.kdcard .top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.kdcard .nm{font-size:15px;font-weight:900;letter-spacing:-.01em}
.kdcard .sl{font-size:10.5px;color:var(--muted);margin-left:auto;font-weight:800}
.kdcard ul{margin:6px 0 10px;padding-left:16px}
.kdcard li{font-size:12.5px;line-height:1.7;color:#4B4B4B;margin-bottom:4px;font-weight:600}
.kdcard .foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kdcard .cnt{font-size:11px;color:var(--muted);font-weight:800}
.kdcard .go{margin-left:auto}
.kdnote{margin:0 16px 12px;font-size:11.5px;color:#9A9A9A;line-height:1.7}
.kdrow{display:flex;align-items:center;gap:10px;padding:13px 14px}
.kdrow b{font-size:14.5px;font-weight:900;letter-spacing:-.01em}
.kdrow-n{margin-left:auto;font-size:11.5px;color:#9A9A9A;font-weight:800}
.kdrow-a{color:#CFCFCF;font-weight:900;font-size:15px}

.empty{text-align:center;color:var(--muted);font-size:13px;padding:56px 24px;line-height:1.9}
.empty .big{font-size:40px;display:block;margin-bottom:10px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;background:rgba(20,20,30,.42);display:flex;align-items:flex-end;
  justify-content:center;z-index:60}
.sheet-wrap[hidden]{display:none}
.sheet{width:100%;max-width:560px;background:#fff;border-radius:22px 22px 0 0;padding:20px 18px 26px;
  animation:up .24s ease;max-height:86vh;overflow:auto;border-top:3px solid var(--line)}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.sheet h3{margin:0 0 3px;font-size:18px;font-weight:900}
.sheet .sub{font-size:12px;color:var(--muted);margin-bottom:12px}
.sheet .line{font-size:11.5px;color:#8C8C8C;font-weight:900;letter-spacing:.08em;margin:16px 0 7px}
.sheet textarea{width:100%;min-height:96px;border:2px solid var(--line);border-radius:12px;padding:10px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#555;resize:vertical}

.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(12px);background:#3C3C3C;color:#fff;
  font-size:12.5px;font-weight:800;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;
  transition:.2s;z-index:80;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet" id="sheet"></div></div>

,{"k":"C","t":"医院设备的物理维护"},{"k":"D","t":"健康数据的云存储与分析"},{"k":"E","t":"医疗保险的政策制定"}],"answer":"ABD","explain":"医疗信息化的核心是通过信息技术手段优化医疗服务流程、提高效率与质量，主要涉及电子病历、远程诊疗和健康数据的管理，而医院设备的物理维护和医疗保险政策制定不属于其范畴。","own":0,"ref":"","score":null,"mine":"","paper":388143884,"key":0},{"id":"q4","ch":"m1","chName":"绪论","kp":"1889562363682754560","kpName":"医学软件工程内容、主题与目标","mian":0,"zhong":0,"nan":0,"no":1,"type":"单选题","kind":"single","stem":"为什么医学软件工程需要特别关注数据安全性？","options":[{"k":"A","t":"医学领域数据量小"},{"k":"B","t":"医学数据通常涉及患者隐私和敏感信息"},{"k":"C","t":"医学数据可公开使用"},{"k":"D","t":"数据安全性对软件开发无关紧要"}],"answer":"B","explain":"本题考察学生对医学软件工程中数据安全性重要性的理解。医学数据涉及患者隐私和敏感信息，因此需要特别关注数据安全性。","own":0,"ref":"","score":null,"mine":"","paper":388145364,"key":0},{"id":"q5","ch":"m1","chName":"绪论","kp":"1889562363682754560","kpName":"医学软件工程内容、主题与目标","mian":0,"zhong":0,"nan":0,"no":2,"type":"多选题","kind":"multi","stem":"软件工程的主要目标包括以下哪些？","options":[{"k":"A","t":"提升软件的可维护性和可靠性"},{"k":"B","t":"降低软件开发成本"},{"k":"C","t":"确保快速迭代开发"},{"k":"D","t":"提供高效的用户体验"},{"k":"E","t":"加强软件的安全性和隐私保护"}],"answer":"ABE","explain":"软件工程的主要目标包括高效开发软件、保证质量和可靠性、控制成本等，而快速迭代开发和用户体验尽管重要，但非其核心目标。","own":0,"ref":"","score":null,"mine":"","paper":388145364,"key":0},{"id":"q6","ch":"m1","chName":"绪论","kp":"1889562363682754560","kpName":"医学软件工程内容、主题与目标","mian":0,"zhong":0,"nan":0,"no":3,"type":"单选题","kind":"single","stem":"医学软件工程的主要目标是什么？","options":[{"k":"A","t":"解决医学领域所有问题"},{"k":"B","t":"开发、评估和维护用于医学领域的软件系统"},{"k":"C","t":"取代医生的工作"},{"k":"D","t":"提高计算机硬件性能"}],"answer":"B","explain":"本题考察学生对医学软件工程目标的理解，医学软件工程的核心目标是开发、评估和维护专门用于医学领域的软件系统，而非解决所有问题或取代医生。","own":0,"ref":"","score":null,"mine":"","paper":388145364,"key":0},{"id":"q7","ch":"m1","chName":"绪论","kp":"1889562363682754560","kpName":"医学软件工程内容、主题与目标","mian":0,"zhong":0,"nan":0,"no":4,"type":"单选题","kind":"single","stem":"医学软件工程的主题不包括以下哪一项？","options":[{"k":"A","t":"软件开发生命周期管理"},{"k":"B","t":"医学影像处理技术"},{"k":"C","t":"药物化学分子结构分析"},{"k":"D","t":"医学数据的存储和安全性"}],"answer":"C","explain":"本题考核学生对医学软件工程主题范围的掌握。药物化学分子结构分析属于化学或药学领域，不是医学软件工程的主题内容。","own":0,"ref":"","score":null,"mine":"","paper":388145364,"key":0},{"id":"q8","ch":"m1","chName":"绪论","kp":"1889562363682754560","kpName":"医学软件工程内容、主题与目标","mian":0,"zhong":0,"nan":0,"no":5,"type":"单选题","kind":"single","stem":"以下哪一项最能体现医学软件工程的目标？","options":[{"k":"A","t":"开发医疗诊断支持系统"},{"k":"B","t":"设计新的外科手术器械"},{"k":"C","t":"研究人类基因组"},{"k":"D","t":"优化医院建筑布局"}],"answer":"A","explain":"本题旨在测试学生对医学软件工程目标的具体体现的理解。开发医疗诊断支持系统正是医学软件工程的一个重要目标。","own":0,"ref":"","score":null,"mine":"","paper":388145364,"key":0},{"id":"q9","ch":"m1","chName":"绪论","kp":"1889562363682754560","kpName":"医学软件工程内容、主题与目标","mian":0,"zhong":0,"nan":0,"no":6,"type":"单选题","kind":"single","stem":"医学软件工程在开发过程中需要遵循什么样的规范？","options":[{"k":"A","t":"一般软件开发规范即可，无需特殊要求"},{"k":"B","t":"既需要遵循软件工程规范，也需要符合医学领域的法律和伦理要求"},{"k":"C","t":"完全依赖医学领域的规范，软件工程规范可以忽略"},{"k":"D","t":"只需要满足用户需求，不需要遵守任何规范"}],"answer":"B","explain":"本题考查学生对医学软件工程开发中规范要求的掌握。医学软件工程需要在遵循软件工程规范的同时，符合医学领域的法律和伦理要求。","own":0,"ref":"","score":null,"mine":"","paper":388145364,"key":0},{"id":"q10","ch":"m2","chName":"软件工程概述","kp":"1889562364177682432","kpName":"医院信息系统定义","mian":0,"zhong":0,"nan":0,"no":1,"type":"单选题","kind":"single","stem":"以下哪项最能准确描述医院信息系统（HIS）的核心目标？","options":[{"k":"A","t":"实现医院的全面自动化"},{"k":"B","t":"优化医院资源配置并提升医疗服务质量"},{"k":"C","t":"减少医院的运营成本"},{"k":"D","t":"实现患者数据的完全公开化"}],"answer":"B","explain":"医院信息系统的核心目标是通过信息技术提升医院的整体运营效率和医疗服务质量，例如优化资源配置、改善患者体验等，而不是单纯追求成本降低或自动化。","own":0,"ref":"","score":null,"mine":"","paper":460722763,"key":0},{"id":"q11","ch":"m2","chName":"软件工程概述","kp":"1889562364177682432","kpName":"医院信息系统定义","mian":0,"zhong":0,"nan":0,"no":2,"type":"单选题","kind":"single","stem":"医院信息系统（HIS）的定义中强调了其主要作用是？","options":[{"k":"A","t":"记录患者的就诊信息"},{"k":"B","t":"整合医院各类信息资源，提高医疗管理和服务效率"},{"k":"C","t":"管理医院的财务和人力资源"},{"k":"D","t":"提供医生的工作日志"}],"answer":"B","explain":"医院信息系统（HIS）的核心在于整合资源，提高管理效率，不仅仅是记录或管理某一类信息。","own":0,"ref":"","score":null,"mine":"","paper":460722763,"key":0},{"id":"q12","ch":"m2","chName":"软件工程概述","kp":"1889562364177682432","kpName":"医院信息系统定义","mian":0,"zhong":0,"nan":0,"no":3,"type":"单选题","kind":"single","stem":"医院信息系统（HIS）的发展对医疗行业的主要影响是以下哪一项？","options":[{"k":"A","t":"增加了医务人员的工作量"},{"k":"B","t":"改善了数据管理和提升了运营效率"},{"k":"C","t":"完全取代了传统的医疗管理方式"},{"k":"D","t":"降低了对信息安全的要求"}],"answer":"B","explain":"医院信息系统的主要作用是通过信息化技术改善数据管理，提升运营效率，并辅助医疗决策，而不是增加工作量或完全取代传统管理方式。","own":0,"ref":"","score":null,"mine":"","paper":460722763,"key":0},{"id":"q13","ch":"m2","chName":"软件工程概述","kp":"1889562364177682432","kpName":"医院信息系统定义","mian":0,"zhong":0,"nan":0,"no":4,"type":"单选题","kind":"single","stem":"医院信息系统（HIS）与电子病历系统（EMR）的主要区别是什么？","options":[{"k":"A","t":"HIS侧重于医院整体管理，而EMR侧重于患者病历管理"},{"k":"B","t":"HIS仅供医生使用，而EMR面向所有医疗人员"},{"k":"C","t":"HIS主要用于数据存储，而EMR主要用于数据分析"},{"k":"D","t":"HIS是一种硬件系统，而EMR是一种软件系统"}],"answer":"A","explain":"医院信息系统（HIS）覆盖医院整体运营及管理，而电子病历系统（EMR）主要用于记录和管理患者的病历信息，这是二者的主要区别。","own":0,"ref":"","score":null,"mine":"","paper":460722763,"key":0},{"id":"q14","ch":"m2","chName":"软件工程概述","kp":"1889562364177682432","kpName":"医院信息系统定义","mian":0,"zhong":0,"nan":0,"no":5,"type":"单选题","kind":"single","stem":"医院信息系统（HIS）的主要功能不包括以下哪一项？","options":[{"k":"A","t":"患者信息管理"},{"k":"B","t":"临床决策支持"},{"k":"C","t":"医疗设备的硬件维修"},{"k":"D","t":"财务管理"}],"answer":"C","explain":"医院信息系统的核心在于管理和优化医疗相关的流程，例如患者信息管理、临床决策支持、以及财务管理等。医疗设备硬件维修属于工程维护领域，不是HIS的主要功能。","own":0,"ref":"","score":null,"mine":"","paper":460722763,"key":0},{"id":"q15","ch":"m2","chName":"软件工程概述","kp":"1889562364177682432","kpName":"医院信息系统定义","mian":0,"zhong":0,"nan":0,"no":6,"type":"单选题","kind":"single","stem":"医院信息系统（HIS）通常包括哪些主要模块？","options":[{"k":"A","t":"患者信息管理、临床信息系统、财务管理系统"},{"k":"B","t":"医疗设备硬件维护、实验室管理、物流管理"},{"k":"C","t":"库存管理、临床研究支持、硬件维修"},{"k":"D","t":"图像处理、财务分析、设备安装"}],"answer":"A","explain":"医院信息系统通常包括患者信息管理、临床信息系统以及财务管理系统等模块，这些模块共同协作以支持医院的日常运营和管理。","own":0,"ref":"","score":null,"mine":"","paper":460722763,"key":0},{"id":"q16","ch":"m2","chName":"软件工程概述","kp":"1889562364240596992","kpName":"医院信息系统的发展阶段及趋势","mian":0,"zhong":0,"nan":0,"no":1,"type":"单选题","kind":"single","stem":"医院信息系统（HIS）的发展历程一般被划分为以下哪几个主要阶段？","options":[{"k":"A","t":"手工化、半自动化、自动化、智能化"},{"k":"B","t":"数据录入阶段、数据处理阶段、数据分析阶段、数据共享阶段"},{"k":"C","t":"局部信息化、全面信息化、智能化"},{"k":"D","t":"原始阶段、基础阶段、发展阶段、成熟阶段"}],"answer":"C","explain":"考察学生对医院信息系统发展阶段的认识，医院信息系统经历了从局部信息化到全面信息化，再到智能化发展的过程，这是发展趋势的核心内容。","own":0,"ref":"","score":null,"mine":"","paper":460738924,"key":0},{"id":"q17","ch":"m2","chName":"软件工程概述","kp":"1889562364240596992","kpName":"医院信息系统的发展阶段及趋势","mian":0,"zhong":0,"nan":0,"no":2,"type":"单选题","kind":"single","stem":"以下哪一项是推动医院信息系统从全面信息化向智能化发展的主要技术趋势？","options":[{"k":"A","t":"大数据和人工智能技术的应用"},{"k":"B","t":"纸质档案的全面数字化"},{"k":"C","t":"计算机辅助诊断技术的开发"},{"k":"D","t":"网络安全技术的提升"}],"answer":"A","explain":"考察学生对医院信息系统发展趋势的理解，大数据和人工智能技术的应用是推动医院信息系统从全面信息化向智能化发展的核心技术驱动。","own":0,"ref":"","score":null,"mine":"","paper":460738924,"key":0},{"id":"q18","ch":"m2","chName":"软件工程概述","kp":"1889562364240596992","kpName":"医院信息系统的发展阶段及趋势","mian":0,"zhong":0,"nan":0,"no":3,"type":"多选题","kind":"multi","stem":"以下关于医院信息系统（HIS）的描述，哪些是正确的？","options":[{"k":"A","t":"医院信息系统的核心目标是提高医疗服务的效率和质量。"},{"k":"B","t":"医院信息系统通常包括门诊管理、住院管理和药品管理等模块。"},{"k":"C","t":"医院信息系统的发展阶段可以分为手工、单机、信息化和智能化阶段。"},{"k":"D","t":"医院信息系统仅用于医疗业务管理，与财务管理无关。"},{"k":"E","t":"医院信息系统的趋势是从局部信息化向全面智能化发展。"}],"answer":"ABCE","explain":"本题考查学生对医院信息系统的定义、发展阶段及组成的理解。A项正确，HIS的核心目标是提高效率和质量；B项正确，HIS包含多个功能模块；C项正确，HIS的发展经历了多个阶段；D项错误，HIS不仅用于医疗业务，还涵盖财务管理等多方面；E项正确，医院信息系统的趋势是智能化。","own":0,"ref":"","score":null,"mine":"","paper":460738924,"key":0},{"id":"q19","ch":"m2","chName":"软件工程概述","kp":"1889562364240596992","kpName":"医院信息系统的发展阶段及趋势","mian":0,"zhong":0,"nan":0,"no":4,"type":"单选题","kind":"single","stem":"医院信息系统的发展经历了哪几个主要阶段？","options":[{"k":"A","t":"手工记录阶段、部分信息化阶段、全面信息化阶段、智能化阶段"},{"k":"B","t":"纸质记录阶段、数字化阶段、自动化阶段"},{"k":"C","t":"电子阶段、网络阶段、智能阶段"},{"k":"D","t":"纸质化、数字化、网络化"}],"answer":"A","explain":"医院信息系统的发展历程包括从手工记录到全面信息化再到智能化的发展阶段，这反映了技术的逐步演进。","own":0,"ref":"","score":null,"mine":"","paper":460738924,"key":0},{"id":"q20","ch":"m2","chName":"软件工程概述","kp":"1889562364240596992","kpName":"医院信息系统的发展阶段及趋势","mian":0,"zhong":0,"nan":0,"no":5,"type":"多选题","kind":"multi","stem":"以下关于医院信息系统（HIS）发展阶段及趋势的描述，哪些是正确的？","options":[{"k":"A","t":"医院信息系统的发展经历了手工化到信息化的过程"},{"k":"B","t":"未来医院信息系统的重点是向智能化和大数据分析方向发展"},{"k":"C","t":"医院信息系统仅仅用于医院内部信息的管理"},{"k":"D","t":"以电子病历（EMR）为核心的医院信息系统是现代医院信息化的标志"},{"k":"E","t":"医院信息系统的发展趋势不包括移动医疗技术的应用"}],"answer":"ABD","explain":"本题考查学生对医院信息系统发展历程和未来趋势的理解。A是正确的，反映了医院信息系统从手工化到信息化的演变过程；B是正确的，智能化和大数据分析是未来发展的重点；D是正确的，电子病历的应用是医院信息化标志之一；C错误，医院信息系统不仅用于内部管理，还涉及患者服务等；E错误，移动医疗技术是发展趋势之一。","own":0,"ref":"","score":null,"mine":"","paper":460738924,"key":0},{"id":"q21","ch":"m2","chName":"软件工程概述","kp":"1889562364240596992","kpName":"医院信息系统的发展阶段及趋势","mian":0,"zhong":0,"nan":0,"no":6,"type":"多选题","kind":"multi","stem":"以下哪几个选项描述了现代医院信息系统（HIS）发展的趋势？","options":[{"k":"A","t":"从信息化向智能化发展"},{"k":"B","t":"引入人工智能技术优化诊疗"},{"k":"C","t":"完全依赖传统纸质病历"},{"k":"D","t":"强调数据安全和隐私保护"},{"k":"E","t":"减少对数据互联互通的需求"}],"answer":"ABD","explain":"现代HIS发展的趋势包括从信息化到智能化、应用人工智能技术及加强数据安全，而纸质病历和减少数据互联并不符合发展趋势。","own":0,"ref":"","score":null,"mine":"","paper":460738924,"key":0},{"id":"q22","ch":"m2","chName":"软件工程概述","kp":"1889562364307705856","kpName":"医院信息系统分类及组成","mian":0,"zhong":0,"nan":0,"no":1,"type":"单选题","kind":"single","stem":"医院信息系统（HIS）可以根据其功能组成进行分类，以下哪一项不属于HIS的主要功能模块？","options":[{"k":"A","t":"门诊管理系统"},{"k":"B","t":"住院管理系统"},{"k":"C","t":"医疗设备维护管理系统"},{"k":"D","t":"财务管理系统"}],"answer":"C","explain":"医院信息系统的主要功能模块包含门诊管理、住院管理、药品管理、财务管理等，但医疗设备维护管理系统通常不属于HIS的核心组成部分。","own":0,"ref":"","score":null,"mine":"","paper":460754749,"key":0},{"id":"q23","ch":"m2","chName":"软件工程概述","kp":"1889562364307705856","kpName":"医院信息系统分类及组成","mian":0,"zhong":0,"nan":0,"no":2,"type":"单选题","kind":"single","stem":"医院信息系统的组成通常涵盖了哪些核心功能模块？","options":[{"k":"A","t":"患者管理、健康档案管理、统计分析"},{"k":"B","t":"医院建筑规划、设备采购管理、患者满意度调查"},{"k":"C","t":"疾病预测系统、远程会诊平台、医生绩效评价"},{"k":"D","t":"健康教育平台、社区卫生服务管理、药品配送"}],"answer":"A","explain":"考察学生对HIS核心组成的理解，医院信息系统通常包含患者管理、健康档案管理和统计分析等核心功能模块。","own":0,"ref":"","score":null,"mine":"","paper":460754749,"key":0},{"id":"q24","ch":"m2","chName":"软件工程概述","kp":"1889562364307705856","kpName":"医院信息系统分类及组成","mian":0,"zhong":0,"nan":0,"no":3,"type":"单选题","kind":"single","stem":"以下哪一项不属于医院信息系统（HIS）的主要功能模块？","options":[{"k":"A","t":"门诊管理系统"},{"k":"B","t":"住院管理系统"},{"k":"C","t":"医疗设备采购系统"},{"k":"D","t":"药品管理系统"}],"answer":"C","explain":"医院信息系统的功能模块主要与医疗服务直接相关，医疗设备采购系统通常不作为其核心模块。","own":0,"ref":"","score":null,"mine":"","paper":460754749,"key":0},{"id":"q25","ch":"m2","chName":"软件工程概述","kp":"1889562364706164736","kpName":"软件危机","mian":0,"zhong":1,"nan":0,"no":1,"type":"单选题","kind":"single","stem":"在软件生存周期中，（ ）阶段必须要回答的问题是“要解决的问题是做什么？”。","options":[{"k":"A","t":"详细设计"},{"k":"B","t":"可行性分析和项目开发计划"},{"k":"C","t":"概要设计"},{"k":"D","t":"软件测试"}],"answer":"B","explain":"软件生命周期中「做什么」由可行性研究与项目计划阶段回答：可行性研究确定问题是否值得做、能否做，项目计划确定范围与进度。详细设计与概要设计回答的是「怎么做」，测试阶段验证做得对不对。","own":1,"ref":"","score":null,"mine":"","paper":460784392,"key":0},{"id":"q26","ch":"m2","chName":"软件工程概述","kp":"1889562364706164736","kpName":"软件危机","mian":0,"zhong":1,"nan":0,"no":2,"type":"单选题","kind":"single","stem":"开发软件所需高成本和产品的低质量之间有着尖锐的矛盾，这种现象称做( )。","options":[{"k":"A","t":"软件工程"},{"k":"B","t":"软件周期"},{"k":"C","t":"软件危机"},{"k":"D","t":"软件产生"}],"answer":"C","explain":"开发成本高、进度不可控、质量难保证，三者尖锐矛盾即「软件危机」。软件工程正是为应对软件危机而提出的工程化方法。","own":1,"ref":"","score":null,"mine":"","paper":460784392,"key":0},{"id":"q27","ch":"m2","chName":"软件工程概述","kp":"1889562364706164736","kpName":"软件危机","mian":0,"zhong":1,"nan":0,"no":3,"type":"单选题","kind":"single","stem":"软件危机的典型表现不包括以下哪项？","options":[{"k":"A","t":"项目开发周期延长"},{"k":"B","t":"软件质量难以保证"},{"k":"C","t":"硬件成本持续上升"},{"k":"D","t":"开发成本过高"}],"answer":"C","explain":"软件危机指的是软件开发中出现的质量、成本和开发周期等问题，与硬件成本无直接关系。","own":0,"ref":"","score":null,"mine":"","paper":460784392,"key":0},{"id":"q28","ch":"m2","chName":"软件工程概述","kp":"1889562364706164736","kpName":"软件危机","mian":0,"zhong":1,"nan":0,"no":4,"type":"判断题","kind":"judge","stem":"软件危机的表现之一是软件开发成本高且质量低。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"对","explain":"该题涉及软件危机的定义和表现，软件危机正是由于开发成本与质量之间的矛盾而形成的。","own":0,"ref":"","score":null,"mine":"","paper":460784392,"key":0},{"id":"q29","ch":"m2","chName":"软件工程概述","kp":"1889562364773273600","kpName":"软件工程","mian":0,"zhong":1,"nan":0,"no":1,"type":"单选题","kind":"single","stem":"以下关于软件工程的描述，哪一项是正确的？","options":[{"k":"A","t":"软件工程仅适用于小型项目开发"},{"k":"B","t":"软件工程是一门涉及过程、方法和工具的学科"},{"k":"C","t":"软件工程的重点是硬件设计"},{"k":"D","t":"软件工程强调快速开发，而忽略质量"}],"answer":"B","explain":"软件工程是一门系统化学科，涵盖了软件开发过程中的方法、工具和管理，适用于各类项目。","own":0,"ref":"","score":null,"mine":"","paper":468915097,"key":0},{"id":"q30","ch":"m2","chName":"软件工程概述","kp":"1889562364773273600","kpName":"软件工程","mian":0,"zhong":1,"nan":0,"no":2,"type":"多选题","kind":"multi","stem":"软件工程的三要素是指（ ）","options":[{"k":"A","t":"方法"},{"k":"B","t":"对象"},{"k":"C","t":"过程"},{"k":"D","t":"工具"}],"answer":"ACD","explain":"软件工程三要素是方法、工具、过程。方法是技术途径，工具支撑方法落地，过程规定活动的顺序与约束；「对象」不是三要素之一。","own":1,"ref":"","score":null,"mine":"","paper":468915097,"key":0},{"id":"q31","ch":"m2","chName":"软件工程概述","kp":"1889562364773273600","kpName":"软件工程","mian":0,"zhong":1,"nan":0,"no":3,"type":"判断题","kind":"judge","stem":"软件工程的根本在于提高软件的质量与生产率，最终实现软件的工业化生产。（ ）","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"对","explain":"软件工程的目标就是按工程化原则组织软件开发，提高质量与生产率，实现软件的工业化生产，因此该说法正确。","own":1,"ref":"","score":null,"mine":"","paper":468915097,"key":0},{"id":"q32","ch":"m2","chName":"软件工程概述","kp":"1889562364773273600","kpName":"软件工程","mian":0,"zhong":1,"nan":0,"no":4,"type":"判断题","kind":"judge","stem":"项目软件又被称为通用软件（ ）","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"错","explain":"项目软件是为特定用户、特定需求专门开发的软件（如某医院的 HIS）；通用软件（产品软件）才是面向市场出售的软件。二者不能混为一谈。","own":1,"ref":"","score":null,"mine":"","paper":468915097,"key":0},{"id":"q33","ch":"m2","chName":"软件工程概述","kp":"1889562364773273600","kpName":"软件工程","mian":0,"zhong":1,"nan":0,"no":5,"type":"单选题","kind":"single","stem":"设计用户界面只需要计算机科学的理论和知识，而不一定需要认知心理学以及人-机工程学、语言学等学科的知识。此说法（ ）","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answer":"B","explain":"用户界面设计是交叉学科：除计算机科学外，还要用认知心理学解释人的感知与注意，用人机工程学确定交互布局，用语言学组织提示语。","own":1,"ref":"","score":null,"mine":"","paper":468915097,"key":0},{"id":"q34","ch":"m2","chName":"软件工程概述","kp":"1889562365045903360","kpName":"软件开发模型的定义","mian":0,"zhong":0,"nan":0,"no":1,"type":"单选题","kind":"single","stem":"在软件工程中，（ ）不属于软件开发部分的任务。","options":[{"k":"A","t":"软件总体设计"},{"k":"B","t":"单元测试计划"},{"k":"C","t":"软件经销"},{"k":"D","t":"组装测试计划"}],"answer":"C","explain":"软件经销属于市场销售环节，不属于开发任务；总体设计、单元测试计划、组装测试计划都在开发工作范围内。","own":1,"ref":"","score":null,"mine":"","paper":461561485,"key":0},{"id":"q35","ch":"m2","chName":"软件工程概述","kp":"1889562365045903360","kpName":"软件开发模型的定义","mian":0,"zhong":0,"nan":0,"no":2,"type":"单选题","kind":"single","stem":"以下哪一项最能体现软件开发模型的定义？","options":[{"k":"A","t":"软件开发模型是开发人员的个人经验总结"},{"k":"B","t":"软件开发模型是描述开发过程的框架和步骤"},{"k":"C","t":"软件开发模型是代码编写的一种规范"},{"k":"D","t":"软件开发模型是测试软件的标准"}],"answer":"B","explain":"软件开发模型描述了软件开发的整体框架和步骤，帮助开发团队明确开发流程。","own":0,"ref":"","score":null,"mine":"","paper":461561485,"key":0},{"id":"q36","ch":"m2","chName":"软件工程概述","kp":"1889562365045903360","kpName":"软件开发模型的定义","mian":0,"zhong":0,"nan":0,"no":3,"type":"单选题","kind":"single","stem":"一般而言，有1000K行代码的软件规模属于（ ）。","options":[{"k":"A","t":"中等"},{"k":"B","t":"大型"},{"k":"C","t":"甚大型"},{"k":"D","t":"极大型"}],"answer":"C","explain":"按代码行规模分级，1000K（百万行）属于甚大型软件，通常需要大规模团队与严格的工程管理。","own":1,"ref":"","score":null,"mine":"","paper":461561485,"key":0},{"id":"q37","ch":"m2","chName":"软件工程概述","kp":"1889562365045903360","kpName":"软件开发模型的定义","mian":0,"zhong":0,"nan":0,"no":4,"type":"单选题","kind":"single","stem":"一个软件，需要5个人开发1年左右的时间，编写5万行代码，这种软件被成为（ ）","options":[{"k":"A","t":"小型软件"},{"k":"B","t":"中型软件"},{"k":"C","t":"大型软件"},{"k":"D","t":"极大型软件"}],"answer":"B","explain":"5 人开发约 1 年（约 5 人年）、5 万行代码，属于中型软件；大型软件通常需要数十人年以上。","own":1,"ref":"","score":null,"mine":"","paper":461561485,"key":0},{"id":"q38","ch":"m2","chName":"软件工程概述","kp":"1889562365045903360","kpName":"软件开发模型的定义","mian":0,"zhong":0,"nan":0,"no":5,"type":"单选题","kind":"single","stem":"下列软件开发模型中，适合于那些不能预先确切定义需求的软件系统的开发的模型是（ ）。","options":[{"k":"A","t":"原型模型"},{"k":"B","t":"瀑布模型"},{"k":"C","t":"基于知识的智能模型"},{"k":"D","t":"变换模型"}],"answer":"A","explain":"原型模型先快速构造可运行原型，让用户在试用中澄清需求，适合需求无法预先确切定义的系统。","own":1,"ref":"","score":null,"mine":"","paper":461561485,"key":0},{"id":"q39","ch":"m2","chName":"软件工程概述","kp":"1889562365045903360","kpName":"软件开发模型的定义","mian":0,"zhong":0,"nan":0,"no":6,"type":"单选题","kind":"single","stem":"为使得开发人员对软件产品的各个阶段工作都进行周密的思考，从而减少返工，所以（ ）的编制是很重要的。","options":[{"k":"A","t":"需求说明"},{"k":"B","t":"概要说明"},{"k":"C","t":"软件文档"},{"k":"D","t":"测试计划"}],"answer":"C","explain":"文档把每个阶段的思考结果固化下来，迫使开发人员周密考虑、便于评审与交接，是减少返工的关键。","own":1,"ref":"","score":null,"mine":"","paper":461561485,"key":0},{"id":"q40","ch":"m2","chName":"软件工程概述","kp":"1889562365045903360","kpName":"软件开发模型的定义","mian":0,"zhong":0,"nan":0,"no":7,"type":"单选题","kind":"single","stem":"下列软件开发模型中，支持需求不明确，特别是大型软件系统的开发，并支持多种软件开发方法的模型是（ ）。","options":[{"k":"A","t":"原型模型"},{"k":"B","t":"瀑布模型"},{"k":"C","t":"喷泉模型"},{"k":"D","t":"螺旋模型"}],"answer":"D","explain":"螺旋模型以风险分析为核心，迭代推进，既能容忍需求不明确，又允许在不同螺旋中选用不同开发方法，适合大型系统。","own":1,"ref":"","score":null,"mine":"","paper":460800815,"key":0},{"id":"q41","ch":"m2","chName":"软件工程概述","kp":"1889562365045903360","kpName":"软件开发模型的定义","mian":0,"zhong":0,"nan":0,"no":8,"type":"单选题","kind":"single","stem":"在（ ）软件开发模型中，软件被作为一系列的构件来设计、实现、集成和测试。","options":[{"k":"A","t":"瀑布模型"},{"k":"B","t":"原型模型"},{"k":"C","t":"增量模型"},{"k":"D","t":"螺旋模型"}],"answer":"C","explain":"增量模型把软件按构件分批设计、实现、集成和测试，每批交付一个可运行增量。","own":1,"ref":"","score":null,"mine":"","paper":460800815,"key":0},{"id":"q42","ch":"m2","chName":"软件工程概述","kp":"1889562365113012224","kpName":"主要模型","mian":0,"zhong":0,"nan":1,"no":1,"type":"单选题","kind":"single","stem":"以文档作为驱动，适合于软件需求很明确的软件项目的生存周期模型是（ ）","options":[{"k":"A","t":"喷泉模型"},{"k":"B","t":"增量模型"},{"k":"C","t":"瀑布模型"},{"k":"D","t":"螺旋模型"}],"answer":"C","explain":"瀑布模型以文档为驱动，阶段间严格串行并评审，适用于需求明确且稳定的项目。","own":1,"ref":"","score":null,"mine":"","paper":461688859,"key":0},{"id":"q43","ch":"m2","chName":"软件工程概述","kp":"1889562365113012224","kpName":"主要模型","mian":0,"zhong":0,"nan":1,"no":2,"type":"单选题","kind":"single","stem":"瀑布模型的关键不足在于（ ）。","options":[{"k":"A","t":"过于灵活"},{"k":"B","t":"过于简单"},{"k":"C","t":"各个阶段需要进行评审"},{"k":"D","t":"不能适应需求的动态变更"}],"answer":"D","explain":"瀑布模型要求前期把需求完全定死，一旦需求变化就要回溯大量已完成阶段，这是它最主要的不足。","own":1,"ref":"","score":null,"mine":"","paper":461688859,"key":0},{"id":"q44","ch":"m2","chName":"软件工程概述","kp":"1889562365113012224","kpName":"主要模型","mian":0,"zhong":0,"nan":1,"no":3,"type":"判断题","kind":"judge","stem":"瀑布模型适用于需求不明确且可能发生频繁变更的软件开发项目。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"错","explain":"该题考核学生对瀑布模型适用场景的掌握，瀑布模型适用于需求明确且变更较少的项目。","own":0,"ref":"","score":null,"mine":"","paper":461688859,"key":0},{"id":"q45","ch":"m2","chName":"软件工程概述","kp":"1889562365113012224","kpName":"主要模型","mian":0,"zhong":0,"nan":1,"no":4,"type":"判断题","kind":"judge","stem":"增量模型实质就是一系列原型模型。（ ）","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"错","explain":"增量模型交付的是逐步完善的可运行产品，并非一系列用完即弃的原型；原型模型才是先做原型再丢弃或演化。","own":1,"ref":"","score":null,"mine":"","paper":461688859,"key":0},{"id":"q46","ch":"m2","chName":"软件工程概述","kp":"1889562365113012224","kpName":"主要模型","mian":0,"zhong":0,"nan":1,"no":5,"type":"判断题","kind":"judge","stem":"螺旋模型是接连的弯曲了的瀑布模型。（ ）","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"对","explain":"螺旋模型每一圈都重复「制定计划—风险分析—实施—评审」，并把瀑布式的阶段串在螺旋上，所以被形容为弯曲的瀑布。","own":1,"ref":"","score":null,"mine":"","paper":461688859,"key":0},{"id":"q47","ch":"m2","chName":"软件工程概述","kp":"1889562365113012224","kpName":"主要模型","mian":0,"zhong":0,"nan":1,"no":6,"type":"多选题","kind":"multi","stem":"螺旋模型是（ ）模型的结合。","options":[{"k":"A","t":"原型"},{"k":"B","t":"瀑布"},{"k":"C","t":"增量"},{"k":"D","t":"喷泉"}],"answer":"AB","explain":"螺旋模型把瀑布模型的阶段性与原型模型的迭代试错结合起来，并以风险分析驱动，因此是瀑布与原型的结合。","own":1,"ref":"","score":null,"mine":"","paper":461688859,"key":0},{"id":"q48","ch":"m2","chName":"软件工程概述","kp":"1889562365113012224","kpName":"主要模型","mian":0,"zhong":0,"nan":1,"no":7,"type":"判断题","kind":"judge","stem":"瀑布模型必须待前一阶段的工作完成之后，才能进行下一阶段的工作。（ ）","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"对","explain":"瀑布模型强调阶段间的顺序性与评审，前一阶段的文档通过评审后才进入下一阶段。","own":1,"ref":"","score":null,"mine":"","paper":460811972,"key":0},{"id":"q49","ch":"m2","chName":"软件工程概述","kp":"1889562365113012224","kpName":"主要模型","mian":0,"zhong":0,"nan":1,"no":8,"type":"单选题","kind":"single","stem":"（ ）引入了“风险驱动”的思想，适用于大规模的内部开发项目。","options":[{"k":"A","t":"增量模型"},{"k":"B","t":"喷泉模型"},{"k":"C","t":"原型模型"},{"k":"D","t":"螺旋模型"}],"answer":"D","explain":"螺旋模型每一圈都先做风险分析，再决定是否继续，是典型的「风险驱动」模型，适合大型内部开发项目。","own":1,"ref":"","score":null,"mine":"","paper":460811972,"key":0},{"id":"q50","ch":"m2","chName":"软件工程概述","kp":"1889562365113012224","kpName":"主要模型","mian":0,"zhong":0,"nan":1,"no":9,"type":"单选题","kind":"single","stem":"以下哪一项是瀑布模型的关键特点？","options":[{"k":"A","t":"强调并行开发"},{"k":"B","t":"各阶段严格按照顺序进行"},{"k":"C","t":"需求可以随时修改"},{"k":"D","t":"适用于需求变化频繁的项目"}],"answer":"B","explain":"瀑布模型以其严格的阶段性和顺序性著称，适合需求明确且变动较小的项目。","own":0,"ref":"","score":null,"mine":"","paper":460811972,"key":0},{"id":"q51","ch":"m3","chName":"项目计划","kp":"1889562365847015424","kpName":"可行性研究","mian":1,"zhong":1,"nan":0,"no":1,"type":"多选题","kind":"multi","stem":"下列选项中，属于可行性研究的任务的是（ ）。","options":[{"k":"A","t":"概要设计"},{"k":"B","t":"经济可行性"},{"k":"C","t":"技术可行性"},{"k":"D","t":"开发方案的选择"}],"answer":"BCD","explain":"可行性研究包含经济可行性、技术可行性、法律/社会可行性以及开发方案的选择与比较；概要设计属于设计阶段，不在其列。","own":1,"ref":"","score":null,"mine":"","paper":388156365,"key":0},{"id":"q52","ch":"m3","chName":"项目计划","kp":"1889562365847015424","kpName":"可行性研究","mian":1,"zhong":1,"nan":0,"no":2,"type":"多选题","kind":"multi","stem":"下列选项中，不属于可行性研究的任务的是（ ）。","options":[{"k":"A","t":"输入数据"},{"k":"B","t":"实际输出结果"},{"k":" ":0,"ref":"","score":null,"mine":"","paper":460922293,"key":1},{"id":"q91","ch":"m5","chName":"概要设计","kp":"1889562369085018112","kpName":"耦合","mian":0,"zhong":0,"nan":1,"no":1,"type":"单选题","kind":"single","stem":"下图中的程序由A、B、C、D、E 5个模块组成，下表中描述了这些模块之间的接口，[图片]每—个接口有一个编号。此外，模块A、D和E都要引用一个专用数据区。那么B和D之间耦合关系是（ ）。","options":[{"k":"A","t":"公共耦合"},{"k":"B","t":"数据耦合"},{"k":"C","t":"内容耦合"},{"k":"D","t":"控制耦合"}],"answer":"D","explain":"B 与 D 之间传递的是控制信息（如标志、开关量，用于决定对方执行哪条路径），属于控制耦合；数据耦合只传简单数据。","own":1,"ref":"","score":null,"mine":"","paper":468264615,"key":1},{"id":"q92","ch":"m5","chName":"概要设计","kp":"1889562369085018112","kpName":"耦合","mian":0,"zhong":0,"nan":1,"no":2,"type":"多选题","kind":"multi","stem":"独立性强的模块应该是（ ）","options":[{"k":"A","t":"高耦合"},{"k":"B","t":"低耦合"},{"k":"C","t":"高内聚"},{"k":"D","t":"低内聚"}],"answer":"BC","explain":"模块独立性强的标志是「高内聚、低耦合」：模块内部结合紧密，模块之间联系松散。","own":1,"ref":"","score":null,"mine":"","paper":468264615,"key":1},{"id":"q93","ch":"m5","chName":"概要设计","kp":"1889562369085018112","kpName":"耦合","mian":0,"zhong":0,"nan":1,"no":3,"type":"单选题","kind":"single","stem":"在七种耦合中，最低耦合是（ ）。","options":[{"k":"A","t":"内容耦合"},{"k":"B","t":"公共耦合"},{"k":"C","t":"数据耦合"},{"k":"D","t":"非直接耦合"}],"answer":"D","explain":"七种耦合由低到高为：非直接耦合、数据耦合、标记耦合、控制耦合、外部耦合、公共耦合、内容耦合。最低的是非直接耦合。","own":1,"ref":"","score":null,"mine":"","paper":468264615,"key":1},{"id":"q94","ch":"m5","chName":"概要设计","kp":"1889562369085018112","kpName":"耦合","mian":0,"zhong":0,"nan":1,"no":4,"type":"单选题","kind":"single","stem":"[图片]\nA模块和B模块是（ ）耦合？","options":[{"k":"A","t":"外部耦合"},{"k":"B","t":"控制耦合"},{"k":"C","t":"数据耦合"},{"k":"D","t":"公共耦合"}],"answer":"B","explain":"两模块之间传送控制信号/开关量，由一方控制另一方的执行路径，属于控制耦合。","own":1,"ref":"","score":null,"mine":"","paper":468264615,"key":1},{"id":"q95","ch":"m5","chName":"概要设计","kp":"1889562369085018112","kpName":"耦合","mian":0,"zhong":0,"nan":1,"no":5,"type":"单选题","kind":"single","stem":"[图片]\n模块3和模块4属于（ ）耦合？","options":[{"k":"A","t":"数据耦合"},{"k":"B","t":"非直接耦合"},{"k":"C","t":"公共耦合"},{"k":"D","t":"外部耦合"}],"answer":"D","explain":"两模块都访问同一外部环境（同一设备、同一通信协议、同一外部数据格式），属于外部耦合。","own":1,"ref":"","score":null,"mine":"","paper":468264615,"key":1},{"id":"q96","ch":"m5","chName":"概要设计","kp":"1889562369085018112","kpName":"耦合","mian":0,"zhong":0,"nan":1,"no":6,"type":"单选题","kind":"single","stem":"[图片]\n模块2和模块3属于（ ）耦合？","options":[{"k":"A","t":"数据耦合"},{"k":"B","t":"公共耦合"},{"k":"C","t":"非直接耦合"},{"k":"D","t":"外部耦合"}],"answer":"C","explain":"两模块之间没有任何直接联系，只通过各自的上层模块间接相关，属于非直接耦合，是耦合度最低的一种。","own":1,"ref":"","score":null,"mine":"","paper":468264615,"key":1},{"id":"q97","ch":"m5","chName":"概要设计","kp":"1889562369085018112","kpName":"耦合","mian":0,"zhong":0,"nan":1,"no":7,"type":"判断题","kind":"judge","stem":"内容耦合是一种最高的耦合，是模块间理想化的耦合方式。（ ）","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"错","explain":"内容耦合是一个模块直接访问另一个模块的内部数据或代码，是耦合度最高、最应避免的方式，绝非理想方式。","own":1,"ref":"","score":null,"mine":"","paper":464775523,"key":1},{"id":"q98","ch":"m5","chName":"概要设计","kp":"1889562369085018112","kpName":"耦合","mian":0,"zhong":0,"nan":1,"no":8,"type":"判断题","kind":"judge","stem":"耦合指的是：模块间联系的程度（ ）","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"对","explain":"耦合衡量的是模块之间联系的紧密程度；模块内部各成分结合的紧密程度叫内聚。","own":1,"ref":"","score":null,"mine":"","paper":464775523,"key":1},{"id":"q99","ch":"m5","chName":"概要设计","kp":"1889562369085018112","kpName":"耦合","mian":0,"zhong":0,"nan":1,"no":9,"type":"单选题","kind":"single","stem":"模块（ ），则说明模块的独立性越强。","options":[{"k":"A","t":"耦合越强"},{"k":"B","t":"扇入数越高"},{"k":"C","t":"耦合越弱"},{"k":"D","t":"扇入数越低"}],"answer":"C","explain":"耦合越弱，模块之间牵连越少，独立性越强；扇入高说明复用充分，但决定独立性的仍是耦合与内聚。","own":1,"ref":"","score":null,"mine":"","paper":462193016,"key":1},{"id":"q100","ch":"m5","chName":"概要设计","kp":"1889562369085018112","kpName":"耦合","mian":0,"zhong":0,"nan":1,"no":10,"type":"判断题","kind":"judge","stem":"对于外部耦合,或者公共耦合,我们要合并模块变成通信内聚,来减少对全局数据的引用. （ ）","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"对","explain":"外部耦合、公共耦合都源于对全局数据/外部环境的共同依赖，把相关模块合并为通信内聚， ,"ref":"","score":null,"mine":"","paper":468256239,"key":1},{"id":"q106","ch":"m5","chName":"概要设计","kp":"1889562369688997888","kpName":"内聚","mian":0,"zhong":0,"nan":1,"no":5,"type":"单选题","kind":"single","stem":"模块中一个组成部分的输出作为另一个组成部分的输入，该模块的内聚性是（ ）。","options":[{"k":"A","t":"时间内聚"},{"k":"B","t":"通信内聚"},{"k":"C","t":"顺序内聚"},{"k":"D","t":"过程内聚"}],"answer":"C","explain":"一个成分的输出作为另一个成分的输入，形成顺序关系，属于顺序内聚。","own":1,"ref":"","score":null,"mine":"","paper":468256239,"key":1},{"id":"q107","ch":"m5","chName":"概要设计","kp":"1889562369688997888","kpName":"内聚","mian":0,"zhong":0,"nan":1,"no":6,"type":"判断题","kind":"judge","stem":"内聚是衡量模块间紧密程度的。（ ）","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"错","explain":"内聚衡量的是模块内部各成分结合的紧密程度；衡量模块之间紧密程度的是耦合。二者不能混淆。","own":1,"ref":"","score":null,"mine":"","paper":468256239,"key":1},{"id":"q108","ch":"m5","chName":"概要设计","kp":"1889562369688997888","kpName":"内聚","mian":0,"zhong":0,"nan":1,"no":7,"type":"单选题","kind":"single","stem":"① 巧合内聚 ② 时间内聚 ③ 功能内聚 ④ 通信内聚\n⑤ 逻辑内聚 ⑥ 顺序内聚 ⑦ 过程内聚\n\n请将有关模块独立性的各种模块内聚，按其内聚度（强度）从高到低排列起来（ ）。","options":[{"k":"A","t":"③、⑥、⑤、①、④、⑦、②"},{"k":"B","t":"⑥、⑤、③、①、④、⑦、②"},{"k":"C","t":"③、⑥、④、⑦、②、⑤、①"},{"k":"D","t":"③、②、⑤、⑥、④、⑦、①"}],"answer":"C","explain":"内聚由高到低为：功能内聚＞顺序内聚＞通信内聚＞过程内聚＞时间内聚＞逻辑内聚＞巧合内聚，对应③⑥④⑦②⑤①。","own":1,"ref":"","score":null,"mine":"","paper":464780122,"key":1},{"id":"q109","ch":"m5","chName":"概要设计","kp":"1889562371031175168","kpName":"结构图（Structure Chart，SC）","mian":0,"zhong":1,"nan":0,"no":1,"type":"单选题","kind":"single","stem":"下图是一个SC结构图的[图片]（ ）模块？","options":[{"k":"A","t":"传入模块"},{"k":"B","t":"传出模块"},{"k":"C","t":"变换模块"},{"k":"D","t":"协调模块"}],"answer":"C","explain":"该模块接收输入数据、经变换后输出，处于变换中心位置，属于变换模块；传入模块只负责把数据送进来。","own":1,"ref":"","score":null,"mine":"","paper":468260492,"key":1},{"id":"q110","ch":"m5","chName":"概要设计","kp":"1889562371031175168","kpName":"结构图（Structure Chart，SC）","mian":0,"zhong":1,"nan":0,"no":2,"type":"单选题","kind":"single","stem":"[图片]\n上图是DFD向SC图映射的（ ）结构","options":[{"k":"A","t":"输入结构"},{"k":"B","t":"输出结构"},{"k":"C","t":"变换结构"},{"k":"D","t":"控制结构"}],"answer":"C","explain":"DFD 中呈「输入—变换—输出」三段式时映射为变换结构，对应变换分析；若存在事务中心则映射为事务结构。","own":1,"ref":"","score":null,"mine":"","paper":468260492,"key":1},{"id":"q111","ch":"m5","chName":"概要设计","kp":"1889562371031175168","kpName":"结构图（Structure Chart，SC）","mian":0,"zhong":1,"nan":0,"no":3,"type":"判断题","kind":"judge","stem":"PAD图是树形结构，适合于大型的软件开发。( )","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"对","explain":"PAD 图是二维树形结构，自左向右展开、层次清晰，适合大型程序的详细设计；程序流程图反而不适合大型程序。","own":1,"ref":"","score":null,"mine":"","paper":468260492,"key":1},{"id":"q112","ch":"m5","chName":"概要设计","kp":"1889562371228307456","kpName":"结构化设计方法——变换映射","mian":0,"zhong":0,"nan":1,"no":1,"type":"单选题","kind":"single","stem":"[图片]\n上图的DFD图适合做（ ）映射？","options":[{"k":"A","t":"变换映射"},{"k":"B","t":"事务映射"},{"k":"C","t":"控制映射"},{"k":"D","t":"逻辑映射"}],"answer":"A","explain":"该 DFD 呈现明显的输入—变换—输出三段式，没有事务中心分支，因此适合变换映射。","own":1,"ref":"","score":null,"mine":"","paper":460950876,"key":1},{"id":"q113","ch":"m5","chName":"概要设计","kp":"1889562371228307456","kpName":"结构化设计方法——变换映射","mian":0,"zhong":0,"nan":1,"no":2,"type":"判断题","kind":"judge","stem":"在变换映射中的逻辑输入就是物理输入。（ ）","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"错","explain":"逻辑输入是数据在系统中被变换之前的概念性输入流，物理输入是具体的输入设备与格式；两者不等同，因此该说法错误。","own":1,"ref":"","score":null,"mine":"","paper":460950876,"key":1},{"id":"q114","ch":"m5","chName":"概要设计","kp":"1889562371295416320","kpName":"结构化设计方法——事务映射","mian":0,"zhong":0,"nan":1,"no":1,"type":"单选题","kind":"single","stem":"（ ）的三种基本控制结构的共同特点是只有一个入口和一个出口。","options":[{"k":"A","t":"程序"},{"k":"B","t":"高级语言"},{"k":"C","t":"文档"},{"k":"D","t":"数据字典"}],"answer":"A","explain":"顺序、选择、循环三种基本控制结构的共同特点是单入口、单出口，程序正是由这三种结构组合而成。","own":1,"ref":"","score":null,"mine":"","paper":460961244,"key":1},{"id":"q115","ch":"m5","chName":"概要设计","kp":"1889562371295416320","kpName":"结构化设计方法——事务映射","mian":0,"zhong":0,"nan":1,"no":2,"type":"单选题","kind":"single","stem":"面向对象程序设计将描述事务的数据与（）封装在一起，作为一个相互依存、不可分割的整体来处理。（ ）","options":[{"k":"A","t":"信息"},{"k":"B","t":"数据隐藏"},{"k":"C","t":"对数据的操作"},{"k":"D","t":"数据抽象"}],"answer":"C","explain":"面向对象把描述事物的数据与对这些数据的操作封装在一起，形成不可分割的对象整体。","own":1,"ref":"","score":null,"mine":"","paper":460961244,"key":1},{"id":"q116","ch":"m5","chName":"概要设计","kp":"1889562371295416320","kpName":"结构化设计方法——事务映射","mian":0,"zhong":0,"nan":1,"no":3,"type":"判断题","kind":"judge","stem":"通信关联（Communication Association ）表示Actor向Use Case的单向交互（ ）","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"错","explain":"通信关联表示 Actor 与 Use Case 之间的交互关系，但这种关联并不规定「单向」——Actor 发起、用例响应，二者是双向的通信，故「单向交互」的说法错误。","own":1,"ref":"","score":null,"mine":"","paper":460961244,"key":1},{"id":"q117","ch":"m6","chName":"详细设计","kp":"1889562371618377728","kpName":"详细设计的任务","mian":0,"zhong":0,"nan":0,"no":1,"type":"单选题","kind":"single","stem":"( )阶段是为每个模块完成的功能进行具体的描述，要把功能描述转变为精确的、结构化的过程描述。","options":[{"k":"A","t":"概要设计"},{"k":"B","t":"详细设计"},{"k":"C","t":"编码"},{"k":"D","t":"测试"}],"answer":"B","explain":"详细设计阶段把每个模块的功能描述转变为精确的、结构化的过程描述（算法与内部数据），是「怎么做」的落地。","own":1,"ref":"","score":null,"mine":"","paper":460975260,"key":1},{"id":"q118","ch":"m6","chName":"详细设计","kp":"1889562371618377728","kpName":"详细设计的任务","mian":0,"zhong":0,"nan":0,"no":2,"type":"单选题","kind":"single","stem":"程序的三种基本控制结构是（ ）。","options":[{"k":"A","t":"过程、子程序和分程序"},{"k":"B","t":"顺序、选择和循环"},{"k":"C","t":"递归、堆栈和队列"},{"k":"D","t":"调用、返回和转移"}],"answer":"B","explain":"程序的三种基本控制结构是顺序、选择（分支）和循环，任何复杂程序都可由这三种结构组合而成。","own":1,"ref":"","score":null,"mine":"","paper":460975260,"key":1},{"id":"q119","ch":"m6","chName":"详细设计","kp":"1889562371618377728","kpName":"详细设计的任务","mian":0,"zhong":0,"nan":0,"no":3,"type":"判断题","kind":"judge","stem":"画DFD时，只要考虑系统的逻辑功能而不要考虑如何具体地实现这些功能；（ ）","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"对","explain":"DFD 只描述系统「做什么」的逻辑功能，不涉及用什么技术、按什么顺序实现，因此画图时不必考虑实现细节。","own":1,"ref":"","score":null,"mine":"","paper":460975260,"key":1},{"id":"q120","ch":"m6","chName":"详细设计","kp":"1889562371618377728","kpName":"详细设计的任务","mian":0,"zhong":0,"nan":0,"no":4,"type":"判断题","kind":"judge","stem":"详细设计的根本目标是确定应该怎样具体地实现所要求的系统. ( )","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"对","explain":"详细设计的根本目标就是确定「怎样具体实现」所要求的系统：给出每个模块的算法、内部数据结构与接口细节。","own":1,"ref":"","score":null,"mine":"","paper":460975260,"key":1},{"id":"q121","ch":"m6","chName":"详细设计","kp":"1889562371618377728","kpName":"详细设计的任务","mian":0,"zhong":0,"nan":0,"no":5,"type":"单选题","kind":"single","stem":"需求规格说明书的内容不应该包括（ ）。","options":[{"k":"A","t":"对重要功能的描述"},{"k":"B","t":"对算法的详细过程性描述"},{"k":"C","t":"软件确认准则"},{"k":"D","t":"软件的性能"}],"answer":"B","explain":"需求规格说明书描述系统「做什么」，不写算法的详细过程性描述——那属于详细设计的内容。","own":1,"ref":"","score":null,"mine":"","paper":460975260,"key":1},{"id":"q122","ch":"m6","chName":"详细设计","kp":"1889562371618377728","kpName":"详细设计的任务","mian":0,"zhong":0,"nan":0,"no":6,"type":"单选题","kind":"single","stem":"软件详细设计阶段的任务是（ ）","options":[{"k":"A","t":"算法设计"},{"k":"B","t":"功能设计"},{"k":"C","t":"调用关系设计"},{"k":"D","t":"输入/输出设计"}],"answer":"A","explain":"详细设计阶段的核心任务是算法设计（以及模块内部数据结构与接口细节），功能设计、调用关系设计在概要设计完成。","own":1,"ref":"","score":null,"mine":"","paper":460975260,"key":1},{"id":"q123","ch":"m6","chName":"详细设计","kp":"1889562371886813184","kpName":"详细设计工具——程序流程图","mian":0,"zhong":1,"nan":0,"no":1,"type":"单选题","kind":"single","stem":"系统流程图是描述( )的工具（ ）。","options":[{"k":"A","t":"逻辑系统"},{"k":"B","t":"程序系统"},{"k":"C","t":"体系结构"},{"k":"D","t":"物理系统"}],"answer":"D","explain":"系统流程图描述的是物理系统：具体的数据载体、处理设备与流转过程，与描述逻辑模型的数据流图相对。","own":1,"ref":"","score":null,"mine":"","paper":460987298,"key":1},{"id":"q124","ch":"m6","chName":"详细设计","kp":"1889562371886813184","kpName":"详细设计工具——程序流程图","mian":0,"zhong":1,"nan":0,"no":2,"type":"判断题","kind":"judge","stem":"DFD与程序流程图的区别是程序流程图用于表示程序的过程设计，DFD用作描述软件的逻辑功能，不能表示程序的控制结构。（ ）","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"对","explain":"程序流程图用于过程设计，能表示顺序、选择、循环等控制结构；DFD 只描述逻辑功能，不表示控制结构，两者分工不同。","own":1,"ref":"","score":null,"mine":"","paper":460987298,"key":1},{"id":"q125","ch":"m6","chName":"详细设计","kp":"1889562371886813184","kpName":"详细设计工具——程序流程图","mian":0,"zhong":1,"nan":0,"no":3,"type":"多选题","kind":"multi","stem":"软件由（ ）组成。","options":[{"k":"A","t":"文档资料"},{"k":"B","t":"程序"},{"k":"C","t":"数据"},{"k":"D","t":"算法"}],"answer":"ABC","explain":"软件由程序、数据与文档三部分组成：程序是处理逻辑，数据是加工对象，文档是开发与使用的依据。","own":1,"ref":"","score":null,"mine":"","paper":460987298,"key":1},{"id":"q126","ch":"m6","chName":"详细设计","kp":"1889562371886813184","kpName":"详细设计工具——程序流程图","mian":0,"zhong":1,"nan":0,"no":4,"type":"单选题","kind":"single","stem":"（ ）是一种传统的程序设计表示工具。","options":[{"k":"A","t":"程序流程图"},{"k":"B","t":"数据流图"},{"k":"C","t":"结构图"},{"k":"D","t":"HIPO图"}],"answer":"A","explain":"程序流程图是传统的程序设计表示工具，用方框、菱形、箭头描述处理、判断与流程。","own":1,"ref":"","score":null,"mine":"","paper":460987298,"key":1},{"id":"q127","ch":"m6","chName":"详细设计","kp":"1889562371886813184","kpName":"详细设计工具——程序流程图","mian":0,"zhong":1,"nan":0,"no":5,"type":"判断题","kind":"judge","stem":"程序流程图适合对规模大的程序进行详细设计分析。( )","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"错","explain":"程序流程图用箭头自由跳转，规模一大就难以阅读和维护，只适合小规模程序的详细设计。","own":1,"ref":"","score":null,"mine":"","paper":460987298,"key":1},{"id":"q128","ch":"m6","chName":"详细设计","kp":"1889562371953922048","kpName":"详细设计工具——N-S图（盒图）","mian":0,"zhong":1,"nan":0,"no":1,"type":"判断题","kind":"judge","stem":"N-S图了取消“控制流”，不允许随意转移控制。（ ）","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"对","explain":"N-S 图（盒图）取消了控制流箭头，用嵌套盒子表达结构，从形式上禁止随意转移控制，保证结构化。","own":1,"ref":"","score":null,"mine":"","paper":460995958,"key":1},{"id":"q129","ch":"m6","chName":"详细设计","kp":"1889562371953922048","kpName":"详细设计工具——N-S图（盒图）","mian":0,"zhong":1,"nan":0,"no":2,"type":"单选题","kind":"single","stem":"在详细设计的图示工具中，（ ）的形状象一个盒子。","options":[{"k":"A","t":"HIPO图"},{"k":"B","t":"流程图"},{"k":"C","t":"N-S图"},{"k":"D","t":"PAD图"}],"answer":"C","explain":"N-S 图的形状像一个盒子，用矩形框的嵌套表示顺序、选择、循环，故又称盒图。","own":1,"ref":"","score":null,"mine":"","paper":460995958,"key":1},{"id":"q130","ch":"m6","chName":"详细设计","kp":"1889562372025225216","kpName":"详细设计工具——PAD图","mian":0,"zhong":1,"nan":0,"no":1,"type":"判断题","kind":"judge","stem":"详细设计的工具有数据流图、PAD图和N-S图等。（ ）","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"错","explain":"数据流图属于需求分析阶段的逻辑建模工具，不是详细设计工具；详细设计工具是 PAD 图、N-S 图、程序流程图、判定表等。","own":1,"ref":"","score":null,"mine":"","paper":468281526,"key":1},{"id":"q131","ch":"m8","chName":"测试","kp":"1889562372885057536","kpName":"测试方法","mian":0,"zhong":1,"nan":0,"no":1,"type":"多选题","kind":"multi","stem":"动态测试分为: （ ）","options":[{"k":"A","t":"单元测试"},{"k":"B","t":"集成测试"},{"k":"C","t":"黑盒测试"},{"k":"D","t":"白盒测试"}],"answer":"CD","explain":"动态测试按是否查看程序内部结构分为黑盒测试与白盒测试；单元测试、集成测试是按阶段划分的，不属于这一分类维度。","own":1,"ref":"","score":null,"mine":"","paper":461012844,"key":1},{"id":"q132","ch":"m8","chName":"测试","kp":"1889562372885057536","kpName":"测试方法","mian":0,"zhong":1,"nan":0,"no":2,"type":"单选题","kind":"single","stem":"一只小狗在叫，叫是这个小狗对象的（ ）","options":[{"k":"A","t":"属性"},{"k":"B","t":"事件"},{"k":"C","t":"方法"},{"k":"D","t":"调用"}],"answer":"C","explain":"「叫」是对象的行为，即方法；属性描述对象的状态（如颜色、体重），事件是外界触发的动作。","own":1,"ref":"","score":null,"mine":"","paper":461012844,"key":1},{"id":"q133","ch":"m8","chName":"测试","kp":"1889562375099650048","kpName":"调试","mian":0,"zhong":0,"nan":0,"no":1,"type":"单选题","kind":"single","stem":"在调试过程中，哪种方法最常用来定位程序中的错误？","options":[{"k":"A","t":"代码注释"},{"k":"B","t":"断点调试"},{"k":"C","t":"重写代码"},{"k":"D","t":"代码格式化"}],"answer":"B","explain":"断点调试是调试程序中最常用的方法之一，通过设置断点，开发人员可以观察程序在特定位置的状态，帮助定位问题。","own":0,"ref":"","score":null,"mine":"","paper":461020802,"key":1},{"id":"q134","ch":"m8","chName":"测试","kp":"1889562375099650048","kpName":"调试","mian":0,"zhong":0,"nan":0,"no":2,"type":"单选题","kind":"single","stem":"在调试过程中，哪一个选项最能帮助开发者发现逻辑错误？","options":[{"k":"A","t":"打印日志信息"},{"k":"B","t":"代码格式化工具"},{"k":"C","t":"自动补全工具"},{"k":"D","t":"语法检查工具"}],"answer":"A","explain":"打印日志信息是调试中常用的方法之一，通过记录程序运行中的状态信息，可以帮助开发者发现逻辑错误。","own":0,"ref":"","score":null,"mine":"","paper":461020802,"key":1},{"id":"q135","ch":"m8","chName":"测试","kp":"1889562375099650048","kpName":"调试","mian":0,"zhong":0,"nan":0,"no":3,"type":"单选题","kind":"single","stem":"在调试时，以下哪种情况最适合使用单步调试？","options":[{"k":"A","t":"程序崩溃且完全无法启动"},{"k":"B","t":"需要逐步检查代码的执行路径"},{"k":"C","t":"需要快速定位大规模程序的瓶颈"},{"k":"D","t":"需要对全局变量的状态进行批量检查"}],"answer":"B","explain":"单步调试允许开发者逐行执行代码，观察每一步的执行结果，非常适合用来检查代码的执行路径和逻辑。","own":0,"ref":"","score":null,"mine":"","paper":461020802,"key":1},{"id":"q136","ch":"m8","chName":"测试","kp":"1889562375166758912","kpName":"自动测试工具","mian":0,"zhong":0,"nan":0,"no":1,"type":"单选题","kind":"single","stem":"自动测试工具的主要作用不包括以下哪一项？","options":[{"k":"A","t":"减少人工测试的工作量"},{"k":"B","t":"提高测试的准确性"},{"k":"C","t":"完全替代人工测试"},{"k":"D","t":"提高测试效率"}],"answer":"C","explain":"自动测试工具能够提高测试的效率和准确性，但并不能完全替代人工测试，特别是在需要创造力或特殊判断的情况下，人工测试仍然不可替代。","own":0,"ref":"","score":null,"mine":"","paper":461031103,"key":1},{"id":"q137","ch":"m8","chName":"测试","kp":"1889562375166758912","kpName":"自动测试工具","mian":0,"zhong":0,"nan":0,"no":2,"type":"单选题","kind":"single","stem":"以下哪种测试类型最适合使用自动测试工具？","options":[{"k":"A","t":"用户体验测试"},{"k":"B","t":"界面设计测试"},{"k":"C","t":"回归测试"},{"k":"D","t":"需求分析"}],"answer":"C","explain":"回归测试需要反复验证软件在修改后是否引入新的问题，自动测试工具特别适合执行这种重复性高的测试任务。","own":0,"ref":"","score":null,"mine":"","paper":461031103,"key":1},{"id":"q138","ch":"m9","chName":"软件维护","kp":"1889562375372279808","kpName":"软件维护的概念及分类","mian":0,"zhong":1,"nan":0,"no":1,"type":"单选题","kind":"single","stem":"在软件维护的分类中，哪一种维护主要目的是为了修正软件中的错误或缺陷？","options":[{"k":"A","t":"适应性维护"},{"k":"B","t":"完善性维护"},{"k":"C","t":"纠错性维护"},{"k":"D","t":"预防性维护"}],"answer":"C","explain":"本题考查学生对软件维护分类的掌握。纠错性维护的主要目的是修正软件中的错误或缺陷，以确保软件的正常运行。","own":0,"ref":"","score":null,"mine":"","paper":468213313,"key":0},{"id":"q139","ch":"m9","chName":"软件维护","kp":"1889562375372279808","kpName":"软件维护的概念及分类","mian":0,"zhong":1,"nan":0,"no":2,"type":"单选题","kind":"single","stem":"以下哪种类型的软件维护属于为适应外部环境变化而进行的修改？","options":[{"k":"A","t":"纠错性维护"},{"k":"B","t":"适应性维护"},{"k":"C","t":"完善性维护"},{"k":"D","t":"预防性维护"}],"answer":"B","explain":"本题考查软件维护分类的理解。适应性维护是为了适应外部环境的变化（如硬件、操作系统、法规）而对软件进行的修改。","own":0,"ref":"","score":null,"mine":"","paper":468213313,"key":0},{"id":"q140","ch":"m9","chName":"软件维护","kp":"1889562375372279808","kpName":"软件维护的概念及分类","mian":0,"zhong":1,"nan":0,"no":3,"type":"单选题","kind":"single","stem":"完善性维护的主要目标是：","options":[{"k":"A","t":"修复软件缺陷"},{"k":"B","t":"增强软件功能或性能"},{"k":"C","t":"防止潜在问题发生"},{"k":"D","t":"对外部环境变化做出响应"}],"answer":"B","explain":"完善性维护的目的是为了增强软件的功能或性能，以满足用户提出的新需求或改进现有功能。","own":0,"ref":"","score":null,"mine":"","paper":468213313,"key":0},{"id":"q141","ch":"m9","chName":"软件维护","kp":"1889562375372279808","kpName":"软件维护的概念及分类","mian":0,"zhong":1,"nan":0,"no":4,"type":"单选题","kind":"single","stem":"预防性维护的主要作用是：","options":[{"k":"A","t":"纠正现有缺陷"},{"k":"B","t":"增强软件功能"},{"k":"C","t":"防止可能出现的问题"},{"k":"D","t":"适应环境变化"}],"answer":"C","explain":"预防性维护是为了防止未来可能出现的问题而进行的修改，目的是提高软件的可靠性和可维护性。","own":0,"ref":"","score":null,"mine":"","paper":468213313,"key":0},{"id":"q142","ch":"m9","chName":"软件维护","kp":"1889562375372279808","kpName":"软件维护的概念及分类","mian":0,"zhong":1,"nan":0,"no":5,"type":"单选题","kind":"single","stem":"根据软件维护的分类，下面哪种说法是正确的？","options":[{"k":"A","t":"适应性维护与完善性维护的目的相同"},{"k":"B","t":"纠错性维护是为了增强软件性能"},{"k":"C","t":"预防性维护是为了减少未来问题的可能性"},{"k":"D","t":"完善性维护是为了适应外部环境的变化"}],"answer":"C","explain":"本题综合考查对软件维护的分类和定义的理解。预防性维护的目的是为了减少未来问题的可能性，而不是直接修复现有问题。","own":0,"ref":"","score":null,"mine":"","paper":468213313,"key":0},{"id":"q143","ch":"m9","chName":"软件维护","kp":"1889562375569412096","kpName":"软件维护的代价","mian":0,"zhong":1,"nan":0,"no":1,"type":"多选题","kind":"multi","stem":"软件的特点有哪些？（ ）","options":[{"k":"A","t":"软件是一种逻辑实体，具有抽象性；"},{"k":"B","t":"软件维护困难；"},{"k":"C","t":"软件不会“磨损”，"},{"k":"D","t":"软件已摆脱手工艺的开发方式"}],"answer":"ABC","explain":"软件的特点包括：逻辑实体（抽象性）、不会磨损、维护困难。软件至今仍未完全摆脱手工艺式开发，故 D 不正确。","own":1,"ref":"","score":null,"mine":"","paper":461041604,"key":0},{"id":"q144","ch":"m9","chName":"软件维护","kp":"1889562375569412096","kpName":"软件维护的代价","mian":0,"zhong":1,"nan":0,"no":2,"type":"单选题","kind":"single","stem":"软件的可修改性支持软件的（ ）。","options":[{"k":"A","t":"有效性"},{"k":"B","t":"可互操作性"},{"k":"C","t":"可追踪性"},{"k":"D","t":"可维护性"}],"answer":"D","explain":"可修改性是软件可维护性的组成部分：容易修改，才能被维护。","own":1,"ref":"","score":null,"mine":"","paper":461041604,"key":0},{"id":"q145","ch":"m9","chName":"软件维护","kp":"1889562375569412096","kpName":"软件维护的代价","mian":0,"zhong":1,"nan":0,"no":3,"type":"单选题","kind":"single","stem":"软件文档是软件工程实施中的重要成分，它不仅是软件开发各阶段的重要依据而且也影响软件的 ( )。","options":[{"k":"A","t":"可维护性"},{"k":"B","t":"可靠性"},{"k":"C","t":"可移植性"},{"k":"D","t":"安全性"}],"answer":"A","explain":"文档是各阶段的依据，也直接决定软件能否被读懂、被修改，因此影响可维护性。","own":1,"ref":"","score":null,"mine":"","paper":461041604,"key":0},{"id":"q146","ch":"m9","chName":"软件维护","kp":"1889562375569412096","kpName":"软件维护的代价","mian":0,"zhong":1,"nan":0,"no":4,"type":"单选题","kind":"single","stem":"编制软件过程中，可能会存在侵犯版权，而遭至经济赔偿的问题。这个涉及到（ ）","options":[{"k":"A","t":"经济可行性研究"},{"k":"B","t":"法律可行性研究"},{"k":"C","t":"运行可行性研究"},{"k":"D","t":"技术可行性研究"}],"answer":"B","explain":"涉及版权、侵权与法律赔偿的风险，属于可行性研究中的法律可行性。","own":1,"ref":"","score":null,"mine":"","paper":461041604,"key":0},{"id":"q147","ch":"m9","chName":"软件维护","kp":"1889562375569412096","kpName":"软件维护的代价","mian":0,"zhong":1,"nan":0,"no":5,"type":"判断题","kind":"judge","stem":"软件开发是，一个错误发现的越晚，为改正它所付出的代价就越小。( )","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"错","explain":"错误发现得越晚，波及的设计与代码越多，改正代价越大（后期修改成本呈指数上升），所以该说法错误。","own":1,"ref":"","score":null,"mine":"","paper":461041604,"key":0},{"id":"q148","ch":"m9","chName":"软件维护","kp":"1889562375569412096","kpName":"软件维护的代价","mian":0,"zhong":1,"nan":0,"no":6,"type":"单选题","kind":"single","stem":"产生软件维护的副作用是指（ ）","options":[{"k":"A","t":"开发软件时的错误"},{"k":"B","t":"运行时的错误"},{"k":"C","t":"隐含的错误"},{"k":"D","t":"因修改软件而造成的错误"}],"answer":"D","explain":"软件维护的副作用指因修改软件而引入的新错误或破坏原有正确逻辑，而不是开发期或运行期本身产生的错误。","own":1,"ref":"","score":null,"mine":"","paper":461041604,"key":0},{"id":"q149","ch":"m10","chName":"面向对象的方法","kp":"1889562375770738688","kpName":"面向对象方法概述","mian":0,"zhong":0,"nan":0,"no":1,"type":"多选题","kind":"multi","stem":"关于面向对象方法的优点，下列不正确的叙述是（ ）","options":[{"k":"A","t":"与人类习惯的思维方法比较一致"},{"k":"B","t":"可重用性好"},{"k":"C","t":"以数据操作为中心"},{"k":"D","t":"可维护性好"}],"answer":"ABD","explain":"面向对象方法以对象为中心，把数据与操作封装在一起，因而可重用性、可维护性好，也贴近人的思维习惯；「以数据操作为中心」是面向数据/结构化方法的特征，不是 OO 的优点。平台答案为 ABD，若与课件表述有出入以课件为准。","own":1,"ref":"","score":null,"mine":"","paper":467686420,"key":1},{"id":"q150","ch":"m10","chName":"面向对象的方法","kp":"1889562375770738688","kpName":"面向对象方法概述","mian":0,"zhong":0,"nan":0,"no":2,"type":"判断题","kind":"judge","stem":"面向对象方法进行软件分析设计的指导思想是自顶向下地进行功能分解，从外部功能上模拟客观世界；( )","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"错","explain":"面向对象分析设计是从对象（数据与行为的统一体）出发自底向上地构造系统，而不是自顶向下做功能分解，因此该说法错误。","own":1,"ref":"","score":null,"mine":"","paper":467686420,"key":1},{"id":"q151","ch":"m10","chName":"面向对象的方法","kp":"1889562376181780480","kpName":"面向对象基本概念","mian":0,"zhong":1,"nan":1,"no":1,"type":"单选题","kind":"single","stem":"面向对象的三要素中不包括（ ）","options":[{"k":"A","t":"属性"},{"k":"B","t":"继承"},{"k":"C","t":"事件"},{"k":"D","t":"方法"}],"answer":"B","explain":"面向对象的三要素通常指封装、继承、多态；本题平台答案为「继承」，题干为「不包括」，与常见表述不一致，建议对照课件确认考点（三要素中不含的通常是「事件」或「属性」）。","own":1,"ref":"","score":null,"mine":"","paper":461065191,"key":1},{"id":"q152","ch":"m10","chName":"面向对象的方法","kp":"1889562376181780480","kpName":"面向对象基本概念","mian":0,"zhong":1,"nan":1,"no":2,"type":"单选题","kind":"single","stem":"面向对象的三个主要特征中不具有（ ）","options":[{"k":"A","t":"封装"},{"k":"B","t":"继承"},{"k":"C","t":"多态"},{"k":"D","t":"抽象"}],"answer":"D","explain":"面向对象的三大特征（主要特征）是封装、继承、多态；抽象是更一般的设计原则，不在其列。","own":1,"ref":"","score":null,"mine":"","paper":461065191,"key":1},{"id":"q153","ch":"m10","chName":"面向对象的方法","kp":"1889562376450215936","kpName":"UML建模概述","mian":0,"zhong":1,"nan":0,"no":1,"type":"单选题","kind":"single","stem":"UML模型的基本组成不包含（ ）","options":[{"k":"A","t":"要素"},{"k":"B","t":"关系"},{"k":"C","t":"连接"},{"k":"D","t":"图"}],"answer":"C","explain":"UML 模型由要素、关系、图三部分组成；「连接」不是 UML 模型的组成单位。","own":1,"ref":"","score":null,"mine":"","paper":461079741,"key":1},{"id":"q154","ch":"m10","chName":"面向对象的方法","kp":"1889562376450215936","kpName":"UML建模概述","mian":0,"zhong":1,"nan":0,"no":2,"type":"单选题","kind":"single","stem":"UML的三个要点不包括：（ ）","options":[{"k":"A","t":"统一"},{"k":"B","t":"建模"},{"k":"C","t":"图形"},{"k":"D","t":"语言"}],"answer":"C","explain":"UML 的三个要点是统一（Unified）、建模（Modeling）、语言（Language），「图形」不是三要点之一。","own":1,"ref":"","score":null,"mine":"","paper":461079741,"key":1},{"id":"q155","ch":"m10","chName":"面向对象的方法","kp":"1889562376450215936","kpName":"UML建模概述","mian":0,"zhong":1,"nan":0,"no":3,"type":"单选题","kind":"single","stem":"UML提供的图中，（ ）用于描述系统与外部系统及用户之间的交互。（ ）","options":[{"k":"A","t":"协作图"},{"k":"B","t":"类图"},{"k":"C","t":"用例图"},{"k":"D","t":"序列图"}],"answer":"C","explain":"用例图从外部用户视角描述系统提供哪些功能、与哪些参与者交互，用于刻画系统与外部环境的关系。","own":1,"ref":"","score":null,"mine":"","paper":461079741,"key":1},{"id":"q156","ch":"m10","chName":"面向对象的方法","kp":"1889562376450215936","kpName":"UML建模概述","mian":0,"zhong":1,"nan":0,"no":4,"type":"单选题","kind":"single","stem":"UML提供的图中，（ ）用于按时间顺序描述对象间交互。","options":[{"k":"A","t":"网络图"},{"k":"B","t":"状态图"},{"k":"C","t":"协作图"},{"k":"D","t":"序列图"}],"answer":"D","explain":"序列图（顺序图）按时间顺序描述对象之间的消息交互，强调先后次序；协作图强调对象间的结构关系。","own":1,"ref":"","score":null,"mine":"","paper":461079741,"key":1},{"id":"q157","ch":"m10","chName":"面向对象的方法","kp":"1889562376651542528","kpName":"Use Case图","mian":0,"zhong":1,"nan":1,"no":1,"type":"判断题","kind":"judge","stem":"在UseCase图中，主导Actor是主动要求得到结果，一个Use Case可以有多个主导Actor。（ ）","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"错","explain":"一个 Use Case 通常只由一个主导 Actor 发起（主动要求结果），多个 Actor 可以参与同一用例，但主导者一般唯一。","own":1,"ref":"","score":null,"mine":"","paper":468912395,"key":1},{"id":"q158","ch":"m10","chName":"面向对象的方法","kp":"1889562376651542528","kpName":"Use Case图","mian":0,"zhong":1,"nan":1,"no":2,"type":"判断题","kind":"judge","stem":"Use Case图用于描述拟建系统和外部环境的关系。( )","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"对","explain":"用例图正是用来描述拟建系统与外部环境（Actor）之间关系与交互的模型。","own":1,"ref":"","score":null,"mine":"","paper":468912395,"key":1},{"id":"q159","ch":"m10","chName":"面向对象的方法","kp":"1889562376651542528","kpName":"Use Case图","mian":0,"zhong":1,"nan":1,"no":3,"type":"单选题","kind":"single","stem":"不属于Use Case特征的是：( )","options":[{"k":"A","t":"Use Case表示从外部用户角度观察的系统功能；"},{"k":"B","t":"Use Case表示从内部用户角度观察的系统功能；"},{"k":"C","t":"Use Case总是由Actor初始化；"},{"k":"D","t":"Use Case为Actor提供值；"}],"answer":"B","explain":"Use Case 是从外部用户角度观察的系统功能，由 Actor 初始化并为其提供可感知的价值；「从内部用户角度观察」不是用例的特征。","own":1,"ref":"","score":null,"mine":"","paper":468912395,"key":1},{"id":"q160","ch":"m10","chName":"面向对象的方法","kp":"1889562376651542528","kpName":"Use Case图","mian":0,"zhong":1,"nan":1,"no":4,"type":"判断题","kind":"judge","stem":"Use Case之间可以是调用关系。（ ）","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"错","explain":"Use Case 之间只有包含（include）、扩展（extend）、泛化（generalization）三种关系，不存在「调用」关系。","own":1,"ref":"","score":null,"mine":"","paper":468912395,"key":1},{"id":"q161","ch":"m10","chName":"面向对象的方法","kp":"1889562376651542528","kpName":"Use Case图","mian":0,"zhong":1,"nan":1,"no":5,"type":"判断题","kind":"judge","stem":"一个Actor和Use Case之间的通信关联对应一个边界类。（ ）","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"对","explain":"每个 Actor 与 Use Case 之间的通信关联，在分析阶段都对应一个边界类，负责该交互的输入输出。","own":1,"ref":"","score":null,"mine":"","paper":468912395,"key":1},{"id":"q162","ch":"m10","chName":"面向对象的方法","kp":"1889562376651542528","kpName":"Use Case图","mian":0,"zhong":1,"nan":1,"no":6,"type":"单选题","kind":"single","stem":"Use Case图中不包括：（ ）","options":[{"k":"A","t":"Use Case（用例）"},{"k":"B","t":"Actor（执行者）"},{"k":"C","t":"通信关联"},{"k":"D","t":"加工处理"}],"answer":"D","explain":"用例图由用例、执行者（Actor）和它们之间的通信关联组成；「加工处理」是数据流图中的元素。","own":1,"ref":"","score":null,"mine":"","paper":468912395,"key":1},{"id":"q163","ch":"m10","chName":"面向对象的方法","kp":"1889562376651542528","kpName":"Use Case图","mian":0,"zhong":1,"nan":1,"no":7,"type":"判断题","kind":"judge","stem":"下图表示UseCaseB是UseCaseA和UseCaseC的公共部分。[图片]（ ）","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"对","explain":"图示为 include（包含）关系：公共部分被抽成独立用例，由多个用例共同包含，因此说 B 是 A、C 的公共部分是正确的。","own":1,"ref":"","score":null,"mine":"","paper":468910912,"key":1},{"id":"q164","ch":"m10","chName":"面向对象的方法","kp":"1889562377087750144","kpName":"类图（Class Diagram）的概念","mian":0,"zhong":1,"nan":1,"no":1,"type":"单选题","kind":"single","stem":"以下哪种UML关系在类图中用带空心箭头的实线表示？","options":[{"k":"A","t":"实现关系（Realization）"},{"k":"B","t":"继承关系（Generalization）"},{"k":"C","t":"依赖关系（Dependency）"},{"k":"D","t":"聚合关系（Aggregation）"}],"answer":"B","explain":"在UML类图中，继承关系（Generalization）用带空心箭头的实线表示，箭头指向父类。实现关系用带空心箭头的虚线表示，依赖关系用带箭头的虚线表示，聚合关系用空心菱形连接线表示。","own":0,"ref":"","score":null,"mine":"","paper":468291800,"key":1},{"id":"q165","ch":"m10","chName":"面向对象的方法","kp":"1889562377087750144","kpName":"类图（Class Diagram）的概念","mian":0,"zhong":1,"nan":1,"no":2,"type":"单选题","kind":"single","stem":"在类图中，表示一个类可以包含多个其他类的关系，通常称为什么？","options":[{"k":"A","t":"依赖（Dependency）"},{"k":"B","t":"泛化（Generalization）"},{"k":"C","t":"聚合（Aggregation）"},{"k":"D","t":"实现（Realization）"}],"answer":"C","explain":"聚合（Aggregation）是类图中的一种关系，用于表示整体与部分的关系。它用一个空心菱形连接部分类和整体类，例如“大学”包含多个“学院”。选项A、B、D分别表示依赖、继承和接口实现关系，均不正确。","own":0,"ref":"","score":null,"mine":"","paper":468291800,"key":1},{"id":"q166","ch":"m10","chName":"面向对象的方法","kp":"1889562377087750144","kpName":"类图（Class Diagram）的概念","mian":0,"zhong":1,"nan":1,"no":3,"type":"单选题","kind":"single","stem":"类图中的关联关系（Association）通常表示什么？","options":[{"k":"A","t":"类之间的继承关系"},{"k":"B","t":"类之间的依赖关系"},{"k":"C","t":"类之间的静态连接关系"},{"k":"D","t":"类之间的动态行为关系"}],"answer":"C","explain":"类图中的关联关系是用于表示类之间的连接关系，通常是静态的，比如“学生”与“课程”之间的选课关系。选项A、B、D分别对应泛化关系、依赖关系和动态行为关系，均不正确。","own":0,"ref":"","score":null,"mine":"","paper":468291800,"key":1},{"id":"q167","ch":"m10","chName":"面向对象的方法","kp":"1889562377087750144","kpName":"类图（Class Diagram）的概念","mian":0,"zhong":1,"nan":1,"no":4,"type":"单选题","kind":"single","stem":"下列说法中能准确地描述对象的是（ ）","options":[{"k":"A","t":"对象是类的具体实例，可以操作数据的方法"},{"k":"B","t":"对象是抽象的，类可以通过对象来生成"},{"k":"C","t":"对象只是方法的集合"},{"k":"D","t":"对象是一组具有共同的结构和行为的类"}],"answer":"A","explain":"对象是类的一个具体实例，封装了属性值并可调用其方法；类是模板，对象由类创建，而不是相反。","own":1,"ref":"","score":null,"mine":"","paper":468291800,"key":1},{"id":"q168","ch":"m10","chName":"面向对象的方法","kp":"1889562377087750144","kpName":"类图（Class Diagram）的概念","mian":0,"zhong":1,"nan":1,"no":5,"type":"单选题","kind":"single","stem":"类的构造函数是在（ ）调用的。","options":[{"k":"A","t":"类创建时"},{"k":"B","t":"创建对象时"},{"k":"C","t":"删除对象时"},{"k":"D","t":"不自动调用"}],"answer":"B","explain":"构造函数在创建对象（实例化）时自动调用，用于初始化对象的状态。","own":1,"ref":"","score":null,"mine":"","paper":468291800,"key":1},{"id":"q169","ch":"m10","chName":"面向对象的方法","kp":"1889562377087750144","kpName":"类图（Class Diagram）的概念","mian":0,"zhong":1,"nan":1,"no":6,"type":"单选题","kind":"single","stem":"按类的类型划分，不包括（ ）","options":[{"k":"A","t":"实体类"},{"k":"B","t":"边界类"},{"k":"C","t":"控制类"},{"k":"D","t":"事件类"}],"answer":"D","explain":"按职责划分，类分为实体类、边界类和控制类；「事件类」不在这一分类中。","own":1,"ref":"","score":null,"mine":"","paper":468291800,"key":1},{"id":"q170","ch":"m10","chName":"面向对象的方法","kp":"1889562377087750144","kpName":"类图（Class Diagram）的概念","mian":0,"zhong":1,"nan":1,"no":7,"type":"单选题","kind":"single","stem":"下列关于类图（Class Diagram）的描述中，哪一项是正确的？","options":[{"k":"A","t":"类图用于表示系统中所有的数据流"},{"k":"B","t":"类图主要用于描述系统中的类及其关系"},{"k":"C","t":"类图主要用于展示系统的动态行为"},{"k":"D","t":"类图用以表示用户与系统的交互"}],"answer":"B","explain":"类图是UML（统一建模语言）中用于表示系统中的类及其属性、操作和类之间关系的图示工具，主要描述的是系统的静态结构。选项A、C、D分别对应数据流图、时序图和用例图的功能，均不正确。","own":0,"ref":"","score":null,"mine":"","paper":461102093,"key":1},{"id":"q171","ch":"m10","chName":"面向对象的方法","kp":"1889562377087750144","kpName":"类图（Class Diagram）的概念","mian":0,"zhong":1,"nan":1,"no":8,"type":"单选题","kind":"single","stem":"在类图中，类的属性和操作通常被分别放置在哪个部分？","options":[{"k":"A","t":"类的属性位于顶部，操作位于中间"},{"k":"B","t":"类的属性位于中间，操作位于底部"},{"k":"C","t":"类的属性位于底部，操作位于顶部"},{"k":"D","t":"类的属性与操作没有固定位置"}],"answer":"B","explain":"在类图中，类通常被表示为一个矩形分为三部分：顶部是类名，中间是属性（Attributes），底部是操作（Operations）。因此，选项B正确。","own":0,"ref":"","score":null,"mine":"","paper":461102093,"key":1},{"id":"q172","ch":"m10","chName":"面向对象的方法","kp":"1889562377154859008","kpName":"类图的关系","mian":0,"zhong":1,"nan":1,"no":1,"type":"单选题","kind":"single","stem":"软件结构图中，模块框之间若有直线连接，表示它们之间存在（ ）。","options":[{"k":"A","t":"调用关系"},{"k":"B","t":"组成关系"},{"k":"C","t":"链接关系"},{"k":"D","t":"顺序执行关系"}],"answer":"A","explain":"软件结构图中模块框之间的直线（连线）表示调用关系，箭头方向表示调用方向。","own":1,"ref":"","score":null,"mine":"","paper":468904809,"key":1},{"id":"q173","ch":"m10","chName":"面向对象的方法","kp":"1889562377154859008","kpName":"类图的关系","mian":0,"zhong":1,"nan":1,"no":2,"type":"单选题","kind":"single","stem":"以下类图，指明其中描述的类、接口之间的关系：[图片]（ ）","options":[{"k":"A","t":"关联关系"},{"k":"B","t":"依赖关系"},{"k":"C","t":"泛化关系"},{"k":"D","t":"实现关系"}],"answer":"D","explain":"类与接口之间用虚线空心三角箭头表示，是 UML 中的实现（realization）关系；泛化是实线空心三角。","own":1,"ref":"","score":null,"mine":"","paper":468904809,"key":1},{"id":"q174","ch":"m10","chName":"面向对象的方法","kp":"1889562377154859008","kpName":"类图的关系","mian":0,"zhong":1,"nan":1,"no":3,"type":"单选题","kind":"single","stem":"类图中不包含（ ）","options":[{"k":"A","t":"类名"},{"k":"B","t":"属性"},{"k":"C","t":"方法"},{"k":"D","t":"事件"}],"answer":"D","explain":"类图的基本元素是类名、属性、方法（操作）；「事件」不是类图的组成部分。","own":1,"ref":"","score":null,"mine":"","paper":468904809,"key":1},{"id":"q175","ch":"m10","chName":"面向对象的方法","kp":"1889562377154859008","kpName":"类图的关系","mian":0,"zhong":1,"nan":1,"no":4,"type":"单选题","kind":"single","stem":"[图片]\n上图中,红色箭头表示的是( )关系?","options":[{"k":"A","t":"调用关系"},{"k":"B","t":"参数传递关系"},{"k":"C","t":"控制关系"},{"k":"D","t":"逻辑关系"}],"answer":"B","explain":"图中红色箭头连接模块并传递数据，表示参数传递关系，是模块间数据耦合的体现。","own":1,"ref":"","score":null,"mine":"","paper":468904809,"key":1},{"id":"q176","ch":"m10","chName":"面向对象的方法","kp":"1889562377154859008","kpName":"类图的关系","mian":0,"zhong":1,"nan":1,"no":5,"type":"单选题","kind":"single","stem":"[图片]\n上图中,黄色的线描述的是( )关系","options":[{"k":"A","t":"数据传送关系"},{"k":"B","t":"调用关系"},{"k":"C","t":"数据流向关系"},{"k":"D","t":"协调关系"}],"answer":"B","explain":"图中黄色连线表示一个模块调用另一个模块，属于调用关系，体现模块间的控制流向。","own":1,"ref":"","score":null,"mine":"","paper":468904809,"key":1},{"id":"q177","ch":"m10","chName":"面向对象的方法","kp":"1889562377154859008","kpName":"类图的关系","mian":0,"zhong":1,"nan":1,"no":6,"type":"单选题","kind":"single","stem":"通常发生在多个Use Case中，有可以提取出来的公共部分。那么提取出来的公共部分和其他Use Case之间的关系是（ ）","options":[{"k":"A","t":"extend"},{"k":"B","t":"include"},{"k":"C","t":"Generalization"},{"k":"D","t":"泛化关系"}],"answer":"B","explain":"多个用例中重复出现的公共部分被抽取成独立用例，由原用例「包含」，用 include 表示；扩展（extend）用于可选的增量行为。","own":1,"ref":"","score":null,"mine":"","paper":468904809,"key":1},{"id":"q178","ch":"m10","chName":"面向对象的方法","kp":"1889562377154859008","kpName":"类图的关系","mian":0,"zhong":1,"nan":1,"no":7,"type":"单选题","kind":"single","stem":"分析以下类图，指明其中描述的类、接口之间的关系[图片]：（ ）","options":[{"k":"A","t":"关联关系"},{"k":"B","t":"依赖关系"},{"k":"C","t":"泛化关系"},{"k":"D","t":"实现关系"}],"answer":"C","explain":"图示类之间用实线空心三角箭头连接，表示子类继承父类的泛化（继承）关系。","own":1,"ref":"","score":null,"mine":"","paper":461103003,"key":1},{"id":"q179","ch":"m10","chName":"面向对象的方法","kp":"1889562377884667904","kpName":"建立系统动态模型","mian":0,"zhong":0,"nan":0,"no":1,"type":"单选题","kind":"single","stem":"在建立系统动态模型的过程中，下列哪种方法主要用于描述系统的动态行为？","options":[{"k":"A","t":"数据流图"},{"k":"B","t":"状态图"},{"k":"C","t":"用例图"},{"k":"D","t":"类图"}],"answer":"B","explain":"状态图是主要用于描述系统动态行为的工具，它通过状态和状态之间的转换来建模系统的动态变化，而数据流图、用例图和类图更多地用于静态建模或系统功能的描述。","own":0,"ref":"","score":null,"mine":"","paper":461132777,"key":1},{"id":"q180","ch":"m10","chName":"面向对象的方法","kp":"1889562377884667904","kpName":"建立系统动态模型","mian":0,"zhong":0,"nan":0,"no":2,"type":"单选题","kind":"single","stem":"以下关于系统动态模型的描述，哪一项是正确的？","options":[{"k":"A","t":"动态模型只需要考虑系统的初始状态。"},{"k":"B","t":"动态模型用于表示系统的时间相关行为。"},{"k":"C","t":"动态模型完全由类图来描述。"},{"k":"D","t":"动态模型无需考虑外部事件的影响。"}],"answer":"B","explain":"系统动态模型的核心在于表示系统的时间相关行为，包括状态的变化、事件触发等。因此，选项B正确。初始状态和外部事件都是动态模型的重要组成部分，选项A和D错误；动态模型不仅限于类图，选项C错误。","own":0,"ref":"","score":null,"mine":"","paper":461132777,"key":1},{"id":"q181","ch":"m10","chName":"面向对象的方法","kp":"1889562377884667904","kpName":"建立系统动态模型","mian":0,"zhong":0,"nan":0,"no":3,"type":"单选题","kind":"single","stem":"在建立动态模型时，事件和状态的关系通常用哪种模型来表示？","options":[{"k":"A","t":"状态图"},{"k":"B","t":"类图"},{"k":"C","t":"活动图"},{"k":"D","t":"数据流图"}],"answer":"A","explain":"状态图是用来描述事件和状态之间关系的主要工具，它可以清晰地表示对象在生命周期中的状态变化及事件引发的状态转移。","own":0,"ref":"","score":null,"mine":"","paper":461132777,"key":1},{"id":"q182","ch":"m10","chName":"面向对象的方法","kp":"1889562377884667904","kpName":"建立系统动态模型","mian":0,"zhong":0,"nan":0,"no":4,"type":"单选题","kind":"single","stem":"在动态建模中，触发状态转换的关键因素是什么？","options":[{"k":"A","t":"类的属性"},{"k":"B","t":"事件"},{"k":"C","t":"对象的生命周期"},{"k":"D","t":"用例需求"}],"answer":"B","explain":"动态建模中，状态转换的发生主要由事件触发，事件是动态系统行为变化的直接原因，选项B为正确答案。","own":0,"ref":"","score":null,"mine":"","paper":461132777,"key":1}],"kaodian":[{"id":"k1","name":"数据流图 DFD","slides":"第 3–10 页","points":["四种基本符号：加工（圆/椭圆）、外部实体（方框）、数据流（带名箭头）、数据存储（双横线）","分层与父子图平衡：子图的输入/输出数据流必须与父图对应加工的输入/输出完全一致","第 0 层图只画外部实体与系统整体加工；再由功能描述反推外部实体（谁提交请求、谁接收结果）","功能分解是 DFD 细化的方法：把一个加工拆成若干子加工，再画子图","DFD 只描述逻辑功能，不涉及实现；描述物理系统的是系统流程图"],"qids":["q65","q66","q67","q68","q69","q70","q71","q72","q73","q74","q75","q76","q77","q78","q79","q80","q81","q82","q83","q84"],"kps":[{"id":"1889562366635544576","name":"需求分析","mian":0,"zhong":1,"nan":0},{"id":"1889562366895591424","name":"数据流图","mian":0,"zhong":1,"nan":0},{"id":"1889562367235330048","name":"数据字典","mian":0,"zhong":0,"nan":0},{"id":"1889562367646371840","name":"加工逻辑的定义、常用技术和作用","mian":0,"zhong":0,"nan":0},{"id":"1889562367713480704","name":"结构化语言","mian":0,"zhong":0,"nan":0},{"id":"1889562368132911104","name":"结构化分析方法","mian":0,"zhong":0,"nan":0}],"skipped":6,"allQids":["q65","q66","q67","q68","q69","q70","q71","q72","q73","q74","q75","q59","q60","q61" ,"mian":0,"zhong":1,"nan":0},{"id":"1889562371953922048","name":"详细设计工具——N-S图（盒图）","mian":0,"zhong":1,"nan":0},{"id":"1889562372025225216","name":"详细设计工具——PAD图","mian":0,"zhong":1,"nan":0}],"skipped":0,"allQids":["q117","q118","q119","q120","q121","q122","q123","q124","q125","q126","q127","q128","q129","q130"],"missing":[]},{"id":"k4","name":"测试用例设计","slides":"第 81–140 页","points":["白盒 · 逻辑覆盖：语句覆盖、判定覆盖、条件覆盖、判定/条件覆盖、条件组合覆盖、路径覆盖（覆盖强度递增）","白盒 · 路径测试：画流图、算环路复杂度 V(G)=E−N+2，找出基本路径集设计用例","黑盒 · 等价分类法：划分有效/无效等价类 → 编号 → 每条用例尽量覆盖多个有效类、每个无效类单独一条","黑盒 · 边界值分析：取边界值及边界两侧（如 1≤x≤100，取 0、1、100、101）","错误推测法：凭经验列出易错情形补充用例","实用策略：单元测试→集成测试；黑盒为主、白盒补充，用例要能发现错误而非证明正确"],"qids":["q131","q132","q133","q134","q135","q136","q137"],"kps":[{"id":"1889562372885057536","name":"测试方法","mian":0,"zhong":1,"nan":0},{"id":"1889562375099650048","name":"调试","mian":0,"zhong":0,"nan":0},{"id":"1889562375166758912","name":"自动测试工具","mian":0,"zhong":0,"nan":0}],"skipped":0,"allQids":["q131","q132","q133","q134","q135","q136","q137"],"missing":["软件测试概述及步骤","逻辑覆盖法","路径测试法","穷举测试","等价分类法","边界值分析法","错误推测法","单元测试","集成测试"]},{"id":"k5","name":"面向对象建模","slides":"第 141–147 页","points":["建立对象与类模型：识别类（实体类、边界类、控制类）→ 确定属性与操作 → 确定类间关系","类间关系：关联、聚合/组合、泛化（继承）、依赖、实现（类实现接口）","Use Case 图：描述系统与外部参与者（Actor）的关系，用例由 Actor 发起并为其提供价值","交互图（顺序图/协作图）：按时间顺序描述对象之间的消息交互，用于「提交报销申请」这类流程"],"qids":["q149","q150","q151","q152","q153","q154","q155","q156","q157","q158","q159","q160","q161","q162","q163","q164","q165","q166","q167","q168","q169","q170","q171","q172","q173","q174","q175","q176","q177","q178","q179","q180","q181","q182"],"kps":[{"id":"1889562375770738688","name":"面向对象方法概述","mian":0,"zhong":0,"nan":0},{"id":"1889562376181780480","name":"面向对象基本概念","mian":0,"zhong":1,"nan":1},{"id":"1889562376450215936","name":"UML建模概述","mian":0,"zhong":1,"nan":0},{"id":"1889562376651542528","name":"Use Case图","mian":0,"zhong":1,"nan":1},{"id":"1889562377087750144","name":"类图（Class Diagram）的概念","mian":0,"zhong":1,"nan":1},{"id":"1889562377154859008","n
