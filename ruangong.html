<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById("appdata").textContent);
var CH = DATA.chapters, KPS = DATA.kps, Q = DATA.questions;
var QM = {}, KM = {}, CM = {};
Q.forEach(function(q){ QM[q.id] = q; });
KPS.forEach(function(k){ KM[k.id] = k; });
CH.forEach(function(c){ CM[c.id] = c; });

/* ---------- storage ---------- */
var LS_KEY = "quiz_v3:" + (DATA.course || "default");
var HAS_LS = (function(){ try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; } catch(e){ return false; } })();
var store = load();
function load(){
  if(!HAS_LS) return { rec:{}, fav:[], resume:null, daily:{} };
  try{
    var s = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
    return { rec: s.rec||{}, fav: s.fav||[], resume: s.resume||null, daily: s.daily||{} };
  }catch(e){ return { rec:{}, fav:[], resume:null, daily:{} }; }
}
function save(){ if(!HAS_LS) return; try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){} }

var S = { view:"home", deck:[], idx:0, ans:{}, pick:[], title:"", t0:0, stat:{r:0,w:0} };

function $(s,r){ return (r||document).querySelector(s); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
function today(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function rec(id){ return store.rec[id] || {c:0,w:0,last:null}; }
function isFav(id){ return store.fav.indexOf(id) >= 0; }
function pct(a,b){ return b ? Math.round(a/b*100) : 0; }

function ring(p,size,stroke,color,track){
  size=size||84; stroke=stroke||9;
  var r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-Math.max(0,Math.min(1,p)));
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
    +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+(track||"#EDEDED")+'" stroke-width="'+stroke+'"/>'
    +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+(color||"#58CC02")+'" stroke-width="'+stroke
    +'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off
    +'" transform="rotate(-90 '+size/2+' '+size/2+')"/></svg>';
}
function toast(m){ var t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove("on");},1500); }

function chStats(cid){ var c=CM[cid],d=0,r=0; c.qids.forEach(function(id){var x=store.rec[id]; if(x){d++; if(x.last==="right") r++;}}); return {total:c.qids.length,done:d,right:r}; }
function kpStats(kid){ var k=KM[kid],d=0,r=0; k.qids.forEach(function(id){var x=store.rec[id]; if(x){d++; if(x.last==="right") r++;}}); return {total:k.qids.length,done:d,right:r}; }
function gStats(){ var d=0,r=0,w=0; Q.forEach(function(q){var x=store.rec[q.id]; if(x){d++; if(x.last==="right") r++; else w++;}}); return {total:Q.length,done:d,right:r,wrong:w}; }
function dailyCount(){ var k=today(); return (store.daily[k]&&store.daily[k].n)||0; }

/* ---------- home ---------- */
var GOAL = 20;
function viewHome(){
  var g=gStats(), dn=dailyCount();
  var h='';
  h+='<div class="hhead"><div class="logo">'
    +'<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#58CC02"/><text x="32" y="44" font-size="26" font-weight="bold" text-anchor="middle" fill="#fff" font-family="sans-serif">✓</text></svg>'
    +esc(DATA.course)+'</div><span class="spacer"></span>'
    +'<span class="pill">🔥 '+dn+'</span>'
    +'<button class="iconbtn" data-act="settings" title="进度与设置">⚙</button></div>';

  h+='<div class="daily"><div class="ring">'+ring(Math.min(1,dn/GOAL),76,9,"#58CC02","#EDEDED")
    +'<b>'+dn+'<small>/'+GOAL+'</small></b></div>'
    +'<div class="info"><div class="kicker">今日目标</div><div class="h1">'
    +(dn>=GOAL?'目标达成，继续加练！':'再刷 '+(GOAL-dn)+' 题就达标')+'</div>'
    +'<div class="sub">已练 '+g.done+'/'+g.total+' 题 · 正确率 '+pct(g.right,g.done)+'% · 待复习 '+g.wrong+'</div></div></div>';

  h+='<div class="quick">'
    +'<button data-act="continue"><em>▶</em>'+(store.resume?'继续':'开始')+'</button>'
    +'<button data-act="random"><em>🎲</em>随机</button>'
    +'<button data-act="wrong"><em>✏️</em>错题</button>'
    +'<button data-act="fav"><em>⭐</em>收藏</button>'
    +'</div>';

  if(DATA.kaodian && DATA.kaodian.length){
    h+='<div class="sec"><span class="t">期末重点 · 老师 PPT</span><button class="l" data-act="kd">全部 ›</button></div>';
    h+='<div class="list">';
    DATA.kaodian.forEach(function(k){
      h+='<div class="item kdrow" data-kdopen="'+k.id+'"><span class="chip key">★</span>'
        +'<b>'+esc(k.name)+'</b><span class="kdrow-n">'+k.qids.length+' 题</span><span class="kdrow-a">›</span></div>';
    });
    h+='</div>';
  }

  h+='<div class="pathwrap"><div class="path-title">学习路径 · '+CH.length+' 个板块</div><div class="path">';
  CH.forEach(function(c,i){
    var st=chStats(c.id), p=pct(st.right,st.total), full=p>=100;
    h+='<div class="step"><button class="node'+(full?' done':'')+'" data-ch="'+c.id+'" '
      +'style="background:'+(full?'':'linear-gradient(180deg,'+c.color+',shade)')+';background-color:'+c.color+'">'
      +'<span class="pct">'+(full?'★':p+'%')+'</span></button>'
      +'<div class="label">'+esc(c.name)+'<small>'+st.total+' 题 · 已掌握 '+st.right+'</small></div>'
      +(i===0?'<div class="start">START</div>':'')+'</div>';
  });
  h+='</div></div>';
  return h;
}

/* ---------- study ---------- */
function startDeck(ids,title){
  if(!ids.length){ toast("这里还没有题目"); return; }
  S.deck=ids.slice(); S.idx=0; S.ans={}; S.pick=[]; S.title=title||""; S.stat={r:0,w:0}; S.t0=Date.now();
  S.view="study"; render();
}
function viewStudy(){
  if(S.idx>=S.deck.length) return viewSummary();
  var q=QM[S.deck[S.idx]], a=S.ans[q.id], r0=rec(q.id);
  var p=(S.idx+1)/S.deck.length;
  var h='<div class="top"><button class="iconbtn" data-act="home">←</button>'
    +'<div class="ttl">'+(S.idx+1)+' / '+S.deck.length+'</div>'
    +'<button class="iconbtn" data-act="kp-quick">◈</button></div>'
    +'<div class="bar"><i style="width:'+(p*100)+'%"></i></div>';
  h+='<div class="card"><div class="ctop"><span class="chip type">'+esc(q.type)+'</span>'
    +(q.key?'<span class="chip key">★ 考点</span>':'')
    +(q.zhong?'<span class="chip zhong">重点</span>':'')
    +(q.nan?'<span class="chip nan">难点</span>':'')
    +(q.mian?'<span class="chip mian">免考</span>':'')
    +'<button class="fav'+(isFav(q.id)?" on":"")+'" data-act="fav">'+(isFav(q.id)?"★":"☆")+'</button></div>'
    +'<div class="stem">'+esc(q.stem).split("\n").join("<br>")+'</div>';

  if(q.kind==="text"){
    h+='<div class="opts"><button class="opt" data-act="reveal"><span class="k">?</span><span>简答题：先自己想，再点“看参考答案”</span></button></div>';
  } else {
    h+='<div class="opts">';
    q.options.forEach(function(o){
      var cls="opt";
      if(a){
        if(q.kind==="multi"){ var corr=q.answer.indexOf(o.k)>=0, ch=(a.picked||[]).indexOf(o.k)>=0;
          if(corr) cls+=" ok"; else if(ch) cls+=" bad"; }
        else if(q.kind==="judge"){ if(o.t===q.answer) cls+=" ok"; else if(a.picked===o.t) cls+=" bad"; }
        else { if(o.k===q.answer) cls+=" ok"; else if(a.picked===o.k) cls+=" bad"; }
      } else if(q.kind==="multi" && S.pick.indexOf(o.k)>=0) cls+=" sel";
      h+='<button class="'+cls+'" data-opt="'+esc(o.k)+'" data-txt="'+esc(o.t)+'">'
        +'<span class="k">'+esc(o.k)+'</span><span>'+esc(o.t)+'</span></button>';
    });
    h+='</div>';
    if(q.kind==="multi" && !a){
      h+='<div style="margin-top:12px"><button class="btn primary wide" data-act="confirm"'+(S.pick.length?'':' disabled')+'>确认选择（'+S.pick.length+'）</button></div>';
    }
  }
  if(a) h+=feedback(q,a,r0);
  h+='</div>';
  h+='<div class="ctrl"><button class="btn ghost" data-act="prev"'+(S.idx===0?' disabled':'')+'>上一题</button>'
    +'<button class="btn ghost" data-act="reveal"'+(a?' disabled':'')+'>看答案</button>'
    +'<button class="btn primary" data-act="next">'+(S.idx===S.deck.length-1?'完成':'下一题')+'</button></div>';
  h+='<div class="meta">'+esc(q.chName)+' · 第 '+q.no+' 题'+(q.score?' · '+q.score+' 分':'')+'</div>';
  return h;
}
function optText(q,k){ var o=(q.options||[]).filter(function(x){return x.k===k;})[0]; return o?(k+"「"+o.t+"」"):k; }
function pickedText(q,a){
  if(!a.picked) return "（未作答）";
  if(q.kind==="multi") return a.picked.map(function(k){return optText(q,k);}).join("、");
  if(q.kind==="judge") return a.picked;
  return optText(q,a.picked);
}
function rightText(q){
  if(q.kind==="judge"||q.kind==="text") return q.answer||"见参考答案";
  return String(q.answer||"").split("").map(function(k){return optText(q,k);}).join("、");
}
function feedback(q,a,r0){
  var ok=a.ok, h='<div class="fb '+(ok?"ok":"bad")+'">';
  h+='<div class="head">'+(ok?"✓ 答对了":(a.revealed?"○ 已看答案":"✕ 答错了"))
    +'<span class="ans">正确答案 '+esc(rightText(q))+'</span></div>';
  h+='<div class="kp">知识点 <button class="kplink" data-kp="'+q.kp+'">'+esc(q.kpName)+'</button>'
    +'<span>该知识点 '+kpStats(q.kp).total+' 题 · 已掌握 '+kpStats(q.kp).right+'</span></div>';
  if(!ok && a.picked){
    h+='<div class="why"><b>错因分析</b><div class="line2">你选的是 <em>'+esc(pickedText(q,a))+'</em><br>正确答案是 <i>'+esc(rightText(q))+'</i></div></div>';
  }
  if(q.explain) h+='<div class="exp">'+(q.own?'解析（整理补充）：':'解析：')+esc(q.explain)+'</div>';
  if(q.kind==="text" && q.ref) h+='<div class="ref"><b>参考答案</b>'+esc(q.ref)+'</div>';
  if(r0.c+r0.w>0) h+='<div class="exp" style="color:#9A9A9A">历史：答对 '+r0.c+' 次，答错 '+r0.w+' 次</div>';
  h+='</div>';
  return h;
}
function judge(q,p){
  if(q.kind==="single") return p===q.answer;
  if(q.kind==="judge") return p===q.answer;
  if(q.kind==="multi") return p.slice().sort().join("")===q.answer.split("").sort().join("");
  return false;
}
function commit(q,ok,picked,revealed){
  S.ans[q.id]={ok:ok,picked:picked,revealed:!!revealed};
  var r=store.rec[q.id]||{c:0,w:0,last:null};
  if(ok) r.c++; else r.w++;
  r.last = ok?"right":"wrong";
  store.rec[q.id]=r;
  if(ok) S.stat.r++; else S.stat.w++;
  var k=today(); store.daily[k]=store.daily[k]||{n:0}; store.daily[k].n++;
  save(); render();
}

/* ---------- summary ---------- */
function viewSummary(){
  var t=S.stat.r+S.stat.w, secs=Math.max(1,Math.round((Date.now()-S.t0)/1000));
  var mm=Math.floor(secs/60), ss=secs%60;
  var h='<div class="top"><button class="iconbtn" data-act="home">←</button><div class="ttl">本轮完成</div><span style="width:38px"></span></div>';
  h+='<div class="sum"><div style="display:inline-block">'+ring(S.stat.r/Math.max(1,t),132,11,"#58CC02","#EDEDED")+'</div>';
  h+='<h2>'+pct(S.stat.r,t)+'% 正确</h2><p>'+esc(S.title||"本轮练习")+'</p>';
  h+='<div class="sumstats"><div><b>'+t+'</b>题数</div><div><b style="color:#58CC02">'+S.stat.r+'</b>答对</div>'
    +'<div><b style="color:#FF4B4B">'+S.stat.w+'</b>答错</div><div><b>'+mm+':'+(ss<10?"0":"")+ss+'</b>用时</div></div>';

}

}
function closeSheet(){ $("#sheetWrap").hidden=true; }

/* ---------- render ---------- */
function render(){
  var app=$("#app");
  if(S.view==="home") app.innerHTML=viewHome();
  else if(S.view==="study") app.innerHTML=viewStudy();
  else if(S.view==="summary") app.innerHTML=viewSummary();
  else if(S.view==="kp") app.innerHTML=viewKP();
  else if(S.view==="kd") app.innerHTML=viewKD();
  else if(S.view==="wrong") app.innerHTML=viewWrong();
  else if(S.view==="fav") app.innerHTML=viewFav();
  window.scrollTo(0,0);
  bind();
  if(S.view==="study" && HAS_LS){ store.resume={deck:S.deck,idx:S.idx,ans:S.ans,title:S.title}; save(); }
}

function bind(){
  var app=$("#app");
  app.querySelectorAll("[data-ch]").forEach(function(el){
    el.onclick=function(){ var c=CM[el.dataset.ch]; startDeck(c.qids,c.name); };
  });
  app.querySelectorAll("[data-kp]").forEach(function(el){
    el.onclick=function(e){ e.stopPropagation(); openKP(el.dataset.kp); };
  });
  app.querySelectorAll("[data-kdopen]").forEach(function(el){
    el.onclick=function(){ S.view="kd"; render(); };
  });
  app.querySelectorAll("[data-kd]").forEach(function(el){
    el.onclick=function(){ var k=(DATA.kaodian||[]).filter(function(x){return x.id===el.dataset.kd;})[0];
      if(k&&k.qids.length) startDeck(k.qids.slice(),k.name); };
  });
  app.querySelectorAll("[data-kdall]").forEach(function(el){
    el.onclick=function(){ var k=(DATA.kaodian||[]).filter(function(x){return x.id===el.dataset.kdall;})[0];
      if(k&&k.allQids) startDeck(k.allQids.slice(),k.name+"（含免考）"); };
  });
  app.querySelectorAll("[data-jump]").forEach(function(el){
    el.onclick=function(){ startDeck([el.dataset.jump],"单题重做"); };
  });
  app.querySelectorAll("[data-opt]").forEach(function(el){
    el.onclick=function(){
      var q=QM[S.deck[S.idx]]; if(S.ans[q.id]) return;
      if(q.kind==="multi"){ var k=el.dataset.opt,i=S.pick.indexOf(k); if(i>=0) S.pick.splice(i,1); else S.pick.push(k); render(); return; }
      var picked=(q.kind==="judge")?el.dataset.txt:el.dataset.opt;
      commit(q,judge(q,picked),picked,false);
    };
  });
  app.querySelectorAll("[data-act]").forEach(function(el){
    el.onclick=function(){
      var act=el.dataset.act;
      if(act==="home"){ S.view="home"; render(); }
      else if(act==="settings"){ openSettings(); }
      else if(act==="import"){
        var box=$("#impBox"), v=(box&&box.value||"").trim();
        if(v.indexOf("ZHS1-")!==0){ toast("进度码格式不对"); return; }
        try{
          var obj=JSON.parse(decodeURIComponent(escape(atob(v.slice(5)))));
          if(!obj||!obj.rec) throw 0;
          store.rec=obj.rec||{}; store.fav=obj.fav||[]; store.daily=obj.daily||obj.streak||{};
          save(); closeSheet(); render(); toast("已导入");
        }catch(e){ toast("导入失败，检查进度码是否完整"); }
      }
      else if(act==="reset"){
        if(!confirm("确定清空全部进度？收藏和错题也会删除。")) return;
        store={rec:{},fav:[],resume:null,daily:{}}; save(); closeSheet(); render(); toast("已清空");
      }
      else if(act==="close"){ closeSheet(); }
      else if(act==="continue"){
        if(store.resume&&store.resume.deck&&store.resume.deck.length){
          S.deck=store.resume.deck.slice(); S.idx=Math.min(store.resume.idx||0,S.deck.length-1);
          S.ans=store.resume.ans||{}; S.title=store.resume.title||""; S.stat={r:0,w:0}; S.t0=Date.now();
          S.view="study"; render();
        } else { var c=CH[0]; startDeck(c.qids,c.name); }
      }
      else if(act==="random"){ var ids=Q.map(function(q){return q.id;}).sort(function(){return Math.random()-.5;}).slice(0,20);
        startDeck(ids,"随机 20 题"); }
      else if(act==="wrong"){ S.view="wrong"; render(); }
      else if(act==="fav"){ if(S.view==="study"){ toggleFav(); } else { S.view="fav"; render(); } }
      else if(act==="fav-start"){ startDeck(store.fav.slice(),"收藏题"); }
      else if(act==="wrong-start"){ var bad=Q.filter(function(q){var r=store.rec[q.id]; return r&&r.last==="wrong";}).map(function(q){return q.id;});
        startDeck(bad,"错题复习"); }
      else if(act==="kp"){ S.view="kp"; render(); }
      else if(act==="kd"){ S.view="kd"; render(); }
      else if(act==="kp-quick"){ openKP(QM[S.deck[S.idx]].kp); }
      else if(act==="kp-practice"){ var k=KM[el.dataset.kp]; closeSheet(); startDeck(k.qids,k.name); }
      else if(act==="confirm"){ var q3=QM[S.deck[S.idx]]; if(!S.pick.length) return;
        commit(q3,judge(q3,S.pick),S.pick.slice(),false); S.pick=[]; }
      else if(act==="reveal"){ var q4=QM[S.deck[S.idx]]; if(S.ans[q4.id]) return; commit(q4,false,null,true); }
      else if(act==="prev"){ if(S.idx>0){ S.idx--; S.pick=[]; render(); } }
      else if(act==="next"){ if(S.idx<S.deck.length-1){ S.idx++; S.pick=[]; render(); } else { S.view="summary"; render(); } }
      else if(act==="again"){ var w=S.deck.filter(function(id){var a=S.ans[id]; return a&&!a.ok;});
        startDeck(w.length?w:S.deck.slice(), w.length?"错题重做":S.title); }
    };
  });
}
function toggleFav(){
  var q=QM[S.deck[S.idx]], i=store.fav.indexOf(q.id);
  if(i>=0){ store.fav.splice(i,1); toast("已取消收藏"); } else { store.fav.push(q.id); toast("已收藏，首页⭐里查看"); }
  save(); render();
}

document.addEventListener("click",function(e){ if(e.target.id==="sheetWrap") closeSheet(); });
document.addEventListener("keydown",function(e){
  if(S.view!=="study") return;
  var q=QM[S.deck[S.idx]];
  if(e.key==="ArrowRight"||e.key==="Enter"||e.key===" "){
    e.preventDefault();
    if(S.idx<S.deck.length-1){ S.idx++; S.pick=[]; render(); } else { S.view="summary"; render(); }
  } else if(e.key==="ArrowLeft"){ if(S.idx>0){ S.idx--; S.pick=[]; render(); } }
  else if(/^[a-eA-E1-5]$/.test(e.key) && !S.ans[q.id]){
    var idx="abcde".indexOf(e.key.toLowerCase()); if(idx<0) idx="12345".indexOf(e.key);
    var o=q.options[idx]; if(!o) return;
    if(q.kind==="multi"){ var i=S.pick.indexOf(o.k); if(i>=0) S.pick.splice(i,1); else S.pick.push(o.k); render(); }
    else { var picked=(q.kind==="judge")?o.t:o.k; commit(q,judge(q,picked),picked,false); }
  }
});
(function(){
  var x0=null,y0=null;
  document.addEventListener("touchstart",function(e){ if(S.view!=="study") return; x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  document.addEventListener("touchend",function(e){
    if(S.view!=="study"||x0===null) return;
    var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6){
      if(dx<0){ if(S.idx<S.deck.length-1){ S.idx++; S.pick=[]; render(); } }
      else { if(S.idx>0){ S.idx--; S.pick=[]; render(); } }
    }
  },{passive:true});
})();
render();
window.__quiz={start:startDeck,state:S,go:function(v){S.view=v;render();},kp:openKP};
})();
</script>
